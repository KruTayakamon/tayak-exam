# บริบทสำหรับผู้ใหญ่ทุกคน (มติบอส 17 พ.ย. 2569 แบรนด์ CEFR for You) · ไวยากรณ์และคำศัพท์คงเดิมจากฉบับ 16 พ.ย.
# ผังเนื้อหาคอร์ส c2 (เป้าหมาย C2) · 12 สัปดาห์ ระดับเซสชัน · 16 พ.ย. 2569 (บอสสั่งเพิ่มคอร์สนี้ 16 พ.ย.)
# ผู้เขียนเนื้อหา: ทำตามผังนี้ ห้ามเปลี่ยนหัวข้อ ลำดับ หรือรายการศัพท์เอง ถ้าเห็นว่าควรเปลี่ยนให้เสนอบอส
# คลังเกมครัวไม่มีระดับ C2: ศัพท์ทั้ง 144 คำและข้อทั้งหมดต้องเขียนใหม่ (vocab_new = vocab)
# ระดับนี้วัดความแม่น ความเป็นธรรมชาติ และการอ่านเชิงวิเคราะห์ มากกว่ากติกาไวยากรณ์ใหม่ บทเรียนจึงเน้น "เลือกอย่างไรให้เหมาะ"
# รูปแบบไฟล์รายสัปดาห์และกติกาการเขียน: docs/writing/cefr.md · ต้นแบบ: course/cefr/b1/w01.yaml
course: cefr/c2
