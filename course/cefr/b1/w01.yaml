# คอร์ส b1 · สัปดาห์ 1 (ต้นแบบของรูปแบบไฟล์คอร์ส) · draft รอบอสตรวจ · 16 พ.ย. 2569 · ปรับบริบทเป็นผู้ใหญ่ทั่วไป 17 พ.ย.
course: cefr/b1
week: 1
phase: 1
theme_th: ตัวฉันและงานของฉัน
focus_th: present simple กับ present continuous · กริยาบอกสภาวะ · การตั้งคำถาม
can_do_th:            # เขียนเอง ไม่คัดลอกคำอธิบาย CEFR · แสดงเมื่อจบสัปดาห์
  - บอกได้ว่าตัวเองทำงานหรือเรียนอะไร ที่ไหน และช่วงนี้กำลังทำอะไรอยู่
  - อ่านข่าวสั้นแล้วจับได้ว่าใคร ทำอะไร เมื่อไร
  - ฟังประกาศสั้นแล้วจับเวลาและสถานที่ได้
status: approved
sessions:
  - day: 1
    type: lesson
    skill: gm
    minutes: 20
    title_th: กิจวัตร หรือ กำลังทำอยู่ตอนนี้
    lesson:
      rule_th: "เรื่องที่ทำเป็นประจำ ใช้ ==present simple== ส่วนเรื่องที่กำลังทำอยู่ตอนนี้ หรือทำแค่ช่วงนี้ ใช้ ==present continuous== (am/is/are + กริยา -ing) จำแค่นี้ก่อนเลย"
      examples:
        - {en: "I <k>check</k> my email <k>every day</k>.", th: "มี every day แปลว่าทำเป็นประจำ"}
        - {en: "I <k>am working</k> from home <k>this month</k>.", th: "this month คือแค่เดือนนี้ เดี๋ยวก็เปลี่ยน"}
        - {en: "The kids <k>are sleeping</k> <k>now</k>.", th: "now คือกำลังเกิดอยู่ตรงหน้าเลย"}
        - {en: "She <k>works</k> at a bank.", th: "ประธานคนเดียว (she) อย่าลืม ++เติม -s หรือ -es++"}
      signals:
        - {label_th: present simple, words: [always, usually, often, every day, twice a week, on Mondays]}
        - {label_th: present continuous, words: [now, right now, at the moment, today, this week, this month, "Look!"]}
      thai_trap:
        intro_th: "ภาษาไทยเราไม่ผันกริยา แถมคำว่ากำลังก็ชอบละ พอเขียนอังกฤษเลยมัก ~~ลืม am/is/are~~ หรือ ~~ลืมเติม -s~~ กันบ่อยมาก"
        wrong: ["I working from home this month.", "She work at a bank."]
        right: ["I am working from home this month.", "She works at a bank."]
      notes:
        - {kind: tip, th: "เห็น every, usually, always เมื่อไร นึกถึง present simple ไว้ก่อน"}
        - {kind: warn, th: "กริยา -ing อยู่ตัวเดียวไม่ได้นะ ต้องมี am/is/are นำหน้าเสมอ"}
    check: [cefr-b1-w01-001, cefr-b1-w01-002]
    practice: [cefr-b1-w01-003, cefr-b1-w01-004, cefr-b1-w01-005, cefr-b1-w01-006, cefr-b1-w01-007, cefr-b1-w01-008, cefr-b1-w01-009, cefr-b1-w01-010, cefr-b1-w01-011, cefr-b1-w01-012]
    use:
      prompt_th: เขียน 2 ประโยคเกี่ยวกับงานของคุณ ประโยคแรกเป็นสิ่งที่ทำประจำ ประโยคที่สองเป็นสิ่งที่กำลังทำช่วงนี้
      frame: "I usually ____. This week I am ____."
      model: "I usually start work at eight. This week I am preparing a sales report."
    classroom: {en: "What are you working on at the moment?", th: "ช่วงนี้ทำงานอะไรอยู่ (ถามเพื่อนร่วมงานได้ทุกวัน)"}
  - day: 2
    type: lesson
    skill: vo
    minutes: 20
    title_th: คำศัพท์เรื่องงานและการเรียน 12 คำ
    lesson:
      rule_th: "เคล็ดลับวันนี้คือ ==จำคำเป็นก้อน== ไม่จำทีละคำ เช่น attend a meeting, responsible for, hand in an assignment จำทั้งก้อนแล้วเอาไปพูดได้เลย ++ไม่ต้องมานั่งเดาบุพบท++"
      examples:
        - {en: "<k>attend</k> a meeting", th: "เข้าร่วมประชุม ตรงนี้ ~~ไม่มี to~~ นะ"}
        - {en: "be <k>responsible for</k> the library", th: "รับผิดชอบห้องสมุด จำเป็นคู่ ==responsible for=="}
        - {en: "<k>hand in</k> an assignment before the <k>deadline</k>", th: "ส่งงานก่อนกำหนดส่ง ได้มาทีเดียวสองคำเลย"}
        - {en: "a member of <k>staff</k>", th: "บุคลากรหนึ่งคน staff เป็นคำรวม ~~ไม่เติม -s~~"}
      words:
        - {w: colleague, pos: n., th: เพื่อนร่วมงาน, ex: "My colleagues are very helpful."}
        - {w: timetable, pos: n., th: ตารางเวลา, ex: "Check the train timetable before you go."}
        - {w: attend, pos: v., th: เข้าร่วม, ex: "All staff attend the meeting on Monday."}
        - {w: responsible, pos: adj., th: รับผิดชอบ, ex: "I am responsible for the new project."}
        - {w: prepare, pos: v., th: เตรียม, ex: "She prepares her presentation at night."}
        - {w: staff, pos: n., th: บุคลากร, ex: "The staff room is on the second floor."}
        - {w: subject, pos: n., th: วิชา หัวข้อ, ex: "My favourite subject at school was history."}
        - {w: assignment, pos: n., th: งานที่มอบหมาย, ex: "The assignment is due on Friday."}
        - {w: deadline, pos: n., th: กำหนดส่ง, ex: "We must meet the deadline."}
        - {w: improve, pos: v., th: ทำให้ดีขึ้น, ex: "Practice every day will improve your English."}
        - {w: experience, pos: n., th: ประสบการณ์, ex: "He has a lot of experience."}
        - {w: currently, pos: adv., th: ในช่วงนี้, ex: "We are currently using the small meeting room."}
      thai_trap:
        intro_th: "เราชอบแปลตรงตัวจากไทย คำว่า เข้าร่วม ประชุม เลยแอบมี to โผล่มา ส่วน รับผิดชอบ ของ ก็กลายเป็น ~~responsible of~~ ไปซะงั้น"
        wrong: ["attend to the meeting", "responsible of the library", "all the staffs"]
        right: ["attend the meeting", "responsible for the library", "all the staff"]
      notes:
        - {kind: tip, th: "จดศัพท์ใหม่แบบ ==คำ + คู่ของมัน== เสมอ เช่น attend + a meeting จะจำง่ายกว่าเยอะ"}
        - {kind: warn, th: "staff กับ information นับไม่ได้ ห้ามเติม -s นะ"}
    check: [cefr-b1-w01-013, cefr-b1-w01-014]
    practice: [cefr-b1-w01-015, cefr-b1-w01-016, cefr-b1-w01-017, cefr-b1-w01-018, cefr-b1-w01-019, cefr-b1-w01-020, cefr-b1-w01-021, cefr-b1-w01-022, cefr-b1-w01-023, cefr-b1-w01-024]
    use:
      prompt_th: เขียน 1 ประโยคบอกว่าคุณรับผิดชอบงานอะไร (ที่ทำงาน ที่บ้าน หรือที่เรียน)
      frame: "I am responsible for ____."
      model: "I am responsible for the monthly budget in my team."
    classroom: {en: "Could you send it to me by Friday?", th: "ช่วยส่งให้ภายในวันศุกร์ได้ไหม"}
  - day: 3
    type: lesson
    skill: gm
    minutes: 20
    title_th: กริยาที่ไม่ใช้ -ing และการตั้งคำถาม
    lesson:
      rule_th: "กริยาที่เป็นเรื่องในหัวหรือในใจ เช่น know, like, need ==ไม่ใช้ -ing== ถึงจะหมายถึงตอนนี้ก็ตาม ส่วนคำถามต้องมี ++do/does นำหน้า++ หรือย้าย am/is/are มาไว้หน้าประธาน"
      examples:
        - {en: "I <k>know</k> the answer.", th: "รู้อยู่ในหัว ~~ไม่ใช้ I am knowing~~"}
        - {en: "We <k>need</k> more chairs.", th: "need ก็เป็นเรื่องในใจ ใช้รูปธรรมดาพอ"}
        - {en: "<k>Does</k> she <k>work</k> on Saturdays?", th: "Does มาแล้ว กริยาหลัก ==ไม่ต้องเติม -s== อีก"}
        - {en: "What <k>are</k> you <k>doing</k>?", th: "ถามว่ากำลังทำอะไร ย้าย are มาไว้หน้า you"}
      signals:
        - {label_th: กริยาบอกสภาวะที่พบบ่อย, words: [know, understand, believe, "think (เห็นว่า)", want, need, like, prefer, belong, "have (มี)"]}
      thai_trap:
        intro_th: "ภาษาไทยแค่เติม ไหม ท้ายประโยคก็เป็นคำถามแล้ว พอพูดอังกฤษเลยชอบ ~~ลืม do/does~~ ทั้งที่ขาดไม่ได้เลย"
        wrong: ["You work on Saturdays?", "Where she comes from?", "I am understanding."]
        right: ["Do you work on Saturdays?", "Where does she come from?", "I understand."]
      notes:
        - {kind: pin, th: "คำถามปัจจุบันจำสูตรเดียว ==Do/Does + คน + กริยาเดิม== ใช้ได้แทบทุกครั้ง"}
        - {kind: use, th: "เอาไปถามได้เลย Do you like your new job? คนฟังยิ้มแน่นอน"}
    check: [cefr-b1-w01-025, cefr-b1-w01-028]
    practice: [cefr-b1-w01-026, cefr-b1-w01-027, cefr-b1-w01-029, cefr-b1-w01-030, cefr-b1-w01-031, cefr-b1-w01-032, cefr-b1-w01-033, cefr-b1-w01-034]
    use:
      prompt_th: เขียนคำถาม 2 ข้อที่จะถามเพื่อนร่วมงานคนใหม่ ข้อหนึ่งถามกิจวัตร อีกข้อถามสิ่งที่กำลังทำช่วงนี้
      frame: "What time do you ____? What are you ____ this month?"
      model: "What time do you usually start work? What are you working on this month?"
    classroom: {en: "Does that make sense? Do you need any help?", th: "เข้าใจไหม ต้องการให้ช่วยอะไรไหม"}
  - day: 4
    type: lesson
    skill: rd
    minutes: 20
    title_th: อ่านข่าวสั้นและฟังประกาศ จับ ใคร ทำอะไร เมื่อไร ที่ไหน
    lesson:
      rule_th: "ทริกวันนี้ ==อ่านคำถามก่อน== แล้วค่อยอ่านบท จะรู้ว่าต้องหาอะไร คำตอบมักใช้ ++คำคนละคำแต่ความหมายเดียวกัน++ เช่น preparing = getting ready และคำถามมักเรียงตามลำดับเนื้อหา"
      examples:
        - {en: "She runs the English Club <k>every Thursday after school</k>.", th: "เจอคำถาม When ให้กวาดตาหา ==วันและเวลา=="}
        - {en: "<k>At the moment</k> she is preparing an activity.", th: "ถามเรื่องตอนนี้ ให้หา at the moment หรือ currently"}
        - {en: "The meeting will start at four o'clock, <k>not three thirty</k>.", th: "ตอนฟัง ข้อมูลที่ถูกแก้ทีหลัง ~~มักเป็นตัวหลอก~~"}
      thai_trap:
        intro_th: "เห็นคำเดียวกับในบทแล้วรีบกดเลย อันนี้แหละที่โดนหลอกบ่อยสุด ตัวหลอกชอบ ~~ยกคำจากบทมาใส่~~ แต่ผิดเรื่อง"
        wrong: ["เห็นคำว่า Monday ในบท จึงตอบ every Monday morning"]
        right: ["ตรวจว่า Monday ในบทพูดถึงกิจกรรมไหน ก่อนเลือก"]
      notes:
        - {kind: tip, th: "ก่อนตอบ ถามตัวเองว่า ==คำนี้ในบทพูดถึงเรื่องไหน== แล้วค่อยเลือก"}
        - {kind: warn, th: "ฟังให้จบประโยค เพราะคำว่า not หรือ instead มักโผล่มาตอนท้าย"}
    check: [cefr-b1-w01-036, cefr-b1-w01-037]
    practice: [cefr-b1-w01-035, cefr-b1-w01-038, cefr-b1-w01-039, cefr-b1-w01-040, cefr-b1-w01-041]
    use:
      prompt_th: เขียน 2 ประโยคแนะนำเพื่อนหรือเพื่อนร่วมงานหนึ่งคน แบบข่าวสั้น
      frame: "____ works as ____. At the moment he/she is ____."
      model: "Wichai works as a nurse. At the moment he is studying for a master's degree."
    classroom: {en: "Sorry, could you say that again, please?", th: "ขอโทษนะ ช่วยพูดอีกครั้งได้ไหม (ใช้ตอนฟังไม่ทัน)"}
  - day: 5
    type: lab
    skill: sp
    minutes: 25
    title_th: ห้องฝึกพูด แนะนำตัวและงานที่ทำ 45 วินาที
    lab:
      mode: speak
      prompt_th: แนะนำตัวเองกับวิทยากรชาวต่างชาติในวันแรกของการอบรม พูด 45 วินาที บอกชื่อ ที่ทำงานหรือที่เรียน งานที่ทำ งานที่กำลังทำช่วงนี้ และสิ่งที่ชอบในงาน
      frame:
        - "Hello, my name is ____. I work at ____ in ____."
        - "I'm a ____ (อาชีพ) and I ____ (งานหลัก)."
        - "I usually ____ (กิจวัตร)."
        - "This month I am ____ (สิ่งที่กำลังทำช่วงนี้)."
        - "I enjoy my job because ____."
      model_pass: "Hello, my name is Malee. I work at a small hotel in Nan. I'm a receptionist and I welcome guests. I usually start work at seven. This month I am learning to use a new booking system. I enjoy my job because I meet people from many countries."
      model_good: "Good morning, everyone. I'm Malee, and I work as a receptionist at a family-run hotel in Nan. I'm responsible for check-in and guest requests, so I usually deal with about forty guests a day. This month I'm also helping my manager set up a new online booking system, which is keeping us very busy. What I enjoy most about my job is helping travellers feel at home."
      steps_th:
        - ฟังตัวอย่างระดับผ่านเกณฑ์ 1 รอบ
        - เติมโครง 5 ประโยคด้วยข้อมูลของตัวเอง
        - อัดเสียงตัวเอง 1 รอบ (เสียงเก็บในเครื่องของคุณเท่านั้น)
        - ฟังเสียงตัวเองเทียบกับตัวอย่าง แล้วติ๊กรายการตรวจ
        - อัดอีก 1 รอบโดยไม่ดูโครง
      checklist_th:
        - พูดครบ 5 เรื่องตามโครง
        - ใช้ present simple กับกิจวัตร และ present continuous กับงานช่วงนี้
        - เติม -s หลังประธานเอกพจน์ทุกครั้ง
        - พูดได้ 40–50 วินาทีโดยไม่หยุดนานเกิน 3 วินาที
    practice: [cefr-b1-w01-042]
  - day: 6
    type: mock
    skill: mix
    minutes: 30
    title_th: ชุดย่อยจับเวลา สัปดาห์ 1
    mock:
      items: 20
      time_min: 15
      blueprint: {gm: 9, vo: 6, rd: 3, li: 2}   # นับเป็นคะแนน
      pool: {course: cefr/b1, weeks: [1], exclude_practice_of_week: true}
      note_th: ยังไม่มีข้อในคลังสำรองของสัปดาห์นี้ (ต้องมีอย่างน้อย 30 คะแนนที่ไม่อยู่ในเซสชันวันที่ 1–5) · งานของช่วงเขียนปริมาณ ดู docs/writing/cefr.md ข้อ 7
