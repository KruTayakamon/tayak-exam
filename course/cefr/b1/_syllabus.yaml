    title_th: กิจวัตร หรือ กำลังทำอยู่ตอนนี้
    scope: present simple กับ present continuous · สถานการณ์ชั่วคราว
  d3:
    topic: stative-verbs-questions
    title_th: กริยาที่ไม่ใช้ -ing และการตั้งคำถาม
    scope: กริยาบอกสภาวะ · คำถาม do/does และ am/is/are
  vocab:
