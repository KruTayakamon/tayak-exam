  - assignment
  - currently
  d4:
    read: ข่าวสั้นในโรงเรียน
    listen: ประกาศ · บทสนทนา · ข้อความเสียง
  lab_task_th: พูดแนะนำตัวและงานที่ทำ 45 วินาที
  can_do_th:
  - บอกได้ว่าตัวเองสอนอะไร ที่ไหน และช่วงนี้กำลังทำงานอะไรอยู่
