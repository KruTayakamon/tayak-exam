# ผังเนื้อหาคอร์ส b2 (เป้าหมาย B2) · 12 สัปดาห์ ระดับเซสชัน · 16 พ.ย. 2569
# ผู้เขียนเนื้อหา: ทำตามผังนี้ ห้ามเปลี่ยนหัวข้อ ลำดับ หรือรายการศัพท์เอง ถ้าเห็นว่าควรเปลี่ยนให้เสนอบอส
# d1 d3 = บทเรียนไวยากรณ์ของวันที่ 1 และ 3 · vocab = 12 คำของวันที่ 2 (vocab_new = คำที่ไม่มีในคลังเกมครัว ต้องเขียนใหม่)
# d4 = แนวบทอ่านและบทฟังของวันที่ 4 · วันที่ 5 = ห้องฝึก (lab) สลับ พูด/เขียน · วันที่ 6 = ชุดย่อยจับเวลา
# รูปแบบไฟล์รายสัปดาห์และกติกาการเขียน: docs/writing/cefr.md · ต้นแบบ: course/cefr/b1/w01.yaml
course: cefr/b2
name_th: เป้าหมาย B2
for_th: 'ผลวัดระดับ: ช่วงบนของ B1 ถึงช่วงล่างของ B2'
explain_lang: ไทย ใช้ศัพท์ไวยากรณ์อังกฤษกำกับ
read_words: 180-260
