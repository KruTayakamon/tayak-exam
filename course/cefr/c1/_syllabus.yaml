# ผังเนื้อหาคอร์ส c1 (เป้าหมาย C1) · 12 สัปดาห์ ระดับเซสชัน · 16 พ.ย. 2569
# ผู้เขียนเนื้อหา: ทำตามผังนี้ ห้ามเปลี่ยนหัวข้อ ลำดับ หรือรายการศัพท์เอง ถ้าเห็นว่าควรเปลี่ยนให้เสนอบอส
# d1 d3 = บทเรียนไวยากรณ์ของวันที่ 1 และ 3 · vocab = 12 คำของวันที่ 2 (vocab_new = คำที่ไม่มีในคลังเกมครัว ต้องเขียนใหม่)
# d4 = แนวบทอ่านและบทฟังของวันที่ 4 · วันที่ 5 = ห้องฝึก (lab) สลับ พูด/เขียน · วันที่ 6 = ชุดย่อยจับเวลา
# รูปแบบไฟล์รายสัปดาห์และกติกาการเขียน: docs/writing/cefr.md · ต้นแบบ: course/cefr/b1/w01.yaml
course: cefr/c1
name_th: เป้าหมาย C1
for_th: 'ผลวัดระดับ: ช่วงบนของ B2 ขึ้นไป'
explain_lang: อังกฤษแบบสั้น มีปุ่มดูไทย
read_words: 250-380
weeks:
- week: 1
  phase: 1
  theme_th: พูดให้แม่นยำ
  d1:
    topic: tense-aspect-nuance
    title_th: ความต่างเล็กน้อยของ tense
    scope: perfect กับ continuous ในความหมายที่ใกล้กัน · stative ที่ใช้ continuous ได้
  d3:
    topic: modality-advanced
    title_th: ระดับความแน่ใจ
    scope: bound to likely to · modal perfect · needn't have กับ didn't need to
  vocab:
  - articulate
  - convey
  - coherent
  - concise
  - explicit
  - implicit
  - nuance
  - ambiguous
  - lucid
  - eloquent
  - connotation
  - allude
  vocab_new: []
  d4:
    read: บทความเรื่องการสื่อสารในองค์กร
    listen: บรรยายเชิงวิชาการ
  lab_task_th: พูดอธิบายแนวคิดนามธรรมให้ผู้ฟังทั่วไปเข้าใจ 2 นาที
  can_do_th:
  - อธิบายแนวคิดที่ซับซ้อนได้ชัดและกระชับ
  - จับความหมายแฝงและทัศนะของผู้เขียนได้
  lab_mode: speak
