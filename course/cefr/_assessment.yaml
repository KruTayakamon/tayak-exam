# ตารางของแบบวัดระดับและชุดวัดผล สาย CEFR · 16 พ.ย. 2569 · กติกาการคิดคะแนนอยู่ใน docs/cefr/03_learning_engine.md ข้อ 5
# ผู้เขียนข้อ: เขียนให้ครบทุกช่องตามจำนวนที่กำหนด ห้ามเพิ่มหรือลดเอง · หน่วยเป็น "คะแนน" (บทอ่าน 1 บท 4 คำถาม = 4 คะแนน)
placement:            # แบบวัดระดับฟรี ชุดเดียวคงที่ ทุกข้อต้องผ่านการตรวจของบอส
  time_min: 20
  total: 25
  order: easy_to_hard          # เรียง a2 → c1 ผู้ที่ระดับต่ำหยุดได้โดยไม่เสียกำลังใจตั้งแต่ข้อแรก
  bands:
    a2: {gm: 3, vo: 2, dlg: 1}                 # 6
    b1: {gm: 3, vo: 2, rd: 2, dlg: 1}          # 8  (rd = ข้อความสั้น 1 ชิ้น 2 คำถาม)
    b2: {gm: 3, vo: 2, rd: 2}                  # 7
    c1: {gm: 2, vo: 1, rd: 1}                  # 4
  rules:
    - ข้อของแต่ละระดับต้องเป็นเรื่องแกนของระดับนั้น (ดู d1 d3 ของคอร์ส) ไม่ใช้ข้อยกเว้นหรือคำหายาก
    - ไม่มีข้อฟัง (ผู้ทำอาจอยู่ในที่ที่เปิดเสียงไม่ได้ และยังไม่ล็อกอิน)
    - ตัวเลือก 4 ตัว ความยาวใกล้กัน ไม่มีข้อใดใบ้ข้ออื่น
    - id รูปแบบ cefr-pl-0001 ถึง cefr-pl-0025 ไฟล์ bank/cefr/placement.yaml
checkpoint:           # ชุดวัดผลของคอร์ส: 3 ชุดคู่ขนานต่อคอร์ส (forms a b c) สร้างจากตารางเดียวกัน
  time_min: 40
  total: 40
  forms: [a, b, c]
  by_skill: {gm: 14, cloze: 3, vo: 10, rd: 8, li: 4, order: 1}   # cloze 1 ชุด 3 ช่อง · rd 2 บท บทละ 4 · li 4 ชิ้น
  by_level: {1: 16, 2: 18, 3: 6}                                   # ทุกชุดต้องตรงตามนี้ (บวกลบ 1)
  coverage:
    - ทุกชุดครอบคลุมทั้ง 12 สัปดาห์ ไม่ใช่เฉพาะที่เรียนแล้ว (เหตุผลใน 03 ข้อ 5.3)
    - gm + cloze 17 คะแนน มาจากหัวข้อ d1 d3 ทั้ง 24 หัวข้อของคอร์ส ชุดละ 17 หัวข้อไม่ซ้ำ และเมื่อรวม 3 ชุด ทุกหัวข้อต้องปรากฏอย่างน้อย 2 ครั้ง
    - vo 10 คะแนน มาจากคำในรายการศัพท์ของ 10 สัปดาห์ที่ต่างกัน และ 3 ชุดใช้คำไม่ซ้ำกัน
    - rd 2 บท บทหนึ่งเป็นแนวของช่วงสัปดาห์ 1–6 อีกบทเป็นแนวของสัปดาห์ 7–12
    - ข้อของชุดวัดผลห้ามซ้ำกับข้อในเซสชันและข้อสำรองของชุดย่อย
  rotation: ลำดับชุดของผู้เรียนแต่ละคน = หมุนตามรหัสผู้ใช้ (abc / bca / cab) เซิร์ฟเวอร์เป็นผู้กำหนด
  files: bank/cefr/<คอร์ส>/cp_a.yaml cp_b.yaml cp_c.yaml · id รูปแบบ cefr-<คอร์ส>-cpa-001
weekly_mock:          # ชุดย่อยจับเวลาวันที่ 6
  time_min: 15
  total: 20
  by_skill: {gm: 9, vo: 6, rd: 3, li: 2}
  pool_min_points: 30          # ข้อสำรองต่อสัปดาห์ที่ไม่อยู่ในเซสชันวันที่ 1–5 (ติด pool: true)
  mix_from_week: 2             # ตั้งแต่สัปดาห์ 2: 14 คะแนนจากสัปดาห์นี้ + 6 คะแนนจากสัปดาห์ก่อน ๆ
volume_per_course:    # ปริมาณที่ต้องเขียนต่อ 1 คอร์ส (คะแนน)
  sessions: 564        # 12 สัปดาห์ × ~47
  weekly_pool: 360     # 12 × 30
  checkpoints: 120     # 3 × 40
  total: 1044
  lessons: 48          # บทเรียนย่อ 4 บทต่อสัปดาห์
  labs: 12
