  course: b1
  topic: stative-verbs
  status: draft
  head: "จุดที่คนไทยพลาดบ่อย"
  wrong: I am understanding this lesson.
  right: I understand this lesson.
  note: "คำว่า understand, know, like เป็นเรื่องในหัว ==ไม่ใช้ -ing== แม้จะหมายถึงตอนนี้"
  caption: "พูดว่า I am understanding... กันบ่อยมาก แต่จริง ๆ ต้องพูดอีกแบบ\nฝึกจุดนี้ 5 ข้อ ใช้ 2 นาที {link}"
