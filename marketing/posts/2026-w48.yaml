# โพสต์เพจชุดแรก (7 โพสต์ จันทร์–อาทิตย์) · draft ทั้งหมด รอบอสตรวจ · เขียนใหม่ 17 พ.ย. 2569
# หัวข้อจากผัง b1 สัปดาห์ 1–2 และ a2 (ประโยคห้องเรียน) · ไม่ใช้ข้อจากคลังที่ขาย
# ลำดับ: จ. quiz · อ. word · พ. trap · พฤ. quiz · ศ. class · ส. tip · อา. recap

- id: mk-quiz-0002
  type: quiz
  course: b1
  topic: present-perfect-vs-past-simple
  status: draft
  head: "โจทย์วันจันทร์ · คุณตอบข้อไหน"
  stem: I ____ this company in 2018, and I have worked here ever since.
  choices:
    - {t: joined, why: "in 2018 คือจุดเวลาในอดีตที่จบแล้ว ใช้ ==past simple== ส่วนที่ยังทำงานอยู่บอกด้วยครึ่งหลังของประโยค"}
    - {t: have joined, why: "have joined ใช้กับเวลาที่ระบุชัดอย่าง in 2018 ไม่ได้ ~~present perfect ไม่ชอบปีที่ระบุ~~"}
    - {t: am joining, why: "รูปนี้คือกำลังเข้าร่วมตอนนี้ ขัดกับ in 2018"}
    - {t: was joining, why: "was joining เน้นว่ากำลังทำอยู่ช่วงหนึ่งในอดีต แต่การเข้าทำงานเกิดครั้งเดียวจบ"}
  caption: "ข้อนี้คนพลาดเยอะมาก เพราะเห็นว่ายังทำงานอยู่เลยใช้ have ทั้งประโยค\nลองตอบแล้วดูเหตุผลครบทุกตัวเลือก (ไม่ต้องสมัคร) {link}"
  more:
    - stem: Have you ever ____ to Chiang Mai for a workshop?
      choices:
        - {t: been, why: "Have you ever + ==กริยาช่อง 3== และไปแล้วกลับมาใช้ been"}
        - {t: went, why: "went เป็นช่อง 2 หลัง have ต้องใช้ช่อง 3"}
        - {t: go, why: "หลัง have ใช้กริยาช่อง 3 ไม่ใช่ช่อง 1"}
        - {t: going, why: "หลัง have ever ไม่ใช้รูป -ing"}
    - stem: We ____ the new timetable yesterday afternoon.
      choices:
        - {t: received, why: "yesterday afternoon เป็นเวลาอดีตที่ระบุชัด ใช้ ==past simple=="}
        - {t: have received, why: "present perfect ใช้กับ yesterday ไม่ได้"}
        - {t: receive, why: "receive เป็นปัจจุบัน แต่ yesterday เป็นอดีต"}
        - {t: are receiving, why: "รูปกำลังทำไม่เข้ากับเวลาอดีต"}
    - stem: "\"Is the report ready?\" \"Not yet. I ____ it.\""
      choices:
        - {t: haven't finished, why: "Not yet บอกว่ายังไม่เสร็จจนถึงตอนนี้ ใช้ ==haven't + กริยาช่อง 3=="}
        - {t: didn't finish, why: "didn't finish ฟังเหมือนเรื่องจบไปแล้วในอดีต ไม่เชื่อมกับตอนนี้"}
        - {t: don't finish, why: "don't finish ใช้กับเรื่องประจำ ไม่ใช่สถานะของงานตอนนี้"}
        - {t: wasn't finishing, why: "เป็นอดีตและรูปกำลังทำ ไม่ตอบคำถามว่าตอนนี้เสร็จหรือยัง"}
    - stem: She ____ three classes so far today.
      choices:
        - {t: has taught, why: "so far today วันนี้ยังไม่จบ ใช้ ==has + กริยาช่อง 3=="}
        - {t: taught, why: "taught บอกว่าจบไปแล้ว แต่ so far บอกว่านับถึงตอนนี้และอาจสอนอีก"}
        - {t: teaches, why: "teaches ใช้กับเรื่องประจำ ไม่ใช่การนับจำนวนถึงตอนนี้"}
        - {t: has teach, why: "หลัง has ต้องเป็นช่อง 3 คือ taught"}

- id: mk-word-0001
  type: word
  course: b1
  topic: work-vocabulary
  status: draft
  head: "คำศัพท์ที่ทำงาน · ใช้ได้ทุกวัน"
  word: responsible for
  pos: (adjective + preposition)
  th: รับผิดชอบ (งานหรือคน)
  example: I'm responsible for the new project this year.
  example_th: ปีนี้ฉันรับผิดชอบโปรเจกต์ใหม่
  caption: "รับผิดชอบงาน ภาษาอังกฤษใช้ responsible for ไม่ใช่ responsible of\nฟังเสียงอ่านและฝึกคำนี้ 4 ข้อ {link}"
  more:
    - stem: Who is responsible ____ the company website?
      choices:
        - {t: for, why: "responsible ใช้คู่กับ ==for== เสมอเมื่อพูดถึงงานที่ดูแล"}
        - {t: of, why: "responsible of ไม่ใช่ภาษาอังกฤษมาตรฐาน คนไทยแปลตรงจาก ของ"}
        - {t: to, why: "responsible to ใช้กับคนที่เราต้องรายงาน เช่น responsible to the director ไม่ใช่งาน"}
        - {t: with, why: "responsible with ไม่ใช่รูปที่ใช้บอกงานที่ดูแล"}
    - stem: Can you ____ an eye on my bag for five minutes? I need to make a phone call.
      choices:
        - {t: keep, why: "keep an eye on = ==ช่วยดูไว้ให้หน่อย== ดูแลชั่วคราว"}
        - {t: take, why: "take an eye on ไม่ใช่วลีในภาษาอังกฤษ"}
        - {t: look, why: "look an eye on ไม่ใช้ ถ้าจะใช้ look ต้องเป็น look after"}
        - {t: hold, why: "hold an eye on ไม่ใช่วลีในภาษาอังกฤษ"}
    - stem: Mr Krit is in ____ of the sports day this year.
      choices:
        - {t: charge, why: "in charge of = ==ดูแล รับผิดชอบ== ใช้แทน responsible for ได้"}
        - {t: control, why: "in control of มักหมายถึงควบคุมสถานการณ์ ไม่ใช่รับผิดชอบงาน"}
        - {t: duty, why: "ไม่มีวลี in duty of ที่ถูกคือ on duty"}
        - {t: responsible, why: "responsible เป็นคำคุณศัพท์ วางหลัง in ไม่ได้"}
    - stem: My sister has to look ____ our grandmother at the weekend.
      choices:
        - {t: after, why: "look after = ==ดูแล== คนหรือสิ่งของ"}
        - {t: for, why: "look for แปลว่าหา ไม่ได้แปลว่าดูแล"}
        - {t: at, why: "look at แปลว่ามอง ไม่ใช่ดูแล"}
        - {t: up, why: "look up แปลว่าค้นหาข้อมูล เช่น ในพจนานุกรม"}

- id: mk-trap-0002
  type: trap
  course: b1
  topic: questions-present
  status: draft
  head: "จุดที่คนไทยพลาดบ่อย"
  wrong: What time you start work?
  right: What time do you start work?
  note: "คำถามที่มี What, When, Where ต้องมี ==do / does== ก่อนประธานเสมอ"
  caption: "ภาษาไทยถามว่า \"เริ่มงานกี่โมง\" ไม่ต้องมีคำช่วย แต่ภาษาอังกฤษขาดไม่ได้\nฝึกจุดนี้ 4 ข้อ ใช้ 2 นาที {link}"
  more:
    - stem: Where ____ your students usually have lunch?
      choices:
        - {t: do, why: "students เป็นพหูพจน์ คำถามปัจจุบันใช้ ==do=="}
        - {t: does, why: "does ใช้กับประธานคนเดียว แต่ students มีหลายคน"}
        - {t: are, why: "are ใช้กับคำถามรูป -ing หรือคุณศัพท์ ไม่ใช้กับกริยา have แบบนี้"}
        - {t: did, why: "did เป็นอดีต แต่ usually บอกว่าเป็นเรื่องประจำตอนนี้"}
    - stem: How often ____ the principal visit your classroom?
      choices:
        - {t: does, why: "the principal เป็นคนเดียว ใช้ ==does== และกริยาหลักไม่เติม -s"}
        - {t: do, why: "the principal เป็นคนเดียว ต้องใช้ does"}
        - {t: is, why: "is กับ visit รูปปกติใช้คู่กันไม่ได้"}
        - {t: has, why: "has ต้องตามด้วยกริยาช่อง 3 ไม่ใช่ visit"}
    - stem: What ____ she teach on Tuesdays?
      choices:
        - {t: does, why: "she คนเดียว ใช้ does แล้วกริยาคือ teach ==ไม่เติม -es== เพราะ does รับไปแล้ว"}
        - {t: is, why: "is กับ teach รูปปกติใช้คู่กันไม่ได้"}
        - {t: do, why: "she ต้องใช้ does ไม่ใช่ do"}
        - {t: has, why: "has ไม่ใช้ทำคำถามกับกริยารูปปกติ"}
    - stem: Which question is correct?
      choices:
        - {t: "Why does he come late every day?", why: "มี does ก่อนประธาน และกริยา come ==ไม่เติม -s== หลัง does"}
        - {t: "Why he comes late every day?", why: "ขาดคำช่วย does ก่อนประธาน"}
        - {t: "Why does he comes late every day?", why: "มี does แล้ว กริยาต้องไม่เติม -s อีก"}
        - {t: "Why is he come late every day?", why: "is กับ come รูปปกติใช้คู่กันไม่ได้"}

- id: mk-quiz-0003
  type: quiz
  course: b1
  topic: quantifiers
  status: draft
  head: "โจทย์วันพฤหัส · ข้อไหนถูก"
  stem: We don't have ____ time before the meeting, so let's be quick.
  choices:
    - {t: much, why: "time นับไม่ได้ และประโยคปฏิเสธใช้ ==much== กับของนับไม่ได้"}
    - {t: many, why: "many ใช้กับของนับได้ เช่น many students แต่ time นับไม่ได้"}
    - {t: a few, why: "a few ใช้กับของนับได้ และไม่ค่อยใช้ในประโยคปฏิเสธแบบนี้"}
    - {t: lots, why: "ต้องเป็น lots of และไม่ค่อยใช้ในประโยคปฏิเสธ"}
  caption: "ของที่นับไม่ได้อย่าง time ต้องใช้คำไหน หลายคนยังสลับกันอยู่\nตอบแล้วดูเหตุผลทุกตัวเลือก {link}"
  more:
    - stem: How ____ students are absent today?
      choices:
        - {t: many, why: "students นับได้ ใช้ ==How many=="}
        - {t: much, why: "much ใช้กับของนับไม่ได้ แต่ students นับได้"}
        - {t: lot, why: "How lot ไม่มีในภาษาอังกฤษ"}
        - {t: few, why: "How few ไม่ใช้ถามจำนวน"}
    - stem: There is ____ paper left in the printer. Can you add some?
      choices:
        - {t: very little, why: "paper ในความหมายกระดาษนับไม่ได้ ==little== ใช้กับของนับไม่ได้ และแปลว่าเหลือน้อย"}
        - {t: very few, why: "few ใช้กับของนับได้ แต่ paper ตรงนี้นับไม่ได้"}
        - {t: many, why: "many ใช้กับของนับได้ และขัดกับที่ขอให้เติม"}
        - {t: a lot, why: "ต้องเป็น a lot of และเหลือเยอะก็ไม่ต้องเติม"}
    - stem: I need ____ information about the training.
      choices:
        - {t: some, why: "information นับไม่ได้ ใช้ ==some== ได้ ห้ามเติม -s"}
        - {t: an, why: "information นับไม่ได้ ใช้ a หรือ an ไม่ได้"}
        - {t: many, why: "many ใช้กับของนับได้"}
        - {t: a few, why: "a few ใช้กับของนับได้ information นับไม่ได้"}
    - stem: Only ____ parents came to the meeting because of the rain.
      choices:
        - {t: a few, why: "parents นับได้ และ ==a few== แปลว่ามีไม่กี่คน"}
        - {t: a little, why: "a little ใช้กับของนับไม่ได้ แต่ parents นับได้"}
        - {t: much, why: "much ใช้กับของนับไม่ได้"}
        - {t: less, why: "less ใช้กับของนับไม่ได้ ของนับได้ใช้ fewer"}

- id: mk-class-0002
  type: class
  course: a2
  topic: classroom-language
  status: draft
  head: "3 ประโยคชมคนอื่น ใช้ได้ทุกวัน"
  lines:
    - {en: "Well done! That's exactly right.", th: "เก่งมาก ถูกเป๊ะเลย"}
    - {en: "Good try. You're nearly there.", th: "พยายามดีมาก ใกล้แล้ว"}
    - {en: "I can see you worked hard on this.", th: "เห็นเลยว่าตั้งใจทำมาก"}
  caption: "ชมเพื่อน ลูก หรือเพื่อนร่วมงานเป็นภาษาอังกฤษให้หลากหลายกว่า Good และ Very good\nฟังเสียงอ่านแล้วฝึกต่อ {link}"
  more:
    - stem: "A student answers correctly. You say: \"____ done!\""
      choices:
        - {t: Well, why: "Well done! = ==เก่งมาก== ใช้ชมเมื่อทำได้ดี"}
        - {t: Good, why: "Good done ไม่ใช่ภาษาอังกฤษมาตรฐาน"}
        - {t: Very, why: "Very done ไม่มีความหมาย"}
        - {t: Nice, why: "Nice done ไม่ใช้ ต้องเป็น Nice work หรือ Nice job"}
    - stem: "A student's answer is almost right. You say: \"You're ____ there.\""
      choices:
        - {t: nearly, why: "You're nearly there = ==ใกล้แล้ว== ให้กำลังใจได้ดี"}
        - {t: near, why: "near there แปลว่าใกล้ที่ตรงนั้น ไม่ใช่ใกล้ถูก"}
        - {t: nearby, why: "nearby แปลว่าแถว ๆ นี้ ใช้บอกสถานที่"}
        - {t: close to, why: "close to ต้องมีคำนามตาม เช่น close to the answer"}
    - stem: "To encourage a shy student: \"Don't worry ____ mistakes.\""
      choices:
        - {t: about, why: "worry ใช้คู่กับ ==about== เมื่อบอกเรื่องที่กังวล"}
        - {t: for, why: "worry for ใช้น้อยมาก และใช้กับคน ไม่ใช่เรื่อง"}
        - {t: on, why: "worry on ไม่ใช่ภาษาอังกฤษมาตรฐาน"}
        - {t: with, why: "worry with ไม่ใช้ในความหมายนี้"}
    - stem: "You want everyone to clap for a friend. You say: \"Let's give her a big ____.\""
      choices:
        - {t: hand, why: "give someone a big hand = ==ปรบมือให้=="}
        - {t: arm, why: "give her a big arm ไม่มีความหมาย"}
        - {t: palm, why: "give her a big palm ไม่ใช่วลีในภาษาอังกฤษ"}
        - {t: foot, why: "give her a big foot ไม่มีความหมาย"}

- id: mk-tip-0001
  type: tip
  course: b1
  topic: present-simple-vs-continuous
  status: draft
  head: "เทคนิค 30 วินาที · ดูคำบอกเวลาก่อน"
  note: "เจอ every, usually ใช้ ==present simple== · เจอ now, at the moment, this week ใช้ ++am/is/are + -ing++"
  lines:
    - {en: "I usually walk to work.", th: "ปกติเดินไปทำงาน (ประจำ)"}
    - {en: "This week I'm driving.", th: "สัปดาห์นี้ขับรถมา (ชั่วคราว)"}
  caption: "ไม่แน่ใจว่าจะใช้ tense ไหน ให้หาคำบอกเวลาในประโยคก่อน\nลองใช้เทคนิคนี้ 4 ข้อ {link}"
  more:
    - stem: My students ____ English songs at the moment.
      choices:
        - {t: are practising, why: "at the moment = ตอนนี้ ใช้ ==are + -ing=="}
        - {t: practise, why: "practise เฉย ๆ ใช้กับเรื่องประจำ"}
        - {t: practises, why: "students หลายคน ไม่เติม -s"}
        - {t: practising, why: "-ing ยืนเดี่ยวไม่ได้ ต้องมี are"}
    - stem: She always ____ her lessons on Sunday evening.
      choices:
        - {t: plans, why: "always บอกว่าทำประจำ ใช้ ==present simple== และ she เติม -s"}
        - {t: is planning, why: "always ปกติใช้กับ present simple ไม่ใช่รูปกำลังทำ"}
        - {t: plan, why: "she คนเดียว ต้องเติม -s"}
        - {t: planned, why: "always บอกว่าเป็นนิสัยตอนนี้ ไม่ใช่เรื่องเดียวในอดีต"}
    - stem: Today we ____ in the library because our room is too hot.
      choices:
        - {t: are studying, why: "Today บอกว่าเป็นเรื่องเฉพาะวันนี้ ==ชั่วคราว== ใช้ are + -ing"}
        - {t: study, why: "study เฉย ๆ ฟังเหมือนเรียนในห้องสมุดเป็นประจำ"}
        - {t: studies, why: "ประธานคือ we กริยาไม่เติม -es"}
        - {t: is studying, why: "we ใช้ are ไม่ใช่ is"}
    - stem: The school bus ____ at 7:15 every morning.
      choices:
        - {t: leaves, why: "every morning ตารางประจำ ใช้ ==present simple== และ bus เติม -s"}
        - {t: is leaving, why: "ตารางเวลาประจำไม่ใช้รูปกำลังทำ"}
        - {t: leave, why: "bus เป็นเอกพจน์ ต้องเติม -s"}
        - {t: left, why: "every morning เป็นเรื่องประจำ ไม่ใช่อดีต"}

- id: mk-recap-0001
  type: recap
  course: b1
  topic: weekly-recap
  status: draft
  head: "สรุปสัปดาห์นี้ · เฉลยโจทย์"
  note: "เฉลยวันจันทร์ ==joined== · วันพฤหัส ==much== · อยากรู้ระดับตัวเอง ลองวัดระดับฟรีได้เลย"
  caption: "สัปดาห์นี้เราฝึก tense, คำถาม, much/many และคำชมนักเรียน\nอยากรู้ว่าตอนนี้อยู่ระดับไหน วัดระดับฟรี 20 นาที ไม่ต้องสมัคร {link}"
