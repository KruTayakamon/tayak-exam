# ---------- วันที่ 4 · อ่านแผนพัฒนาธุรกิจและฟังการนำเสนอ ----------
- id: cefr-b2-w03-035
  kind: read
  skill: rd
  topic: business-plan
  level: 2
  title: "Development Plan · Baan Suan Homestay (Summary)"
  passage: |
    Baan Suan is a small homestay with six rooms in Nan province. Since it opened in 2022, most guests have been Thai families visiting at weekends. Our main objective for the next two years is to attract more international visitors during the week, when the rooms are often empty.

    Our strategy has three parts. First, we will improve our online presence. By the end of March, we will have translated our website into English and Chinese, and we will be posting short videos about local food every week. Second, we will create a "farm morning" experience, in which guests help to pick vegetables and cook breakfast with the owner. Third, we will train two local young people as guides, which will create jobs in the village.

    We anticipate some challenges. Building the new outdoor kitchen will cost approximately 180,000 baht, and we were going to start in January. However, the bank loan has been delayed, so the work has been postponed until May. In the meantime, breakfast will be cooked in a temporary kitchen.

    If the plan succeeds, we expect weekday bookings to have doubled by the end of next year. Our long-term prospect is to work with other homestays in the area to offer a three-day food trail.
  questions:
    - stem: What is the homestay's main problem now?
      choices:
        - {t: rooms are often empty on weekdays, why: "the rooms are often empty during the week"}
        - {t: too many international guests, why: "ต้องการดึงชาวต่างชาติเพิ่ม"}
        - {t: the owner cannot cook, why: "เจ้าของทำอาหารเช้ากับแขกเอง"}
        - {t: the village has no young people, why: "แผนจะฝึกคนหนุ่มสาวในหมู่บ้าน"}
    - stem: What will be finished by the end of March?
      choices:
        - {t: the translated website, why: "By the end of March, we will have translated our website"}
        - {t: the outdoor kitchen, why: "ครัวกลางแจ้งเลื่อนไปเริ่มเดือนพฤษภาคม"}
        - {t: the three-day food trail, why: "เป็นแผนระยะยาว จึงใช้ไม่ได้"}
        - {t: the guide training, why: "ไม่ได้บอกว่าจะเสร็จเดือนมีนาคม"}
    - stem: Why has the kitchen work been delayed?
      choices:
        - {t: the loan is late, why: "the bank loan has been delayed"}
        - {t: it is too expensive, why: "บอกราคาไว้ แต่เหตุที่เลื่อนคือเงินกู้ล่าช้า"}
        - {t: the rainy season, why: "ไม่มีการพูดถึงฤดูฝน"}
        - {t: guests complained, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: Which word best describes the kitchen guests will use until May?
      choices:
        - {t: temporary, why: "breakfast will be cooked in a temporary kitchen"}
        - {t: permanent, why: "ครัวถาวรยังไม่ได้สร้าง"}
        - {t: outdoor, why: "ครัวกลางแจ้งคือครัวใหม่ที่ยังไม่ได้สร้าง"}
        - {t: shared, why: "ไม่มีข้อมูลว่าใช้ร่วมกับใคร"}
  status: approved
