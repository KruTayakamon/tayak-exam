# ---------- วันที่ 4 · อ่านจดหมายถึงบรรณาธิการและฟังการคาดเดา ----------
- id: cefr-b2-w06-035
  kind: read
  skill: rd
  topic: letter-to-editor
  level: 2
  title: "Letter to the Editor · Our Park Deserves Better"
  passage: |
    Dear Editor,

    I am writing about your article last week on the closure of Rim Nam Park. The article implied that local residents were happy with the council's decision to turn half the park into a car park. I am afraid this is a false assumption.

    Apparently, the council asked only fifty people for their opinions, most of whom were shop owners who would benefit from more parking. I spoke to over two hundred residents, and almost all of them were against the plan. Many parents told me that the park is the only safe place for their children to play.

    I am not suggesting that the council acted dishonestly. However, they should have consulted a wider range of people before making such an important decision. If they had held a public meeting, they would have understood how strongly people feel.

    The council also claimed that the car park would reduce traffic. I find this hard to believe. More parking spaces usually encourage more people to drive, not fewer.

    It is time the council listened to genuine local concerns. I wish your newspaper had asked residents for their views too. I would rather the council spent the money on a better bus service. Otherwise, I fear the tension between residents and the council will only grow.

    Yours faithfully,
    Somchai Rattanakul
  questions:
    - stem: Why did the writer send this letter?
      choices:
        - {t: to say the newspaper misrepresented residents' views, why: "The article implied ... this is a false assumption"}
        - {t: to thank the council, why: "ผู้เขียนไม่เห็นด้วยกับสภาเมือง"}
        - {t: to ask for more parking, why: "ตรงกันข้าม คัดค้านลานจอดรถ"}
        - {t: to complain about shop owners, why: "ไม่ได้ตำหนิเจ้าของร้าน"}
    - stem: What does the writer think the council should have done?
      choices:
        - {t: asked more people, why: "they should have consulted a wider range of people"}
        - {t: closed the whole park, why: "ไม่มีข้อเสนอนี้"}
        - {t: built the car park faster, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: asked only shop owners, why: "ตำหนิว่าถามแต่เจ้าของร้าน"}
    - stem: Does the writer believe the council was dishonest?
      choices:
        - {t: "no, he says it wasn't", why: "I am not suggesting that the council acted dishonestly"}
        - {t: "yes, strongly", why: "เขาบอกชัดว่าไม่ได้กล่าวหา"}
        - {t: he is not sure, why: "บอกชัดเจน จึงใช้ไม่ได้"}
        - {t: the letter does not say, why: "มีพูดถึงในย่อหน้าที่ 3"}
    - stem: What is the tone of the letter?
      choices:
        - {t: firm but polite, why: "ใช้ I am afraid · I am not suggesting · Yours faithfully"}
        - {t: rude and angry, why: "ไม่ได้ใช้ถ้อยคำรุนแรง"}
        - {t: funny and relaxed, why: "เป็นเรื่องจริงจัง"}
        - {t: uncertain and nervous, why: "ผู้เขียนมั่นใจในข้อมูลที่เก็บมา"}
  status: approved
