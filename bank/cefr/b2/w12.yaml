# ---------- วันที่ 4 · อ่านบทความยาวและฟังปนกัน ----------
- id: cefr-b2-w12-035
  kind: read
  skill: rd
  topic: professional-development
  level: 3
  title: "Learning at Work: Why Most Training Fails, and What Works Instead"
  passage: |
    Every year, companies spend enormous sums on training courses. Yet research consistently suggests that much of what employees learn in a classroom is forgotten within weeks. Why does so much training fail to have a lasting impact?

    One reason is timing. People tend to attend courses long before or long after they actually need a skill. A manager who learns about difficult conversations in January may not face one until June, by which time most of the advice has faded. What appears to work better is learning that happens close to the moment of need: a short video watched just before a meeting, or a quick discussion with an experienced colleague.

    A second problem is that traditional training often ignores reflection. Employees listen, take notes and return to their desks, but they are rarely asked to reflect on how they will apply what they have learned. Studies of professional learning suggest that even ten minutes spent planning how to use a new skill can significantly increase the chance that it is actually used.

    Third, many organisations fail to ensure that the workplace supports new behaviour. A nurse who learns a more efficient way of recording patient information will soon return to the old method if her colleagues and systems do not adapt. Learning, in other words, is not only an individual matter; it depends on the environment.

    None of this means that formal courses are useless. They can provide valuable insights and establish a shared language within a team. However, organisations that want real change would be wise to combine courses with on-the-job support, regular reflection and managers who are willing to adjust systems. Only then is training likely to demonstrate genuine value.
  questions:
    - stem: What is the writer's main argument?
      choices:
        - {t: training works better when combined with support and reflection at work, why: "ย่อหน้าสุดท้าย combine courses with on-the-job support, regular reflection"}
        - {t: formal courses are useless, why: "None of this means that formal courses are useless"}
        - {t: companies should stop spending on training, why: "ไม่ได้เสนอให้หยุด"}
        - {t: employees are too lazy to learn, why: "ไม่ได้โทษพนักงาน"}
    - stem: Why is timing a problem, according to the writer?
      choices:
        - {t: people often learn skills long before they use them, why: "attend courses long before or long after they actually need a skill"}
        - {t: courses are too long, why: "ไม่ได้พูดถึงความยาวของคอร์ส"}
        - {t: courses are held at night, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: managers have no time to attend, why: "บทไม่ได้พูดว่า managers have no time to attend"}
    - stem: What does the example of the nurse show?
      choices:
        - {t: new skills need a supportive environment, why: "Learning ... depends on the environment"}
        - {t: nurses learn slowly, why: "ไม่ใช่ประเด็น จึงใช้ไม่ได้"}
        - {t: the new method was worse, why: "บอกว่าวิธีใหม่มีประสิทธิภาพกว่า"}
        - {t: patient records are not important, why: "บทไม่ได้พูดว่า patient records are not important"}
    - stem: How certain is the writer about the benefits of reflection?
      choices:
        - {t: fairly confident but cautious, why: "Studies ... suggest ... can significantly increase the chance"}
        - {t: completely certain, why: "ใช้คำว่า suggest ไม่ใช่ prove"}
        - {t: very doubtful, why: "เสนอให้ใช้การไตร่ตรอง"}
        - {t: the writer does not mention reflection, why: "มีย่อหน้าเรื่องนี้"}
