# ---------- วันที่ 4 · อ่านบทความอธิบายนโยบายและฟังการบรรยาย ----------
- id: cefr-b2-w08-035
  kind: read
  skill: rd
  topic: policy-article
  level: 2
  title: "Explainer · The New Plastic Bag Policy in Riverton"
  passage: |
    From 1 July, shops in the town of Riverton will no longer be allowed to give customers free plastic bags. The policy, which was approved by the town council in March, is part of a wider framework aimed at reducing waste by 30% over five years.

    Under the new rules, any shop wishing to provide plastic bags must charge at least 5 baht per bag. The money raised will go to a fund supporting local recycling projects. Small market stalls, many of which rely on plastic bags for fresh food, will be given an extra six months to prepare.

    Some groups are excluded from the rules. Pharmacies, for example, may continue to provide small bags for medicine, and bags used for raw meat and fish are also exempt for health reasons.

    The council has said it will enforce the policy through spot checks. Shops found breaking the rules three times may be fined up to 2,000 baht. However, officials emphasised that their main aim is education, not punishment, and the first year will focus on giving advice.

    Reactions have been mixed. Supporters point to similar towns where plastic use fell by half within a year. Critics, most of whom are small business owners, argue that the policy imposes extra costs at a difficult time.
  questions:
    - stem: What is the main purpose of the article?
      choices:
        - {t: to explain how a new rule will work, why: "บทความอธิบายกฎ ข้อยกเว้น และการบังคับใช้"}
        - {t: to persuade readers to oppose the rule, why: "นำเสนอทั้งสองฝ่าย ไม่ได้ชักชวน"}
        - {t: to advertise reusable bags, why: "ไม่ได้โฆษณาสินค้า"}
        - {t: to report on a court case, why: "ไม่เกี่ยวกับศาล"}
    - stem: What will happen to the money from bag sales?
      choices:
        - {t: it will fund local recycling projects, why: "go to a fund supporting local recycling projects"}
        - {t: shops will keep it, why: "เงินเข้ากองทุน จึงใช้ไม่ได้"}
        - {t: it will pay fines, why: "ไม่เกี่ยวกับค่าปรับ"}
        - {t: it will go to the national government, why: "เป็นกองทุนท้องถิ่น"}
    - stem: Which bags are still allowed for free?
      choices:
        - {t: bags for medicine and raw meat or fish, why: "Pharmacies ... medicine และ raw meat and fish are also exempt"}
        - {t: all bags at market stalls, why: "ตลาดได้เวลาเพิ่มหกเดือน ไม่ได้ยกเว้นถาวร"}
        - {t: bags for vegetables, why: "ไม่มีข้อยกเว้นนี้"}
        - {t: bags given by large supermarkets, why: "ร้านทุกขนาดต้องเก็บเงิน"}
    - stem: What will the council focus on in the first year?
      choices:
        - {t: giving advice, why: "the first year will focus on giving advice"}
        - {t: fining as many shops as possible, why: "main aim is education, not punishment"}
        - {t: closing market stalls, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: building a recycling centre, why: "บทไม่ได้พูดว่า building a recycling centre"}
  status: approved
