# ---------- วันที่ 4 · อ่านสรุปผลการประเมินและฟังการบรรยายข้อมูล ----------
- id: cefr-b2-w04-035
  kind: read
  skill: rd
  topic: evaluation-summary
  level: 2
  title: "Evaluation Summary · Free Bicycle Scheme, Year 1"
  passage: |
    The free bicycle scheme was launched in the city centre in January. Two hundred bicycles were placed at twenty stations, and residents were invited to use them for up to two hours at no cost. The scheme was evaluated after twelve months using three criteria: number of users, effect on traffic, and cost.

    The number of users was significantly higher than expected. Approximately 45,000 trips were recorded, compared with an estimate of 30,000. Feedback from a survey of 1,200 users indicates that most riders were office workers travelling short distances, and many said they had stopped using motorbike taxis for these trips.

    The effect on traffic is harder to assess. Traffic in the city centre fell by 3%, but this change is not considered significant, because traffic also fell in areas without bicycles. More evidence is needed before any conclusions can be drawn.

    Costs were higher than planned. Thirty bicycles were stolen and many more had to be repaired. It is estimated that repairs cost 400,000 baht, twice the original budget. It has been recommended that the bicycles should be fitted with GPS trackers, and that a small deposit should be charged to new users.

    Overall, the scheme is believed to have been a success with the public, and it will be continued for a second year.
  questions:
    - stem: How did the number of trips compare with the estimate?
      choices:
        - {t: it was 15,000 higher, why: "45,000 compared with an estimate of 30,000"}
        - {t: it was lower, why: "จำนวนจริงสูงกว่าที่คาด"}
        - {t: it was exactly the same, why: "ต่างกัน 15,000 เที่ยว"}
        - {t: it was not recorded, why: "มีตัวเลขบันทึกไว้"}
    - stem: Why is the fall in traffic NOT seen as significant?
      choices:
        - {t: traffic also fell where there were no bicycles, why: "because traffic also fell in areas without bicycles"}
        - {t: the fall was too large, why: "ลดเพียง 3% จึงใช้ไม่ได้"}
        - {t: the survey was too small, why: "เหตุผลไม่ได้อยู่ที่ขนาดแบบสำรวจ"}
        - {t: nobody measured it, why: "มีการวัดว่าลด 3%"}
    - stem: What is recommended to reduce costs?
      choices:
        - {t: trackers and a deposit for new users, why: "fitted with GPS trackers, and that a small deposit should be charged"}
        - {t: closing some stations, why: "ไม่มีข้อเสนอนี้"}
        - {t: charging all users per trip, why: "เสนอแค่ค่ามัดจำเล็กน้อยสำหรับผู้ใช้ใหม่"}
        - {t: buying cheaper bicycles, why: "บทไม่ได้พูดว่า buying cheaper bicycles"}
    - stem: What will happen to the scheme?
      choices:
        - {t: it will continue for another year, why: "it will be continued for a second year"}
        - {t: it will be stopped, why: "ตรงกันข้าม จะทำต่อ"}
        - {t: it will move to another city, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: it will be evaluated again before it continues, why: "ตัดสินใจแล้วว่าจะทำต่อ"}
  status: approved
