- id: cefr-b2-w02-058
  kind: read
  skill: rd
  topic: progress-report
  level: 2
  pool: true
  title: "Library Renovation: Progress Report (Month 3)"
  passage: |
    Work on the city library has continued steadily over the past month. The new roof has been completed, and the electricians have been installing lighting on the ground floor since early June.

    However, there has been one delay. The furniture supplier has informed us that the new bookshelves will arrive three weeks later than planned. As a result, the children's area will not open in July as originally announced.

    The total cost so far is 4.2 million baht, which is slightly below the budget. We expect the main reading room to reopen on 1 September. Meanwhile, a temporary library service is running from the community hall on Rama Road.
  questions:
    - stem: "What has been finished?"
      choices:
        - {t: "the roof", why: "The new roof has been completed"}
        - {t: "the lighting", why: "ช่างไฟยังติดตั้งอยู่"}
        - {t: "the children's area", why: "ยังไม่เปิด เพราะชั้นหนังสือมาช้า"}
        - {t: "the main reading room", why: "จะเปิดวันที่ 1 กันยายน"}
    - stem: "Why will the children's area open late?"
      choices:
        - {t: "the shelves will be delivered late", why: "bookshelves will arrive three weeks later"}
        - {t: "the budget has run out", why: "ค่าใช้จ่ายยังต่ำกว่างบ"}
        - {t: "the electricians are behind schedule", why: "ไม่ได้บอกว่าช่างไฟล่าช้า"}
        - {t: "the roof needs more work", why: "หลังคาเสร็จแล้ว"}
    - stem: "Where can people borrow books now?"
      choices:
        - {t: "at the community hall", why: "a temporary library service ... community hall"}
        - {t: "in the main reading room", why: "จะเปิดเดือนกันยายน"}
        - {t: "on the ground floor", why: "ชั้นล่างกำลังติดไฟ"}
        - {t: "online only", why: "ไม่ได้พูดถึงบริการออนไลน์"}
  status: approved
