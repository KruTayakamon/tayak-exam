- id: cefr-b2-w10-058
  kind: read
  skill: rd
  topic: research-summary
  level: 2
  pool: true
  title: "Summary: Phone Use Before Sleep (Small Classroom Study)"
  passage: |
    This small study looked at 40 adult learners in an evening English class. Each person kept a diary for two weeks, recording how long they used their phone before sleeping and how rested they felt the next morning.

    The results appear to suggest a link between phone use and sleep. Learners who used their phones for more than an hour before bed reported feeling tired on 9 out of 14 mornings, compared with 4 out of 14 for those who used them for less than 15 minutes.

    However, the study has clear limits. The group was small, and the diaries depended on people's own reports. The findings should therefore be seen as tentative. A larger study with sleep monitors would be needed to confirm them.
  questions:
    - stem: "How was information collected?"
      choices:
        - {t: "participants wrote diaries", why: "Each person kept a diary for two weeks"}
        - {t: "with sleep monitors", why: "เป็นสิ่งที่ต้องใช้ในงานวิจัยครั้งต่อไป"}
        - {t: "through phone apps", why: "ไม่ได้ใช้แอป จึงใช้ไม่ได้"}
        - {t: "by asking their teachers", why: "ไม่ได้ถามครู จึงใช้ไม่ได้"}
    - stem: "What did learners with long phone use report?"
      choices:
        - {t: "feeling tired more often", why: "tired on 9 out of 14 mornings"}
        - {t: "sleeping longer", why: "ในบทไม่ได้พูดถึง sleeping longer"}
        - {t: "better test scores", why: "ในบทไม่ได้พูดถึง better test scores"}
        - {t: "fewer dreams", why: "ในบทไม่ได้พูดถึง fewer dreams"}
    - stem: "Why are the findings called \"tentative\"?"
      choices:
        - {t: "the study was small and self-reported", why: "The group was small ... own reports"}
        - {t: "the results were very clear", why: "ผลยังไม่แน่ชัด จึงใช้ไม่ได้"}
        - {t: "the teachers disagreed", why: "ในบทไม่ได้พูดถึง the teachers disagreed"}
        - {t: "the study lasted a year", why: "ศึกษาเพียงสองสัปดาห์"}
  status: approved
