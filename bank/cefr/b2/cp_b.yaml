- id: cefr-b2-cpb-028
  kind: read
  skill: rd
  topic: report-article
  level: 2
  title: "Why Are Young People Moving Back to the Countryside?"
  passage: |
    For decades, young Thais have left their villages to look for work in Bangkok and other big cities. Recently, however, a small but notable number appear to be returning home. A survey of 800 people aged 25 to 35 suggests that around one in eight has moved back to a rural area in the last three years.

    Several reasons seem to explain this trend. The most obvious is the cost of living in the city, where rent can take half a young worker's salary. Furthermore, faster internet in rural areas has made it possible for some people to keep their city jobs while working from home. Others say they wanted to look after ageing parents, or simply to have a slower, healthier life.

    Not everyone who returns finds it easy. Well-paid jobs are still rare outside the cities, and some returners have struggled to adapt after years of urban life. A few told researchers that they had underestimated how lonely village life could be.

    It would be a mistake to call this a mass movement; the numbers are still small. Nevertheless, if the trend continues, it may bring new ideas and businesses to rural communities that have lost many of their young people.
  questions:
    - stem: According to the survey, how many young people have moved back?
      choices:
        - {t: about one in eight, why: "around one in eight has moved back"}
        - {t: about half, why: "ครึ่งหนึ่งพูดถึงค่าเช่า ไม่ใช่จำนวนคน"}
        - {t: all 800 people who took part in the survey, why: "800 คือจำนวนผู้ตอบแบบสำรวจ"}
        - {t: very few, almost none, why: "หนึ่งในแปดถือว่าน่าสังเกต"}
    - stem: How has faster internet helped?
      choices:
        - {t: some can keep city jobs and work remotely, why: "keep their city jobs while working from home"}
        - {t: it has created many new farming jobs in every village, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: it has made rent cheaper, why: "บทไม่ได้พูดว่า it has made rent cheaper"}
        - {t: it has reduced loneliness, why: "บางคนยังเหงา จึงใช้ไม่ได้"}
    - stem: What difficulty do some returners face?
      choices:
        - {t: feeling lonely and adapting to village life, why: "struggled to adapt ... how lonely village life could be"}
        - {t: rent is too high, why: "ค่าเช่าแพงคือปัญหาในเมือง"}
        - {t: they cannot find anywhere to live near their parents, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: the internet is too slow, why: "อินเทอร์เน็ตเร็วขึ้นแล้ว"}
    - stem: How does the writer describe the trend?
      choices:
