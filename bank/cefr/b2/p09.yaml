- id: cefr-b2-w09-058
  kind: read
  skill: rd
  topic: opinion-article
  level: 2
  pool: true
  title: "Should Homework Be Banned in Primary Schools?"
  passage: |
    Some parents argue that homework puts too much pressure on young children. Families are busy, and children need time to play and rest. Moreover, studies suggest that homework has little effect on learning before the age of ten.

    On the other hand, many teachers believe that short tasks help children develop good habits. Reading for fifteen minutes at home, for example, can be beneficial, especially for children who don't have books at school. Banning homework completely might also send the message that learning only happens in the classroom.

    Perhaps the answer is not a ban but a limit. Short, optional activities that families can do together would arguably keep the benefits while reducing stress.
  questions:
    - stem: "What do some parents say about homework?"
      choices:
        - {t: "it is stressful for them", why: "homework puts too much pressure on young children"}
        - {t: "it is too easy", why: "ไม่ได้พูดว่าง่ายเกินไป"}
        - {t: "teachers don't check it", why: "ไม่ได้พูดถึงเรื่องนี้"}
        - {t: "it gives children more time to rest", why: "ความหมายกลับกัน"}
    - stem: "Which kind of homework do teachers mention as useful?"
      choices:
        - {t: "short reading at home", why: "Reading for fifteen minutes at home"}
        - {t: "long writing projects", why: "ในบทไม่ได้พูดถึง long writing projects"}
        - {t: "family trips", why: "ในบทไม่ได้พูดถึง family trips"}
        - {t: "online tests", why: "ในบทไม่ได้พูดถึง online tests"}
    - stem: "What does the writer suggest?"
      choices:
        - {t: "limiting homework", why: "Perhaps the answer is not a ban but a limit"}
        - {t: "banning homework", why: "ผู้เขียนบอกว่าไม่ควรห้าม"}
        - {t: "giving more homework", why: "ไม่ได้เสนอเพิ่ม"}
        - {t: "letting teachers decide alone", why: "ในบทไม่ได้พูดถึง letting teachers decide alone"}
  status: approved
