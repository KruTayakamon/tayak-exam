- id: cefr-b2-w11-058
  kind: read
  skill: rd
  topic: workplace-advice
  level: 2
  pool: true
  title: "Five Ways to Make Meetings Shorter"
  passage: |
    Many workers say they spend too much time in meetings that achieve very little. Here are some simple ways to improve them.

    First, send the agenda at least a day before, so everyone can come prepared. Second, invite only the people who really need to be there; others can read the notes later. Third, start on time, even if someone is late, to reinforce the idea that time matters.

    Fourth, end each point with a clear action and the name of the person responsible. Finally, try standing meetings for short updates. People naturally keep them brief when they are not sitting comfortably.
  questions:
    - stem: "Why should the agenda be sent early?"
      choices:
        - {t: "so people can prepare", why: "so everyone can come prepared"}
        - {t: "so people can decline", why: "ในบทไม่ได้พูดถึง so people can decline"}
        - {t: "so the meeting can start late", why: "ควรเริ่มตรงเวลา"}
        - {t: "so the notes are shorter", why: "ในบทไม่ได้พูดถึง so the notes are shorter"}
    - stem: "What should people who don't need to attend do?"
      choices:
        - {t: "read the notes afterwards", why: "others can read the notes later"}
        - {t: "join online", why: "ในบทไม่ได้พูดถึง join online"}
        - {t: "send a replacement", why: "ในบทไม่ได้พูดถึง send a replacement"}
        - {t: "arrive late", why: "ในบทไม่ได้พูดถึง arrive late"}
    - stem: "Why are standing meetings suggested?"
      choices:
        - {t: "people tend to keep them short", why: "People naturally keep them brief"}
        - {t: "there are not enough chairs", why: "ในบทไม่ได้พูดถึง there are not enough chairs"}
        - {t: "they are healthier", why: "ในบทไม่ได้พูดถึง they are healthier"}
        - {t: "managers prefer them", why: "ในบทไม่ได้พูดถึง managers prefer them"}
  status: approved
