  title: "Minutes: Residents' Committee, 12 May"
  passage: |
    Present: 9 members. Chair: Khun Anong
    1. Parking: Khun Somchai proposed painting numbered spaces in the car park. Khun Mali opposed the idea, arguing that it would cost too much. After discussion, the committee agreed to ask two companies for prices before deciding.
    2. Swimming pool: The chair acknowledged complaints that the pool had been dirty in April. She explained that the cleaning company had changed staff and emphasised that the problem has now been solved.
    3. New Year party: Khun Tom offered to organise the event. Members were asked to contribute ideas by 1 June.
    Next meeting: 9 June
  questions:
    - stem: "What was decided about the parking spaces?"
      choices:
        - {t: "to get price quotes first", why: "ask two companies for prices before deciding"}
        - {t: "to paint them next week", why: "ยังไม่ได้ตัดสินใจทาสี"}
        - {t: "to cancel the idea", why: "ยังไม่ได้ยกเลิก"}
        - {t: "that Khun Mali would pay", why: "ไม่ได้พูดว่าเธอจ่าย"}
    - stem: "What did the chair say about the pool?"
      choices:
        - {t: "the issue has been fixed", why: "emphasised that the problem has now been solved"}
        - {t: "it will close in April", why: "เมษายนคือช่วงที่สระสกปรก"}
        - {t: "it needs a new company", why: "ไม่ได้บอกว่าเปลี่ยนบริษัท"}
        - {t: "nobody had complained", why: "มีผู้ร้องเรียน จึงใช้ไม่ได้"}
    - stem: "What must members do by 1 June?"
      choices:
        - {t: "send ideas for the party", why: "contribute ideas by 1 June"}
        - {t: "pay for the party", why: "ไม่ได้พูดถึงเงิน"}
        - {t: "choose a cleaning company", why: "ในบทไม่ได้พูดถึง choose a cleaning company"}
        - {t: "attend the next meeting", why: "การประชุมครั้งหน้าคือ 9 มิถุนายน"}
