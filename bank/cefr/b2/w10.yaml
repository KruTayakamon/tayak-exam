# ---------- วันที่ 4 · อ่านบทคัดย่องานวิจัยและฟังการบรรยายแนวโน้ม ----------
- id: cefr-b2-w10-035
  kind: read
  skill: rd
  topic: research-summary
  level: 2
  title: "Summary · Does Reading for Pleasure Improve Vocabulary? (A Small Study)"
  passage: |
    This small study followed 120 adult English learners at a language centre in Bangkok for one semester. Learners were divided into two groups. The first group read graded stories of their own choice for twenty minutes a day; the second group followed the normal course only.

    At the end of the semester, both groups took the same vocabulary test. Learners who read for pleasure scored an average of 12% higher than the other group. The difference was most notable among learners at lower levels, whereas the gain for advanced learners was marginal.

    These results appear to support the view that regular reading helps vocabulary growth. However, they should be treated as tentative. The groups were small, and learners who chose to read may already have been more motivated. It is therefore not possible to say that reading alone caused the improvement.

    What the study does suggest is that short, daily reading is a practical habit that adult learners tend to enjoy. Further research with larger groups is needed to confirm whether the effect lasts over time.
  questions:
    - stem: What was the main difference between the two groups?
      choices:
        - {t: one group read stories every day, why: "The first group read graded stories ... for twenty minutes a day"}
        - {t: one group had more teachers, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: one group was older, why: "บทไม่ได้พูดว่า one group was older"}
        - {t: one group took a different test, why: "ทั้งสองกลุ่มสอบชุดเดียวกัน"}
    - stem: Which learners improved the most?
      choices:
        - {t: lower-level learners, why: "most notable among learners at lower levels"}
        - {t: advanced learners, why: "the gain for advanced learners was marginal"}
        - {t: both levels equally, why: "ต่างกันชัดเจน จึงใช้ไม่ได้"}
        - {t: learners who did not read, why: "กลุ่มที่อ่านได้คะแนนสูงกว่า"}
    - stem: Why does the writer say the results are tentative?
      choices:
        - {t: the groups were small and readers may have been more motivated, why: "The groups were small, and learners who chose to read may already have been more motivated"}
        - {t: the test was too easy, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: the reading group scored lower, why: "กลุ่มที่อ่านได้คะแนนสูงกว่า"}
        - {t: the study lasted too long, why: "ศึกษาแค่หนึ่งภาคเรียน"}
    - stem: Which statement would the writer AGREE with?
      choices:
        - {t: reading may help but more research is needed, why: "appear to support ... Further research ... is needed"}
        - {t: reading alone definitely improves vocabulary, why: "not possible to say that reading alone caused the improvement"}
        - {t: reading has no effect, why: "ผลบ่งชี้ว่าอาจช่วย"}
        - {t: advanced learners should not read, why: "ไม่มีคำแนะนำนี้"}
  status: approved
