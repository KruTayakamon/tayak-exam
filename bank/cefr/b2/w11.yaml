# ---------- วันที่ 4 · อ่านบทความแนะนำแนวปฏิบัติและฟังบรรยาย ----------
- id: cefr-b2-w11-035
  kind: read
  skill: rd
  topic: workplace-advice
  level: 2
  title: "Five Habits of Effective Teams"
  passage: |
    Why do some teams achieve so much while others struggle? Research into workplace performance points to a few simple habits that make a real difference.

    First, effective teams make decisions quickly but carefully. Rather than waiting for perfect information, they agree on what is "good enough" and move forward. However, they are also willing to change direction when new evidence emerges.

    Second, they value diverse opinions. Team members come from different backgrounds and are encouraged to disagree openly. This diversity tends to produce more innovative ideas, as long as people feel safe to speak up.

    Third, good teams look after their members. Leaders keep workloads sustainable and make sure that people have sufficient time to rest. Teams that ignore burnout may perform well for a few months, but they rarely last.

    Fourth, they share expertise. Instead of one person holding all the knowledge, skills are passed on through short training sessions or by working in pairs. Consequently, the team can cope when someone is ill or leaves.

    Finally, effective teams celebrate progress, not just results. Recognising small successes motivates people and reinforces the behaviour that led to them.

    None of these habits requires extra resources. What they do require is a leader who is committed to putting them into practice.
  questions:
    - stem: What do effective teams do when new evidence appears?
      choices:
        - {t: they are ready to change direction, why: "willing to change direction when new evidence emerges"}
        - {t: they ignore it, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: they wait for perfect information, why: "Rather than waiting for perfect information"}
        - {t: they start a new team, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: According to the article, when does diversity lead to more innovative ideas?
      choices:
        - {t: when people feel safe to speak, why: "as long as people feel safe to speak up"}
        - {t: when everyone agrees, why: "ส่งเสริมให้เห็นต่างอย่างเปิดเผย"}
        - {t: when the team is small, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: when there is more money, why: "บทไม่ได้พูดว่า when there is more money"}
    - stem: Why is sharing expertise useful?
      choices:
        - {t: the team can manage when someone is absent, why: "the team can cope when someone is ill or leaves"}
        - {t: it saves money on training, why: "ไม่ได้พูดถึงการประหยัดเงิน"}
        - {t: it makes one person the expert, why: "ตรงกันข้าม ไม่ให้คนเดียวถือความรู้ทั้งหมด"}
        - {t: it reduces the number of meetings, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: What is the main message of the final paragraph?
      choices:
        - {t: the habits need a committed leader rather than money, why: "None ... requires extra resources. What they do require is a leader"}
        - {t: teams need more resources, why: "ไม่ต้องใช้ทรัพยากรเพิ่ม"}
        - {t: leaders should work alone, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: the habits are impossible, why: "บอกว่าทำได้ถ้าผู้นำมุ่งมั่น"}
  status: approved
