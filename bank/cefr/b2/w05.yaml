# ---------- วันที่ 4 · อ่านบทความสะท้อนบทเรียนและฟังการอภิปราย ----------
- id: cefr-b2-w05-035
  kind: read
  skill: rd
  topic: reflection-article
  level: 2
  title: "What Our Failed Food Truck Taught Us"
  passage: |
    Two years ago, my sister and I abandoned our office jobs to open a food truck selling northern Thai noodles. Eight months later, we sold the truck at a loss. People often ask whether we regret it. The honest answer is no, but we would do many things differently.

    Our biggest mistake was location. We parked near a university because rent was cheap, but students had little money and the area was empty during holidays. If we had spent a week counting customers at different spots, we would have chosen the business district, where office workers pay more for a good lunch.

    Second, we neglected our costs. We were so focused on the food that we didn't track how much we were spending on gas, parking and ingredients. By the time we noticed, we had already lost most of our savings. Had we checked our accounts every week, we could have raised our prices earlier.

    Finally, we faced a constant dilemma about our menu. My sister wanted to keep it small, while I wanted to offer more choice. We never reached a real compromise, so the menu kept changing and customers were confused.

    Was failure inevitable? I don't think so. If we had planned more carefully, we might still be running the truck today. But the experience convinced us that we can work together under pressure, and next year we are opening a small restaurant, provided that we can find the right location.
  questions:
    - stem: Why was the university area a poor choice?
      choices:
        - {t: customers had little money and it was quiet in holidays, why: "students had little money and the area was empty during holidays"}
        - {t: the rent was too expensive, why: "ค่าเช่าถูก จึงเลือกที่นั่น"}
        - {t: the police would not allow parking, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: students did not like noodles, why: "บทไม่ได้พูดว่า students did not like noodles"}
    - stem: What does the writer say about costs?
      choices:
        - {t: they did not check them often enough, why: "we neglected our costs ... didn't track"}
        - {t: they were lower than expected, why: "ใช้เงินเก็บไปเกือบหมด"}
        - {t: they raised prices every week, why: "บอกว่าถ้าตรวจทุกสัปดาห์ จะขึ้นราคาได้เร็วกว่านี้"}
        - {t: the gas price was the only problem, why: "มีหลายรายการ ไม่ใช่แค่ค่าแก๊ส"}
    - stem: "\"We never reached a real compromise\" means the sisters ____."
      choices:
        - {t: never agreed on the menu, why: "ไม่เคยตกลงกันได้ เมนูจึงเปลี่ยนตลอด"}
        - {t: always agreed, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: closed the menu completely, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: let customers decide, why: "บทไม่ได้พูดว่า let customers decide"}
    - stem: What is the writer's attitude now?
      choices:
        - {t: positive and ready to try again, why: "no regret และจะเปิดร้านปีหน้า"}
        - {t: angry with her sister, why: "บอกว่าทำงานด้วยกันได้ภายใต้แรงกดดัน"}
        - {t: certain that failure was inevitable, why: "Was failure inevitable? I don't think so."}
        - {t: afraid of starting another business, why: "จะเปิดร้านอาหารปีหน้า"}
  status: approved
