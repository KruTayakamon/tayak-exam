# ---------- วันที่ 4 · อ่านบทความสองด้านและฟังการโต้วาที ----------
- id: cefr-b2-w09-035
  kind: read
  skill: rd
  topic: opinion-article
  level: 2
  title: "Should Schools Ban Phones? Two Perspectives"
  passage: |
    The idea of banning mobile phones in schools has become increasingly controversial. Several countries have introduced bans, whereas others have chosen to teach students how to use phones responsibly.

    Supporters of a ban make three main arguments. First, phones are a major distraction; students who check messages during lessons find it harder to concentrate. Furthermore, a ban may reduce online bullying during school hours. Finally, some head teachers report that students talk and play together more at break time once phones are put away.

    Nevertheless, there are strong arguments on the other side. Phones can be beneficial learning tools, allowing students to look up information or use language apps. Moreover, many parents want to be able to contact their children in an emergency. Critics also point out that a ban does not teach young people how to manage their screen time, which is arguably a more relevant skill for adult life.

    In my view, the most sensible approach lies somewhere in between. Phones should be kept in lockers during lessons so as to protect concentration, but teachers should be free to allow them for specific activities. Consequently, students would learn when phones are useful and when they are not. A complete ban may be simple, but it ignores an important aspect of modern education.
  questions:
    - stem: According to supporters, what happens at break time when phones are put away?
      choices:
        - {t: students interact more with each other, why: "students talk and play together more at break time"}
        - {t: students study more, why: "ไม่ได้พูดถึงการเรียนช่วงพัก"}
        - {t: bullying increases, why: "ตรงกันข้าม การกลั่นแกล้งอาจลดลง"}
        - {t: teachers take the phones home, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: Which is an argument AGAINST a ban?
      choices:
        - {t: parents want to reach their children in emergencies, why: "many parents want to be able to contact their children"}
        - {t: phones are a distraction, why: "เป็นเหตุผลของฝ่ายสนับสนุน"}
        - {t: it reduces online bullying, why: "บทไม่ได้พูดว่า it reduces online bullying"}
        - {t: it is simple, why: "ผู้เขียนยอมรับว่าง่าย แต่ไม่ได้เป็นเหตุผลค้าน"}
    - stem: What is the writer's own view?
      choices:
        - {t: phones should be restricted but allowed for some activities, why: "kept in lockers ... but teachers should be free to allow them"}
        - {t: phones should be completely banned, why: "ผู้เขียนบอกว่าการห้ามทั้งหมดละเลยด้านสำคัญ"}
        - {t: there should be no rules at all, why: "เสนอให้เก็บในล็อกเกอร์ระหว่างเรียน"}
        - {t: the writer gives no opinion, why: "มี In my view จึงใช้ไม่ได้"}
    - stem: Which word in the last paragraph introduces a result?
      choices:
        - {t: Consequently, why: "Consequently = ผลที่ตามมา"}
        - {t: but, why: "but บอกความขัดแย้ง"}
        - {t: so as to, why: "so as to บอกจุดประสงค์"}
        - {t: may, why: "may บอกความเป็นไปได้"}
  status: approved
