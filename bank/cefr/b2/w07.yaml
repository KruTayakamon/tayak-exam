# ---------- วันที่ 4 · อ่านรายงานการประชุมและฟังการประชุมหลายคน ----------
- id: cefr-b2-w07-035
  kind: read
  skill: rd
  topic: meeting-minutes
  level: 2
  title: "Minutes · Customer Service Team Meeting, 12 March"
  passage: |
    Present: Ploy (team leader), Arthit, Mina, Sam, Jane

    1. Response times. Ploy began by acknowledging that the team had been under pressure since two colleagues left in January. She emphasised that customers are now waiting an average of three days for an email reply, compared with one day last year.

    2. Chatbot proposal. Arthit proposed introducing a chatbot to answer simple questions, such as delivery times. Mina opposed the idea, arguing that older customers find chatbots frustrating. Sam suggested trying it for one month on the website only, and keeping phone support unchanged. After some discussion, the team agreed to Sam's suggestion.

    3. Weekend cover. Jane asked whether staff would be paid extra for weekend shifts. Ploy clarified that weekend work would be optional and paid at 1.5 times the normal rate. She also reminded everyone to sign up on the shared calendar by Friday.

    4. Training. Ploy highlighted the fact that only two team members had completed the new complaints training. She urged the rest of the team to finish it before the end of the month.

    Actions:
    - Arthit to contact the chatbot company and ask for a price (by 19 March)
    - All staff to sign up for weekend shifts (by 15 March)
    - Mina, Sam and Jane to complete the complaints training (by 31 March)
  questions:
    - stem: What was decided about the chatbot?
      choices:
        - {t: to test it on the website for a month, why: "the team agreed to Sam's suggestion"}
        - {t: to replace phone support with it, why: "phone support unchanged"}
        - {t: to reject it completely, why: "Mina คัดค้าน แต่ทีมตกลงทดลอง"}
        - {t: to use it only for older customers, why: "Mina กังวลเรื่องลูกค้าสูงวัย"}
    - stem: What did Ploy clarify about weekend work?
      choices:
        - {t: it is voluntary and paid more, why: "optional and paid at 1.5 times the normal rate"}
        - {t: everyone must do it, why: "optional แปลว่าไม่บังคับ"}
        - {t: it will not be paid, why: "จ่าย 1.5 เท่า จึงใช้ไม่ได้"}
        - {t: it starts in April, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: Who has to complete the complaints training?
      choices:
        - {t: Mina Sam and Jane, why: "ดูรายการ Actions ข้อสุดท้าย"}
        - {t: everyone in the team, why: "บางคนทำเสร็จแล้ว"}
        - {t: only Arthit, why: "Arthit รับหน้าที่ติดต่อบริษัทแชตบอต"}
        - {t: only Ploy, why: "Ploy เป็นหัวหน้าทีมที่เร่งให้คนอื่นทำ"}
    - stem: What is the first deadline mentioned in the action list?
      choices:
        - {t: 15 March, why: "sign up for weekend shifts (by 15 March)"}
        - {t: 19 March, why: "เป็นกำหนดของ Arthit ซึ่งมาทีหลัง"}
        - {t: 31 March, why: "เป็นกำหนดสุดท้าย"}
        - {t: 12 March, why: "เป็นวันประชุม จึงใช้ไม่ได้"}
  status: approved
