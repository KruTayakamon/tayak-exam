- id: cefr-b2-w06-058
  kind: read
  skill: rd
  topic: letter-to-editor
  level: 2
  pool: true
  title: "Letter to the Editor: Bus Lanes Are Not the Problem"
  passage: |
    Dear Editor,

    Your article last week suggested that the new bus lanes on Charoen Road have made traffic worse. I disagree. The article implied that drivers are the only people who use the road, but more than 3,000 people take the bus along that route every day.

    Apparently, many drivers assume the bus lanes are empty most of the time. In fact, buses run every six minutes at rush hour. I take the number 18 to work, and my journey has become fifteen minutes shorter since the lanes opened.

    I accept that the changes should have been explained better before they began. But I hope your newspaper will speak to bus passengers before writing about this again.

    Somjit P.
  questions:
    - stem: "Why is Somjit writing?"
      choices:
        - {t: "she disagrees with an article", why: "Your article ... I disagree"}
        - {t: "she wants new bus routes", why: "ไม่ได้ขอเส้นทางใหม่"}
        - {t: "she is complaining about a bus driver", why: "ไม่ได้ร้องเรียนคนขับ"}
        - {t: "she wants the lanes removed", why: "เธอสนับสนุนช่องทางรถเมล์"}
    - stem: "What does Somjit say about her own journey?"
      choices:
        - {t: "it is shorter than before", why: "my journey has become fifteen minutes shorter"}
        - {t: "it takes six minutes", why: "หกนาทีคือความถี่ของรถเมล์"}
        - {t: "she now drives to work", why: "เธอนั่งรถเมล์สาย 18"}
        - {t: "it is unchanged", why: "ใช้เวลาลดลงสิบห้านาที"}
    - stem: "What does Somjit agree with?"
      choices:
        - {t: "the plan was poorly explained", why: "the changes should have been explained better"}
        - {t: "traffic has become worse", why: "เธอไม่เห็นด้วย จึงใช้ไม่ได้"}
        - {t: "the lanes are often empty", why: "เธอบอกว่าเป็นความเข้าใจผิด"}
        - {t: "drivers are the main road users", why: "เธอบอกว่าผู้โดยสารรถเมล์ก็ใช้ถนน"}
  status: approved
