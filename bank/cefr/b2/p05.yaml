- id: cefr-b2-w05-058
  kind: read
  skill: rd
  topic: reflection-article
  level: 2
  pool: true
  title: "What Our Failed Market Taught Us"
  passage: |
    Two years ago, our community group opened a Sunday night market in the village square. We expected large crowds, but after four months we had to close it.

    Looking back, the problems were obvious. We chose Sunday night because it was convenient for us, but most visitors had to work early on Monday. We also neglected advertising, believing that people would simply hear about it. If we had asked local people what they wanted, we would have chosen a different day.

    We don't regret trying. The experience taught us to listen before planning. This year we reopened the market on Saturday afternoons after a survey of 300 residents, and it has been busy every week.
  questions:
    - stem: "Why did the Sunday market fail?"
      choices:
        - {t: "it was a bad day for visitors", why: "most visitors had to work early on Monday"}
        - {t: "the square was too small", why: "ไม่ได้พูดถึงขนาดลาน"}
        - {t: "the prices were too high", why: "ไม่ได้พูดถึงราคา"}
        - {t: "it rained most Sundays", why: "ในบทไม่ได้พูดถึง it rained most Sundays"}
    - stem: "What does the writer say they should have done?"
      choices:
        - {t: "asked residents first", why: "If we had asked local people ... different day"}
        - {t: "opened in a bigger town", why: "ไม่ได้พูดถึงเมืองอื่น"}
        - {t: "charged less money", why: "ไม่ได้พูดถึงค่าเช่า"}
        - {t: "closed it sooner", why: "ไม่ได้บอกว่าควรปิดเร็วกว่านี้"}
    - stem: "How do they feel about the experience now?"
      choices:
        - {t: "they think it was useful", why: "We don't regret trying. The experience taught us"}
        - {t: "they are embarrassed", why: "ไม่ได้พูดว่าอาย"}
        - {t: "they wish they hadn't tried", why: "ผู้เขียนบอกว่าไม่เสียใจ"}
        - {t: "they are still disappointed", why: "ไม่ได้พูดว่ายังผิดหวัง"}
  status: approved
