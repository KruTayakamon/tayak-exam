- id: cefr-b2-w03-058
  kind: read
  skill: rd
  topic: business-plan
  level: 2
  pool: true
  title: "Business Plan Summary: Baan Noodle Shop"
  passage: |
    Baan Noodle Shop opened two years ago in a small town near Ayutthaya. It serves around 120 customers a day, mostly office workers at lunchtime.

    Our main objective for next year is to increase evening sales, which are currently very low. To do this, we are going to introduce a new dinner menu with rice dishes and extend our opening hours until 9 pm.

    We also plan to start a delivery service through a popular app. This will require one extra member of staff. We anticipate that delivery will cover its own costs within six months.

    We are postponing our plan to open a second shop until the first shop is consistently profitable in the evenings.
  questions:
    - stem: "What is the shop's main problem now?"
      choices:
        - {t: "few customers come in the evening", why: "evening sales, which are currently very low"}
        - {t: "it has too many staff", why: "ไม่ได้พูดว่าพนักงานมากเกิน"}
        - {t: "lunch is too expensive", why: "ไม่ได้พูดถึงราคาอาหารกลางวัน"}
        - {t: "it is too far from the town", why: "ร้านอยู่ใกล้เมือง"}
    - stem: "What will the delivery service need?"
      choices:
        - {t: "one more employee", why: "This will require one extra member of staff"}
        - {t: "a second shop", why: "ร้านที่สองถูกเลื่อนไป"}
        - {t: "a new kitchen", why: "ไม่ได้พูดถึงครัวใหม่"}
        - {t: "longer lunch hours", why: "ขยายเวลาเปิดถึงสามทุ่ม ไม่ใช่มื้อกลางวัน"}
    - stem: "When will they open a second shop?"
      choices:
        - {t: "after evenings become profitable", why: "until the first shop is consistently profitable in the evenings"}
        - {t: "next year", why: "เป้าปีหน้าคือยอดขายตอนเย็น"}
        - {t: "in six months", why: "หกเดือนคือเวลาที่บริการส่งจะคุ้มทุน"}
        - {t: "after two years", why: "เปิดมาแล้วสองปี"}
  status: approved
