- id: cefr-b2-w08-058
  kind: read
  skill: rd
  topic: policy-article
  level: 2
  pool: true
  title: "Explaining the (Fictional) Clean Air Policy"
  passage: |
    From next year, the city of Riverdale will introduce a new Clean Air Policy. Under the policy, older trucks that produce high levels of smoke will be restricted from entering the city centre between 7 am and 7 pm.

    Public buses will be excluded from the rule until 2028, when the city expects to have replaced them with electric buses. Owners of small businesses can apply for a loan of up to 200,000 baht to update their vehicles.

    Critics argue that the policy will make deliveries more expensive. However, the city says air pollution in the centre has risen by 20 per cent in three years and that action is unavoidable. The rule will be enforced by cameras at twelve entry points.
  questions:
    - stem: "When can older trucks enter the city centre?"
      choices:
        - {t: "at night", why: "restricted ... between 7 am and 7 pm"}
        - {t: "only on weekends", why: "ไม่ได้พูดถึงวันหยุด"}
        - {t: "never", why: "ห้ามเฉพาะช่วงกลางวัน"}
        - {t: "from 2028", why: "2028 เกี่ยวกับรถเมล์"}
    - stem: "What is true about public buses?"
      choices:
        - {t: "the rule won't apply to them until 2028", why: "excluded from the rule until 2028"}
        - {t: "they are already electric", why: "เมืองคาดว่าจะเปลี่ยนเป็นไฟฟ้าภายหลัง"}
        - {t: "they can't enter the centre", why: "ไม่ได้ถูกห้าม จึงใช้ไม่ได้"}
        - {t: "they need a loan", why: "เงินกู้มีไว้ให้ธุรกิจขนาดเล็ก"}
    - stem: "How will the rule be enforced?"
      choices:
        - {t: "with cameras", why: "enforced by cameras at twelve entry points"}
        - {t: "by the police", why: "ไม่ได้พูดถึงตำรวจ"}
        - {t: "by truck owners", why: "ในบทไม่ได้พูดถึง by truck owners"}
        - {t: "with paper tickets", why: "ในบทไม่ได้พูดถึง with paper tickets"}
  status: approved
