        - {t: "her classmates asked her for help", why: "ในบทไม่ได้พูดถึง her classmates asked her for help"}
        - {t: "she got a discount on the course", why: "ในบทไม่ได้พูดถึง she got a discount on the course"}
    - stem: "What is her situation now?"
