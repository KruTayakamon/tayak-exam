- id: cefr-b2-cpa-028
  kind: read
  skill: rd
  topic: opinion-article
  level: 2
  title: "Is the Four-Day Week Worth It?"
  passage: |
    Several companies in Bangkok have recently experimented with a four-day working week. Staff work the same hours over four days, or slightly fewer hours, while keeping the same pay. Early reports appear to be positive, but the evidence is still limited.

    Supporters point out that employees who have an extra day off tend to be less stressed and take fewer sick days. Moreover, some companies have found that productivity did not fall; in a few cases, it even rose slightly. A small design agency that tried the system for six months reported that it had become much easier to recruit new staff.

    Nevertheless, the four-day week does not suit every business. Hospitals, shops and restaurants need people at work every day, and introducing the system would require hiring extra staff. Critics also warn that longer working days may simply move stress from one part of the week to another.

    In my view, the four-day week is worth testing, but only if companies measure the results honestly. What works for a design agency may not work for a hospital, and it would be a mistake to assume that one model fits all.
  questions:
    - stem: What does the writer say about the evidence so far?
      choices:
        - {t: it is positive but not yet strong, why: "appear to be positive, but the evidence is still limited"}
        - {t: it proves the system works, why: "ใช้คำว่า appear และ limited"}
        - {t: it is completely negative, why: "ผลเบื้องต้นดูดี"}
        - {t: there is none, why: "มีรายงานเบื้องต้น"}
    - stem: What advantage did the design agency report?
      choices:
        - {t: hiring became easier, why: "it had become much easier to recruit new staff"}
        - {t: profits doubled, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: staff worked longer hours, why: "ไม่ใช่ข้อดีที่รายงาน"}
        - {t: they closed one day a week to save money, why: "บทไม่ได้พูดว่า they closed one day a week to save money"}
    - stem: Why might the system be difficult for hospitals?
      choices:
        - {t: they need staff every day, so would need to hire more, why: "need people at work every day ... require hiring extra staff"}
        - {t: doctors do not want a day off, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: hospitals are too small, why: "บทไม่ได้พูดว่า hospitals are too small"}
        - {t: patients would complain, why: "บทไม่ได้พูดว่า patients would complain"}
    - stem: What is the writer's opinion?
      choices:
        - {t: it should be tested carefully as it may not suit everyone, why: "worth testing ... it would be a mistake to assume that one model fits all"}
        - {t: every company should adopt it now, why: "ผู้เขียนเตือนว่าไม่เหมาะกับทุกที่"}
        - {t: it should be banned, why: "ผู้เขียนเห็นว่าควรทดลอง"}
        - {t: it only works in hospitals, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
