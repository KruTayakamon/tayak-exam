- id: cefr-b2-w04-058
  kind: read
  skill: rd
  topic: evaluation-summary
  level: 2
  pool: true
  title: "Evaluation Summary: Free Lunch Project, Year 1"
  passage: |
    The free lunch project was introduced in eight village schools last year. It was evaluated by an independent team using attendance records, health checks and interviews with teachers and parents.

    The results indicate that attendance increased by 9 per cent on average. Children were found to be more active in afternoon lessons, although this was based mainly on teachers' opinions rather than test scores.

    The main weakness identified was cost. Food prices rose during the year, and two schools had to reduce portion sizes in the final term. The team recommends that the budget should be reviewed every six months.
  questions:
    - stem: "How was the project evaluated?"
      choices:
        - {t: "in several different ways", why: "attendance records, health checks and interviews"}
        - {t: "only by asking parents", why: "ใช้หลายวิธี ไม่ใช่แค่ถามผู้ปกครอง"}
        - {t: "using national test scores only", why: "ไม่ได้ใช้คะแนนสอบระดับชาติ"}
        - {t: "by the schools themselves", why: "ทีมอิสระเป็นผู้ประเมิน"}
    - stem: "What is said about children's activity in the afternoon?"
      choices:
        - {t: "the evidence mostly came from teachers", why: "based mainly on teachers' opinions"}
        - {t: "it was proved by test scores", why: "ไม่ได้มาจากคะแนนสอบ"}
        - {t: "it did not change", why: "มีการพบว่าเด็กกระตือรือร้นขึ้น"}
        - {t: "it increased by 9 per cent", why: "9% คือการมาเรียน"}
    - stem: "What does the team recommend?"
      choices:
        - {t: "checking the budget twice a year", why: "budget should be reviewed every six months"}
        - {t: "giving smaller portions", why: "เป็นปัญหา ไม่ใช่ข้อแนะนำ"}
        - {t: "ending the project", why: "ไม่ได้แนะนำให้ยุติ"}
        - {t: "adding more schools to the project", why: "ไม่ได้พูดถึงการเพิ่มโรงเรียน"}
  status: approved
