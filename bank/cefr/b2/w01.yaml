# ---------- วันที่ 4 · อ่านเรื่องเล่าและฟังลำดับเหตุการณ์ ----------
- id: cefr-b2-w01-035
  kind: read
  skill: rd
  topic: first-year-story
  level: 2
  title: "My First Year as a Nurse"
  passage: |
    I had always wanted to be a nurse, but nothing had prepared me for my first year on a busy hospital ward. On my very first night shift, two patients needed urgent care at the same time, and I froze. Fortunately, a senior nurse had been watching from the corridor. She stepped in calmly, and within minutes both patients were stable.

    For the next few months I felt overwhelmed. I would go home after twelve-hour shifts and lie awake, replaying every decision I had made. I was reluctant to ask questions because I didn't want my colleagues to think I was incompetent.

    The turning point came when that same senior nurse invited me for coffee. She told me she had cried in the staff toilets during her own first year. Initially, I didn't believe her; she seemed so confident. But her story gave me permission to admit that I was struggling.

    Gradually, things improved. I started asking for advice and writing short notes after each shift about what had gone well. Eventually, the panic I used to feel turned into something closer to focus. Looking back, I realise that the difficult moments taught me more than any textbook. I now mentor new nurses myself, and the first thing I tell them is that everyone finds the first year hard.
  questions:
    - stem: What is the main message of the story?
      choices:
        - {t: difficulties in the first year are normal and can be overcome with support, why: "ทั้งเรื่องเล่าความยากและการได้รับการช่วยเหลือจนดีขึ้น"}
        - {t: nursing is too stressful for most people, why: "ผู้เขียนยังทำงานและเป็นพี่เลี้ยงให้คนอื่น"}
        - {t: textbooks are more useful than experience, why: "ผู้เขียนบอกตรงข้าม"}
        - {t: senior nurses are often unkind, why: "พยาบาลอาวุโสในเรื่องช่วยเหลือผู้เขียน"}
    - stem: Why didn't the writer ask questions at first?
      choices:
        - {t: she worried about looking unable to do the job, why: "didn't want my colleagues to think I was incompetent"}
        - {t: she was too busy, why: "เรื่องไม่ได้ให้เหตุผลนี้"}
        - {t: nobody was available, why: "มีพยาบาลอาวุโสอยู่"}
        - {t: she already knew the answers, why: "เธอรู้สึกท่วมท้นและไม่มั่นใจ"}
    - stem: What happened BEFORE the senior nurse stepped in on the first night?
      choices:
        - {t: she had been watching from the corridor, why: "a senior nurse had been watching from the corridor"}
        - {t: she had invited the writer for coffee, why: "การชวนดื่มกาแฟเกิดหลายเดือนต่อมา"}
        - {t: she had cried in the staff toilets, why: "เรื่องนี้เกิดในปีแรกของพยาบาลอาวุโสเอง"}
        - {t: the patients had become stable, why: "ผู้ป่วยอาการคงที่หลังพยาบาลอาวุโสเข้ามาช่วย"}
    - stem: What can be inferred about the writer now?
      choices:
        - {t: she uses her own experience to help others, why: "I now mentor new nurses myself"}
        - {t: she plans to leave nursing, why: "ไม่มีข้อมูลนี้ในเรื่อง"}
        - {t: she still panics on every shift, why: "ความตื่นตระหนกกลายเป็นสมาธิแล้ว"}
        - {t: she has stopped writing notes, why: "บทไม่ได้พูดว่า she has stopped writing notes"}
  status: approved
