# ---------- วันที่ 4 · อ่านรายงานความคืบหน้าและฟังรายงานปากเปล่า ----------
- id: cefr-b2-w02-035
  kind: read
  skill: rd
  topic: progress-report
  level: 2
  title: "Monthly Progress Report · Community Health App"
  passage: |
    Over the past month, the team has been testing the new appointment app in three local clinics. So far, 1,200 patients have registered, considerably more than the 800 we had expected. Feedback has generally been positive, especially from older users, who say the large buttons make the app easy to use.

    However, two issues need attention. First, the reminder messages have not been arriving consistently. Some patients received three reminders, while others received none. Our developers have been investigating the problem since last Tuesday and believe it is caused by a server setting. They expect to fix it by the end of next week.

    Second, clinic staff report that their workload has increased. Because patients can now book online at any time, receptionists have been spending more time checking and confirming appointments. Neither clinic manager wants to stop the online system, but both have asked for a simpler way to view each day's bookings.

    Next month, we will monitor the reminder system closely and design a daily summary screen for clinic staff. We remain on schedule to launch the app in all twelve clinics in March.
  questions:
    - stem: What is the main purpose of the report?
      choices:
        - {t: to update readers on results and problems so far, why: "รายงานผลการทดลอง ปัญหา และแผนเดือนหน้า"}
        - {t: to advertise the app to patients, why: "เป็นรายงานภายใน ไม่ใช่โฆษณา"}
        - {t: to cancel the project, why: "รายงานบอกว่ายังเป็นไปตามแผน"}
        - {t: to complain about the developers, why: "ไม่ได้ตำหนินักพัฒนา"}
    - stem: How did the number of registrations compare with expectations?
      choices:
        - {t: it was much higher, why: "1,200 ... considerably more than the 800 we had expected"}
        - {t: it was slightly lower, why: "ตัวเลขจริงสูงกว่าที่คาด"}
        - {t: it was exactly as expected, why: "ต่างกัน 400 คน จึงใช้ไม่ได้"}
        - {t: it is not mentioned, why: "รายงานให้ตัวเลขชัดเจน"}
    - stem: Why has the receptionists' workload increased?
      choices:
        - {t: they spend more time checking online bookings, why: "receptionists have been spending more time checking and confirming appointments"}
        - {t: more staff have left the clinics, why: "ไม่มีข้อมูลเรื่องพนักงานลาออก"}
        - {t: the app has stopped working, why: "แอปยังใช้งานได้ มีปัญหาเฉพาะข้อความเตือน"}
        - {t: patients phone more often, why: "ไม่มีข้อมูลนี้ในรายงาน"}
    - stem: What do the clinic managers want?
      choices:
        - {t: an easier way to see daily appointments, why: "asked for a simpler way to view each day's bookings"}
        - {t: to stop online booking, why: "Neither clinic manager wants to stop the online system"}
        - {t: more reminder messages, why: "ปัญหาคือข้อความเตือนไม่สม่ำเสมอ ไม่ได้ขอเพิ่ม"}
        - {t: to delay the launch, why: "รายงานบอกว่ายังเปิดตัวตามแผน"}
  status: approved
