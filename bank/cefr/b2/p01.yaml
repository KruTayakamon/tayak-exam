- id: cefr-b2-w01-058
  kind: read
  skill: rd
  topic: first-year-story
  level: 2
  pool: true
  title: "My First Year as a Hospital Pharmacist"
  passage: |
    When I started at the hospital, I had just finished university and had never worked night shifts. For the first two months, I was constantly tired, and I would often make small mistakes, such as putting medicine in the wrong drawer.

    My supervisor, Khun Duangjai, noticed that I was struggling. Instead of criticising me, she suggested that I write a checklist for every task. Initially I was reluctant, because I thought checklists were for beginners. But I had to admit that I was a beginner.

    Gradually, things improved. By the end of the year, I had stopped making the same mistakes, and I had started training new staff myself. Looking back, the biggest challenge wasn't the work itself. It was accepting that I needed help.
  questions:
    - stem: "What problem did the writer have at the beginning?"
      choices:
        - {t: "making small mistakes because of tiredness", why: "constantly tired ... make small mistakes"}
        - {t: "arguing with the supervisor", why: "หัวหน้าช่วยเหลือ ไม่ได้ทะเลาะกัน"}
        - {t: "not finishing university", why: "เขาเพิ่งเรียนจบ"}
        - {t: "being given too few tasks", why: "ไม่ได้พูดว่างานน้อย"}
    - stem: "Why was the writer reluctant to use a checklist at first?"
      choices:
        - {t: "he felt it was for inexperienced staff", why: "I thought checklists were for beginners"}
        - {t: "it took too much time", why: "ไม่ได้พูดว่าเสียเวลา"}
        - {t: "his supervisor didn't use one", why: "ไม่ได้พูดถึงหัวหน้าใช้หรือไม่"}
        - {t: "he had too many tasks to list", why: "ไม่ได้พูดถึงเรื่องนี้"}
    - stem: "According to the writer, what was hardest?"
      choices:
        - {t: "accepting help", why: "It was accepting that I needed help"}
        - {t: "the night shifts", why: "เป็นปัญหาช่วงแรก แต่ไม่ใช่ที่ยากที่สุด"}
        - {t: "training new staff", why: "เป็นสิ่งที่ทำได้ภายหลัง"}
        - {t: "the work itself", why: "เขาบอกว่าไม่ใช่ตัวงาน"}
  status: approved
