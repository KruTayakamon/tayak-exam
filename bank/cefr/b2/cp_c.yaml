        - {t: the address was wrong, why: "บทไม่ได้พูดว่า the address was wrong"}
        - {t: the price has gone up, why: "บทไม่ได้พูดว่า the price has gone up"}
    - stem: How quickly can the grey chair be sent?
      choices:
        - {t: tomorrow, why: "which we can send tomorrow"}
        - {t: on 20 May, why: "นั่นคือวันของรุ่นสีฟ้า"}
        - {t: in seven days, why: "เจ็ดวันคือเวลาให้ตอบกลับ"}
        - {t: it cannot be sent, why: "ส่งได้พรุ่งนี้ จึงใช้ไม่ได้"}
    - stem: What will happen if Ms Suda does not reply?
      choices:
        - {t: she will wait for the blue chair, why: "we will assume you are happy to wait for the blue model"}
