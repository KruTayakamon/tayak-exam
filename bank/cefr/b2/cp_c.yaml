    Thank you for your order of a blue office chair (order no. 4417). Unfortunately, the blue model is temporarily out of stock and will not be available until 20 May.

    You have three options. You can wait for the blue chair, which will be delivered free of charge. Alternatively, you can choose the same chair in grey, which we can send tomorrow. If neither option suits you, we will give you a full refund.

    Please let us know your choice by replying to this email. If we do not hear from you within seven days, we will assume you are happy to wait for the blue model.

    Kind regards,
    Customer Service Team
