- id: cefr-b2-cpc-028
  kind: read
  skill: rd
  topic: evaluation-article
  level: 2
  title: "What We Learned from a Year of Online Grocery Delivery"
  passage: |
    When a family-run supermarket in Khon Kaen started offering online delivery last year, the owners expected it to be a small extra service. Instead, it has become one of the most important parts of the business, accounting for almost a quarter of total sales.

    The owners say the biggest surprise was who used the service. They had assumed that young office workers would be the main customers. In fact, the largest group turned out to be older people, many of whom found it difficult to carry heavy shopping home. Consequently, the shop has made its website easier to read and added a phone ordering line.

    The service has not been without problems. In the first few months, around one order in ten contained mistakes, such as missing items or the wrong brand. Having identified the cause, a confusing stock system, the owners introduced a simple checking procedure, and errors have since fallen to fewer than one in fifty.

    Costs remain a concern. Delivery drivers, packaging and fuel are expensive, and the shop currently makes very little profit on online orders. Nevertheless, the owners believe the service is worth keeping, as online customers tend to visit the physical shop more often too.
  questions:
    - stem: How important has online delivery become?
      choices:
        - {t: it makes up nearly a quarter of sales, why: "accounting for almost a quarter of total sales"}
        - {t: it is a very small extra service, why: "นั่นคือสิ่งที่เจ้าของคาดไว้ตอนแรก"}
        - {t: it is the only way the shop sells, why: "ยังมีร้านจริง จึงใช้ไม่ได้"}
        - {t: it has completely replaced the physical shop in Khon Kaen, why: "ร้านจริงยังเปิด"}
    - stem: Who turned out to be the main users?
      choices:
        - {t: older people, why: "the largest group turned out to be older people"}
        - {t: young office workers, why: "เป็นกลุ่มที่เจ้าของคาดไว้ ไม่ใช่ความจริง"}
        - {t: students, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: other shops, why: "บทไม่ได้พูดว่า other shops"}
    - stem: What reduced the number of mistakes?
      choices:
        - {t: a simple checking procedure, why: "introduced a simple checking procedure, and errors have since fallen"}
        - {t: hiring more delivery drivers to check each order, why: "ไม่ได้ช่วยลดความผิดพลาด"}
        - {t: a phone ordering line, why: "สายโทรสั่งเพิ่มเพื่อผู้สูงอายุ"}
        - {t: removing some brands, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: Why do the owners keep the service despite low profits?
      choices:
        - {t: online customers also visit the shop more, why: "online customers tend to visit the physical shop more often too"}
        - {t: delivery costs are falling, why: "ค่าใช้จ่ายยังเป็นปัญหา"}
        - {t: "the government pays for the drivers, packaging and fuel", why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: it is required by law, why: "บทไม่ได้พูดว่า it is required by law"}
