# ---------- วันที่ 4 · อ่านบทความเชิงวิเคราะห์และฟังบรรยายยาว ----------
- id: cefr-c1-w07-035
  kind: read
  skill: rd
  topic: analytical-article
  level: 2
  title: "Two Kinds of Tourism"
  passage: |
    Tourism is often discussed as if it were a single industry. In reality, two very different models exist side by side. The first relies on large numbers of visitors who stay briefly and spend relatively little each. The second attracts fewer people, who stay longer and spend more, often on local services. The former has dominated policy in many countries for decades; the latter has only recently begun to receive serious attention.

    The appeal of mass tourism is obvious. It creates jobs quickly and requires little planning beyond hotels and transport. Its costs, however, are less visible. Popular destinations suffer from overcrowding, rising rents and pressure on water supplies. Such problems are rarely included in official figures, which tend to count arrivals rather than their impact.

    Slower tourism, by contrast, spreads income more widely. A visitor who stays two weeks in a village guesthouse is likely to eat in local restaurants, hire local guides and buy local products. This pattern keeps a larger share of the money within the community. Its main limitation is scale: it cannot replace the income from millions of short-stay visitors, at least not quickly.

    The choice, then, is not a simple dichotomy. Most successful destinations combine both models, albeit in different proportions. What matters is that planners measure what tourism actually does to a place, not merely how many people it brings. Insofar as governments continue to judge success by arrival numbers alone, the disparity between busy tourist centres and the communities around them is likely to grow.
  questions:
    - stem: What is the main argument of the article?
      choices:
        - {t: tourism policy should measure impact rather than visitor numbers, why: "What matters is that planners measure what tourism actually does to a place"}
        - {t: mass tourism should be banned, why: "ผู้เขียนบอกว่าที่สำเร็จมักผสมทั้งสองแบบ"}
        - {t: slow tourism can quickly replace mass tourism, why: "บทบอกว่าแทนไม่ได้ อย่างน้อยไม่ใช่เร็ว ๆ"}
        - {t: villages do not benefit from tourism, why: "บทบอกว่าการท่องเที่ยวแบบช้าช่วยกระจายรายได้สู่ชุมชน"}
    - stem: In the first paragraph, what does "the latter" refer to?
      choices:
        - {t: tourism with fewer visitors who stay longer, why: "the latter = แบบที่สอง ที่มาน้อยแต่อยู่นานและใช้จ่ายมาก"}
        - {t: tourism with large numbers of short-stay visitors, why: "นั่นคือ the former"}
        - {t: the hotel industry, why: "โรงแรมถูกพูดถึงในย่อหน้าที่สอง ไม่ใช่สิ่งที่ the latter อ้างถึง"}
        - {t: government policy, why: "ไม่ใช่สิ่งที่ the latter อ้างถึง"}
    - stem: Why are the costs of mass tourism described as "less visible"?
      choices:
        - {t: official figures usually count visitors and not their effects, why: "official figures ... tend to count arrivals rather than their impact"}
        - {t: tourists hide their spending, why: "บทไม่ได้บอกว่านักท่องเที่ยวปกปิดการใช้จ่าย"}
        - {t: the costs only appear decades later, why: "บทไม่ได้พูดเรื่องเวลาที่ผลปรากฏ"}
        - {t: they are paid by foreign companies, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: What does the writer imply will happen if governments do not change their approach?
      choices:
        - {t: inequality between tourist centres and nearby communities may increase, why: "the disparity between busy tourist centres and the communities around them is likely to grow"}
        - {t: tourist numbers will fall sharply, why: "บทไม่ได้คาดว่าจำนวนนักท่องเที่ยวจะลด"}
        - {t: slow tourism will disappear, why: "ไม่มีข้อมูลที่สนับสนุน"}
        - {t: hotels will stop being built, why: "บทไม่ได้คาดการณ์เรื่องการสร้างโรงแรม"}
  status: draft
