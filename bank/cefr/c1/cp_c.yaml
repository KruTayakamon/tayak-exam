        - {t: some streets flood more than others, why: "เรื่องน้ำท่วมเป็นประโยชน์อีกข้อ ไม่ใช่ความเหลื่อมล้ำที่พูดถึง"}
    - stem: What does the final paragraph suggest about official tree-planting figures?
