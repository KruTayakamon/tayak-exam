        - {t: air conditioning is the best way to cool cities, why: "บทไม่ได้เสนอแบบนี้"}
        - {t: Asian cities have stopped building roads, why: "ไม่มีข้อมูลที่สนับสนุน"}
    - stem: How do trees reduce heat, according to the article?
      choices:
        - {t: by giving shade and cooling the air through their leaves, why: "providing shade and by releasing water through their leaves"}
        - {t: by absorbing sunlight and releasing it at night, why: "นั่นคือสิ่งที่พื้นผิวลาดยางทำ ไม่ใช่ต้นไม้"}
        - {t: by blocking the wind, why: "ไม่มีข้อมูลนี้ในบท"}
        - {t: by reducing the number of cars, why: "บทไม่ได้พูดว่า by reducing the number of cars"}
    - stem: What problem does the word "disparity" describe in paragraph 3?
      choices:
