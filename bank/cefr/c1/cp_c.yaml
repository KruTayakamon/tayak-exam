  title: "Why Cities Are Planting Trees Again"
  passage: |
    For much of the twentieth century, city planners treated trees as decoration: pleasant to look at, but easily removed to make room for wider roads or new buildings. That view is changing rapidly. Across Asia, cities are now planting trees on a scale not seen for decades, and the reasons are less aesthetic than practical.

    The most pressing is heat. Paved surfaces absorb sunlight and release it slowly, which means that dense city centres can be several degrees hotter than the surrounding countryside, particularly at night. Trees mitigate this effect in two ways: by providing shade and by releasing water through their leaves, which cools the surrounding air. In one fictional study of Bangkok's districts, streets with continuous tree cover were, on average, four degrees cooler in the afternoon than similar streets without it.

    There are other benefits, too. Trees reduce flooding by allowing rainwater to soak into the ground, and there is growing evidence that access to green space is conducive to mental wellbeing. Such benefits, however, are not evenly distributed. Wealthier neighbourhoods typically have far more trees than poorer ones, a disparity that means those least able to afford air conditioning often live in the hottest streets.

    Planting alone is not enough. Young trees need years of watering and care, and many die within the first few seasons. Insofar as cities measure success by the number of trees planted rather than the number that survive, the figures can be misleading. The real test, as one urban ecologist put it, is not how many trees a city plants, but how many it still has ten years later.
  questions:
