- id: cefr-c1-cpc-026
  kind: read
  skill: rd
  topic: research-analysis
  level: 1
  title: "Do Brain-Training Games Work?"
  passage: |
    Brain-training apps promise to keep our minds sharp as we age. Their advertisements are often compelling: play for ten minutes a day, they suggest, and you will remember more, think faster and perhaps even reduce your risk of dementia. Millions of people have downloaded them. But what does the evidence actually show?

    The short answer is that people get better at the games. In study after study, players improve their scores steadily over several weeks. The more difficult question is whether these improvements transfer to everyday life, such as remembering a shopping list or following a conversation in a noisy room. Here, the evidence is far weaker. Most large reviews have found that the benefits are limited to the specific tasks practised, with little measurable effect on general memory or reasoning.

    That is not to say that keeping the brain active is pointless. Activities that combine mental effort with social contact or physical movement, such as learning a language in a class, dancing or volunteering, appear to be more strongly linked to healthy ageing. However, these studies are mostly observational, which means they show a connection rather than proving that the activity causes the benefit.

    For now, the most reasonable conclusion is a cautious one. Brain-training games are unlikely to do any harm, and some people simply enjoy them. But anyone hoping they will protect against memory loss would arguably be better off joining a class or taking a daily walk with a friend.
  questions:
    - stem: What is the writer's main conclusion about brain-training games?
      choices:
