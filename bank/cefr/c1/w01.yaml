# ---------- วันที่ 4 · อ่านและฟัง ----------
- id: cefr-c1-w01-035
  kind: read
  skill: rd
  topic: workplace-communication
  level: 2
  title: "Why Clear Messages Get Lost at Work"
  passage: |
    Most managers believe they communicate clearly. Their staff, however, often disagree. In a survey of 1,200 office workers, nearly two thirds said they had wasted time in the past month because an instruction had been ambiguous. Interestingly, few of them blamed their managers' English or vocabulary. The problem, they said, was what had been left unsaid.

    Consider a common email: "Could you have a look at the budget before Friday?" To the sender, the meaning may seem obvious: check the figures carefully and correct any errors. To the reader, however, "have a look" might suggest a quick glance. Neither person is wrong; they are simply relying on different assumptions. The more senior the writer, the researchers found, the more likely they were to assume that their expectations were implicit in a short message.

    The cost of this gap is not only time. Employees who repeatedly misread instructions tend to become anxious and less willing to ask questions, fearing that doing so will make them look incompetent. Over time, this silence can do far more damage than any single mistake.

    The solution is not necessarily longer messages. Concise instructions work well, the researchers argue, as long as they state three things explicitly: what needs to be done, to what standard, and by when. Managers who adopted this simple habit reported fewer delays within a month. Several also noticed something they had not expected: their teams began to ask more questions, not fewer, because the conversation had become safer.
  questions:
    - stem: What is the main point of the article?
      choices:
        - {t: "unclear expectations, not language, cause many workplace misunderstandings", why: "ปัญหาคือสิ่งที่ไม่ได้พูด (what had been left unsaid) ไม่ใช่ภาษาของผู้จัดการ"}
        - {t: managers need better English vocabulary, why: "บทความบอกว่าพนักงานไม่ได้โทษภาษาหรือคำศัพท์"}
        - {t: emails should always be longer, why: "บทความบอกว่าไม่จำเป็นต้องยาวขึ้น"}
        - {t: office workers waste too much time on email, why: "เป็นรายละเอียดหนึ่ง ไม่ใช่ประเด็นหลัก"}
    - stem: According to the survey, what did workers see as the cause of the problem?
      choices:
        - {t: important information that was not stated, why: "The problem, they said, was what had been left unsaid"}
        - {t: their managers' poor grammar, why: "few of them blamed their managers' English"}
        - {t: having too many long and pointless meetings, why: "ไม่มีการพูดถึงการประชุม"}
        - {t: deadlines that were too short, why: "ไม่ได้โทษกำหนดเวลา"}
    - stem: Why do some employees stop asking questions?
      choices:
        - {t: they worry about seeming unable to do their job, why: "fearing that doing so will make them look incompetent"}
        - {t: their managers are rarely available, why: "ไม่ได้พูดว่าผู้จัดการไม่ว่าง"}
        - {t: the instructions are already very long, why: "ไม่ได้บอกว่าคำสั่งยาวเกิน"}
        - {t: they prefer to work alone, why: "ไม่มีข้อมูลนี้ในบทความ"}
    - stem: What can be inferred about teams whose managers changed their habits?
      choices:
        - {t: team members felt more comfortable speaking up, why: "ถามมากขึ้นเพราะการคุยปลอดภัยขึ้น (had become safer)"}
        - {t: they made no more mistakes at all, why: "บทความบอกแค่ว่าความล่าช้าลดลง ไม่ได้บอกว่าไม่ผิดเลย"}
        - {t: they stopped needing a manager, why: "ไม่มีข้อมูลที่สนับสนุน"}
        - {t: their emails became much shorter, why: "บทความไม่ได้พูดว่าอีเมลสั้นลง"}
  status: approved
