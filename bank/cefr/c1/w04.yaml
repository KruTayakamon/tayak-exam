# ---------- วันที่ 4 · อ่านระเบียบทางการและฟังแถลงการณ์ ----------
- id: cefr-c1-w04-035
  kind: read
  skill: rd
  topic: formal-regulation
  level: 2
  title: "Riverbend Municipality · Regulations on Street Vending (fictional)"
  passage: |
    1. Purpose. These regulations are intended to ensure the safe and orderly use of public footpaths while supporting small local businesses. They apply to all vendors operating within the municipal area, with the exception of registered festival markets.

    2. Permits. Every vendor must hold a valid permit, which shall be displayed at the stall at all times. Applications must be submitted no later than thirty days before trading begins. The municipality reserves the right to refuse an application at its discretion, provided that written reasons are given.

    3. Location. Stalls shall not obstruct more than half the width of any footpath. It is required that a clear path of at least 1.5 metres be maintained for pedestrians, including wheelchair users. Vending is not permitted within twenty metres of a hospital entrance.

    4. Hygiene. Vendors selling cooked food must complete an approved food-safety course. Notwithstanding any previous training, all vendors must attend a refresher course every two years.

    5. Penalties. Failure to comply with these regulations may result in a written warning. A second offence within twelve months may lead to the suspension of the permit. The onus is on the vendor to prove that any obstruction was temporary and unavoidable.
  questions:
    - stem: What is the main purpose of the regulations?
      choices:
        - {t: to balance pedestrian safety with support for vendors, why: "safe and orderly use of public footpaths while supporting small local businesses"}
        - {t: to close all street stalls in the city, why: "ระเบียบสนับสนุนธุรกิจท้องถิ่น ไม่ได้ปิด"}
        - {t: to increase the cost of permits, why: "ไม่มีการพูดถึงค่าใบอนุญาต"}
        - {t: to organise festival markets, why: "ตลาดเทศกาลเป็นข้อยกเว้น ไม่ใช่จุดประสงค์"}
    - stem: What must the municipality do if it refuses an application?
      choices:
        - {t: explain its decision in writing, why: "provided that written reasons are given"}
        - {t: offer a different location, why: "ไม่มีข้อกำหนดนี้"}
        - {t: return the vendor's money within thirty days, why: "สามสิบวันคือกำหนดยื่นคำขอ"}
        - {t: ask a court for permission, why: "ระเบียบไม่ได้พูดถึงศาลเลย"}
    - stem: Which vendor would be breaking the rules?
      choices:
        - {t: one whose stall leaves a 1-metre path, why: "ต้องเหลือทางเดินอย่างน้อย 1.5 เมตร"}
        - {t: one at a registered festival market without a permit, why: "ตลาดเทศกาลที่ลงทะเบียนได้รับยกเว้น"}
        - {t: one trading 50 metres from a hospital, why: "ห้ามเฉพาะภายใน 20 เมตร"}
        - {t: one who took a food course a year ago, why: "ต้องอบรมซ้ำทุกสองปี หนึ่งปีจึงยังไม่ผิด"}
    - stem: What does the final sentence imply?
      choices:
        - {t: vendors must provide evidence to defend themselves, why: "The onus is on the vendor to prove ..."}
        - {t: officials must prove the vendor is guilty, why: "กลับด้าน ภาระพิสูจน์อยู่ที่ผู้ค้า"}
        - {t: temporary obstructions are always allowed, why: "ต้องพิสูจน์ว่าชั่วคราวและหลีกเลี่ยงไม่ได้ ไม่ใช่อนุญาตเสมอ"}
        - {t: permits cannot be suspended, why: "ข้อ 5 บอกว่าระงับใบอนุญาตได้"}
  status: draft
