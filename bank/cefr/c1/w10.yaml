# ---------- วันที่ 4 · อ่านบทความวิชาการและฟังอภิปราย ----------
- id: cefr-c1-w10-035
  kind: read
  skill: rd
  topic: educational-equity
  level: 2
  title: "Equal Access, Unequal Outcomes"
  passage: |
    Over the past twenty years, access to secondary education in many middle-income countries has expanded dramatically. In the fictional nation of Valaria, for instance, the proportion of fifteen-year-olds attending school rose from 60 to over 90 per cent. By that measure alone, the policy has been a remarkable success.

    Yet attendance is not the same as learning. Much as governments might wish otherwise, national test results in Valaria have barely changed, and the gap between urban and rural pupils has, if anything, widened. Rural schools tend to have fewer qualified teachers, larger classes and limited internet access, conditions hardly conducive to effective learning. The more remote the school, the wider the gap tends to be.

    Two broad responses have been proposed. The first is to direct additional funding to the most disadvantaged schools, an approach that is more equitable but politically contentious, since wealthier areas may lose resources. The second is to expand online learning, which appears cheaper and faster to introduce. However attractive the latter may seem, evidence suggests that it is nowhere near as effective for younger pupils without adult support at home, precisely the group that needs help most.

    Neither approach is likely to succeed on its own. What the research does suggest is that the problem is not so much a lack of schools as a lack of the conditions that make learning possible: trained teachers, manageable class sizes and stable funding. Whatever the chosen policy, progress will be measured not in buildings opened but in skills gained.
  questions:
    - stem: What is the main argument of the article?
      choices:
        - {t: wider access to school has not produced equal learning, why: "attendance is not the same as learning และช่องว่างยังอยู่"}
        - {t: Valaria's education policy has completely failed, why: "บทยอมรับว่าการเข้าเรียนเพิ่มขึ้นเป็นความสำเร็จ"}
        - {t: online learning is the best solution, why: "บทบอกว่าการเรียนออนไลน์ไม่ได้ผลกับเด็กเล็ก"}
        - {t: rural pupils do not want to learn, why: "บทโทษสภาพแวดล้อม ไม่ใช่ตัวนักเรียน"}
    - stem: According to the article, why is extra funding for poor schools "contentious"?
      choices:
        - {t: richer areas might receive less money, why: "since wealthier areas may lose resources"}
        - {t: it has never been tried before, why: "ไม่มีข้อมูลนี้ในบท"}
        - {t: it is slower than online learning, why: "บทเทียบความเร็วกับแนวทางที่สอง ไม่ใช่เหตุผลที่ถกเถียง"}
        - {t: teachers oppose it, why: "บทไม่ได้พูดว่าครูคัดค้าน"}
    - stem: What does the writer suggest about online learning?
      choices:
        - {t: it may help least those who need help most, why: "nowhere near as effective for younger pupils ... the group that needs help most"}
        - {t: it should replace all rural schools, why: "ไม่มีข้อเสนอนี้"}
        - {t: it is more expensive than extra funding, why: "บทบอกว่าดูเหมือนถูกกว่า"}
        - {t: it works best for young children, why: "ตรงข้ามกับที่บทบอก"}
    - stem: What can be inferred about how the writer would judge future success?
      choices:
        - {t: by improvements in what pupils can actually do, why: "progress will be measured ... in skills gained"}
        - {t: by the number of new schools built, why: "ผู้เขียนบอกว่าไม่ได้วัดจากจำนวนอาคาร"}
        - {t: by attendance rates alone, why: "ผู้เขียนบอกว่าการเข้าเรียนไม่เท่ากับการเรียนรู้"}
        - {t: by how cheap the policy is, why: "บทไม่ได้ใช้ราคาเป็นเกณฑ์หลัก"}
  status: approved
