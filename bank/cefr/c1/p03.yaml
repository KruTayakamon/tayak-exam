- id: cefr-c1-w03-058
  kind: read
  skill: rd
  topic: leadership
  level: 2
  pool: true
  title: "What Makes a Good Team Leader?"
  passage: |
    It is not technical skill that most employees value in a leader. According to a study of 2,000 workers in Southeast Asia, what people want most is a manager who listens and explains decisions.

    Leaders who empowered their teams to choose how to complete tasks had lower staff turnover. Interestingly, these teams did not work fewer hours, but they reported feeling more in control of their time. The study suggests that trust, rather than freedom alone, underpins this effect.

    The researchers also found that praise mattered less than expected. What employees valued was specific feedback: knowing exactly what had gone well and what to improve. General comments such as "good job" were often forgotten within a day.
  questions:
    - stem: "What do employees value most in a leader?"
      choices:
        - {t: "listening and explaining decisions", why: "what people want most is a manager who listens and explains decisions"}
        - {t: "technical expertise", why: "บทบอกว่าไม่ใช่ทักษะทางเทคนิค"}
        - {t: "frequent praise", why: "คำชมสำคัญน้อยกว่าที่คาด"}
        - {t: "shorter working hours", why: "ทีมไม่ได้ทำงานน้อยลง"}
    - stem: "What happened in teams with more freedom?"
      choices:
        - {t: "fewer people left their jobs", why: "had lower staff turnover"}
        - {t: "they worked fewer hours", why: "ทีมไม่ได้ทำงานน้อยลง"}
        - {t: "they made more mistakes", why: "ในบทไม่ได้พูดถึงความผิดพลาด"}
        - {t: "leaders praised them more", why: "ในบทไม่ได้พูดถึงเรื่องนี้"}
    - stem: "What kind of feedback did employees find useful?"
      choices:
        - {t: "detailed comments on what to improve", why: "specific feedback: knowing exactly what had gone well and what to improve"}
        - {t: "short general praise", why: "ลืมภายในหนึ่งวัน"}
        - {t: "feedback once a year", why: "ในบทไม่ได้พูดถึงความถี่"}
        - {t: "feedback from customers", why: "ในบทไม่ได้พูดถึงลูกค้า"}
  status: approved
