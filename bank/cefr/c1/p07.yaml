- id: cefr-c1-w07-058
  kind: read
  skill: rd
  topic: analytical-article
  level: 2
  pool: true
  title: "The Rise and Limits of the Gig Economy"
  passage: |
    Over the past decade, app-based work, from food delivery to freelance design, has become ubiquitous in Thai cities. Supporters point to its flexibility: workers can choose when and how much to work. For students and parents with young children, this is a genuine advantage.

    However, the flexibility comes at a cost. Most gig workers have no paid leave, no health insurance from their employer, and no guaranteed income. A rainy week or a change in the app's pay rates can halve their earnings. This risk is not incidental; it is inherent in a model that treats workers as independent contractors.

    The overarching question, then, is not whether the gig economy should exist, but how its benefits can be preserved while its risks are shared more fairly. Some countries now require platforms to contribute to accident insurance, a modest but meaningful first step.
  questions:
    - stem: "Who benefits most from the flexibility, according to the article?"
      choices:
        - {t: "students and parents with young children", why: "For students and parents with young children, this is a genuine advantage"}
        - {t: "full-time office workers", why: "ในบทไม่ได้พูดถึงพนักงานประจำ"}
        - {t: "app companies only", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "older workers", why: "ในบทไม่ได้พูดถึงผู้สูงวัย"}
    - stem: "What does \"inherent\" suggest about the risk?"
      choices:
        - {t: "it is built into the model itself", why: "it is inherent in a model that treats workers as independent contractors"}
        - {t: "it happens only by accident", why: "บทบอกว่าไม่ใช่เรื่องบังเอิญ"}
        - {t: "it affects only some apps", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "it can easily be removed", why: "ในบทไม่ได้พูดเช่นนั้น (it can easily be removed)"}
    - stem: "What does the writer think the main question is?"
      choices:
        - {t: "how to keep benefits while sharing risks fairly", why: "how its benefits can be preserved while its risks are shared more fairly"}
        - {t: "whether to ban the gig economy", why: "บทบอกว่าไม่ใช่คำถามหลัก"}
        - {t: "which app pays the most", why: "ในบทไม่ได้พูดถึง"}
        - {t: "why it is raining more often", why: "ในบทไม่ได้พูดถึง (why it is raining more often)"}
  status: approved
