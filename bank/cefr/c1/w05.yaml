# ---------- วันที่ 4 · อ่านบทวิจารณ์หนังสือและฟังบรรยาย ----------
- id: cefr-c1-w05-035
  kind: read
  skill: rd
  topic: book-review
  level: 2
  title: "Review · The Art of Saying Less (fictional)"
  passage: |
    In The Art of Saying Less, communication researcher Dr Anong Siri sets out to answer a deceptively simple question: why do intelligent people so often write badly at work? Her answer, developed over twelve chapters, is that most professionals confuse length with effort. Having been taught at school that longer answers earn higher marks, they carry the habit into reports and emails, where it does far more harm than good.

    The book's strongest section deals with what Siri calls "defensive writing": adding unnecessary detail in order to appear thorough or to avoid blame. Drawing on interviews with more than eighty managers, she shows how such writing hides the one sentence the reader actually needs. Her examples, taken from real (though anonymised) documents, are painfully familiar.

    Less convincing is the final third of the book, in which Siri offers a set of rules for clearer writing. Some are useful, such as stating the main request in the first two lines. Others, however, feel rudimentary for a book aimed at experienced professionals. Readers who have attended even one writing workshop will have heard most of them before.

    Nevertheless, this is a pertinent and often witty book. Its central argument is cogent, its research is careful, and, fittingly, it is short. Managers who want their teams to write more succinctly could do worse than give everyone a copy, though they might find, uncomfortably, that the first person who needs it is themselves.
  questions:
    - stem: What is the reviewer's overall opinion of the book?
      choices:
        - {t: worthwhile despite a weaker final section, why: "ชมเหตุผลหลักและงานวิจัย แต่ส่วนท้ายไม่ค่อยน่าเชื่อ"}
        - {t: too long and poorly researched, why: "ผู้วิจารณ์บอกว่าหนังสือสั้นและวิจัยอย่างรอบคอบ"}
        - {t: useful only for students, why: "ผู้วิจารณ์แนะนำให้ผู้จัดการแจกทีม"}
        - {t: completely original in every chapter, why: "ผู้วิจารณ์บอกว่ากฎหลายข้อเคยได้ยินมาแล้ว"}
    - stem: According to Siri, why do professionals write long documents?
      choices:
        - {t: they learned at school to link length with quality, why: "taught at school that longer answers earn higher marks"}
        - {t: their managers demand more detail, why: "บทไม่ได้บอกว่าผู้จัดการสั่ง"}
        - {t: they do not have time to edit, why: "ไม่มีข้อมูลเรื่องเวลา"}
        - {t: their English is not strong enough, why: "บทไม่ได้พูดเรื่องความสามารถทางภาษา"}
    - stem: What is "defensive writing"?
      choices:
        - {t: adding detail to look careful or avoid criticism, why: "adding unnecessary detail in order to appear thorough or to avoid blame"}
        - {t: writing that attacks other people, why: "บทไม่ได้พูดถึงการโจมตีคนอื่น"}
        - {t: refusing to answer emails, why: "บทไม่ได้พูดถึงการไม่ตอบอีเมล"}
        - {t: using very formal vocabulary, why: "บทไม่ได้นิยามแบบนี้"}
    - stem: What does the reviewer suggest in the final sentence?
      choices:
        - {t: some managers may be guilty of the same problem, why: "the first person who needs it is themselves"}
        - {t: managers should not read the book, why: "ผู้วิจารณ์แนะนำให้แจกหนังสือ"}
        - {t: the book is too expensive for teams, why: "ไม่มีการพูดถึงราคา"}
        - {t: staff write better than their managers, why: "บทไม่ได้เปรียบเทียบตรง ๆ แบบนี้"}
  status: approved
