# ---------- การอ่าน 2 บท ----------
- id: cefr-c1-cpb-026
  kind: read
  skill: rd
  topic: book-review
  level: 1
  title: "Review · Slow Money (fictional)"
  passage: |
    In Slow Money, financial journalist Prapai Wong argues that most people approach saving in exactly the wrong way. We wait until we have money left over at the end of the month, she says, and then wonder why there is never anything left. Her solution is simple: save first, spend second.

    The strongest chapters are those based on interviews with ordinary families. A street-food seller in Chiang Mai describes putting aside twenty baht every morning before opening her stall; a young teacher explains how a separate bank account, which she deliberately made difficult to access, stopped her from spending her savings on impulse. These stories are told with warmth and humour, and they make a convincing case that small, regular habits matter more than large, occasional efforts.

    Less successful is the chapter on investment. Wong covers shares, property and gold in barely twenty pages, which is far too little for such a complex topic. Readers hoping for practical guidance will find the advice rudimentary at best.

    Nevertheless, this is a useful and readable book. It is not a complete guide to personal finance, and it does not claim to be. What it offers instead is a clear and memorable principle, supported by real examples. For readers who have never managed to save, that may be exactly what they need.
  questions:
    - stem: What is the reviewer's overall view of the book?
      choices:
