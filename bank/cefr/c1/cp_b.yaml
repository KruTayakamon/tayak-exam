- id: cefr-c1-cpb-027
  kind: read
  skill: rd
  topic: opinion-column
  level: 2
  title: "Column · The Tyranny of the Five-Star Review"
  passage: |
    I recently stayed in a guesthouse that was, by any reasonable measure, perfectly fine. The room was clean, the breakfast was adequate and the owner was polite. When I left, she asked me, rather anxiously, whether I would give her five stars. Four, she explained, would "damage the business".

    This is where online ratings have brought us. A system designed to help travellers make informed choices has become, in practice, a system in which anything less than perfection is treated as failure. Much as I sympathise with small business owners, this inflation makes ratings almost meaningless. When nearly every hotel scores 4.8, the number tells us very little.

    The consequences are not trivial. Owners feel pressure to offer extras they cannot afford, or to ask guests for reviews in ways that border on begging. Some, inevitably, are tempted to buy fake ones. Meanwhile, honest reviewers who give a fair three stars find themselves accused of being unkind.

    There is no easy fix. Platforms could show the full distribution of ratings rather than a single average, or ask reviewers to answer specific questions about cleanliness or location. But the deeper problem is cultural. It is high time we accepted that "fine" is a perfectly respectable thing for a guesthouse to be. I gave the owner four stars, with a warm comment. I suspect she would rather I hadn't.
  questions:
    - stem: What is the writer's main argument?
      choices:
        - {t: inflated ratings have made online reviews less useful, why: "this inflation makes ratings almost meaningless"}
        - {t: guesthouses should offer more extras, why: "ผู้เขียนบอกว่าแรงกดดันนี้เป็นปัญหา"}
        - {t: all online reviews are fake, why: "ผู้เขียนพูดถึงรีวิวปลอมเป็นผลกระทบอย่างหนึ่ง ไม่ได้บอกว่าทั้งหมดปลอม"}
        - {t: travellers should stop using the internet, why: "ไม่มีข้อเสนอนี้"}
    - stem: Why was the guesthouse owner anxious?
      choices:
        - {t: she believed anything below five stars would hurt her business, why: "Four, she explained, would damage the business"}
        - {t: the room was dirty, why: "ห้องสะอาด จึงใช้ไม่ได้"}
        - {t: the writer had complained about breakfast, why: "ผู้เขียนไม่ได้ร้องเรียน"}
        - {t: she wanted the writer to pay more, why: "ไม่มีข้อมูลเรื่องเงิน"}
    - stem: Which solution does the writer mention?
      choices:
        - {t: showing how all the ratings are spread, why: "show the full distribution of ratings rather than a single average"}
        - {t: banning reviews completely, why: "ไม่มีข้อเสนอนี้"}
        - {t: allowing only five-star reviews, why: "ตรงข้ามกับแนวคิดของผู้เขียน"}
        - {t: paying reviewers for honest comments, why: "ผู้เขียนไม่ได้พูดถึงการจ่ายเงินผู้รีวิว"}
    - stem: What is the tone of the final sentence, "I suspect she would rather I hadn't"?
      choices:
        - {t: wryly humorous, why: "ประชดตัวเองเบา ๆ ว่าเจ้าของคงไม่ชอบสี่ดาว"}
        - {t: angry, why: "ผู้เขียนให้คอมเมนต์อบอุ่น ไม่ได้โกรธ"}
        - {t: deeply sad, why: "น้ำเสียงขำขัน ไม่ใช่เศร้า"}
        - {t: completely neutral, why: "เป็นการแสดงทัศนะแบบขำ ไม่ใช่เป็นกลาง"}
