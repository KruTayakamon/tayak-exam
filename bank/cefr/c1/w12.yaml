# ---------- วันที่ 4 · อ่านบทความยาวและฟังปนกัน ----------
- id: cefr-c1-w12-035
  kind: read
  skill: rd
  topic: long-analytical
  level: 2
  title: "The Hidden Cost of Convenience"
  passage: |
    Few inventions have changed daily life as quickly as food delivery apps. In many Asian cities, a meal can now arrive within thirty minutes of a few taps on a phone. For busy workers, the appeal is obvious. Yet the speed and ease that make these services so attractive also carry costs that are rarely visible to the customer.

    The most obvious is waste. A single delivered meal often comes with several plastic containers, a bag and cutlery, much of which is used once and thrown away. Some platforms now ask customers whether they want cutlery, a small change that, according to one company, reduced plastic use by a third. Such measures are welcome, albeit modest compared with the scale of the problem.

    Less visible are the effects on workers. Delivery riders are usually classified as independent contractors rather than employees, an arrangement whereby companies avoid paying for health insurance or sick leave. Riders earn more the faster they deliver, which creates a strong incentive to take risks on crowded roads. The repercussions of this system fall almost entirely on the riders themselves.

    Finally, there are effects on neighbourhoods. Restaurants pay commission of up to thirty per cent on each order, and some small businesses report that they now earn less despite selling more. Much as customers enjoy the choice, the long-term risk is a city with fewer independent restaurants and a handful of dominant platforms.

    None of this means that delivery apps should be abandoned. What it does suggest is that their true cost should be shared more fairly, between companies, customers and the governments that regulate them, rather than borne by riders, small restaurants and the environment.
  questions:
    - stem: What is the writer's main argument?
      choices:
        - {t: the costs of delivery apps are unfairly distributed and should be shared, why: "their true cost should be shared more fairly"}
        - {t: delivery apps should be banned, why: "บทบอกว่า None of this means ... should be abandoned"}
        - {t: delivery apps have no real benefits, why: "บทยอมรับว่ามีข้อดีชัดเจนสำหรับคนทำงาน"}
        - {t: restaurants earn more because of the apps, why: "ร้านเล็กบางร้านบอกว่าได้น้อยลง"}
    - stem: How does the writer view the "no cutlery" option?
      choices:
        - {t: positive but limited in impact, why: "Such measures are welcome, albeit modest"}
        - {t: completely useless, why: "ผู้เขียนบอกว่ายินดี welcome"}
        - {t: the solution to the waste problem, why: "ผู้เขียนบอกว่าเล็กเมื่อเทียบกับขนาดปัญหา"}
        - {t: too expensive for companies, why: "ไม่มีข้อมูลเรื่องค่าใช้จ่ายนี้"}
    - stem: Why do riders take risks, according to the article?
      choices:
        - {t: their pay depends on how quickly they deliver, why: "Riders earn more the faster they deliver ... incentive to take risks"}
        - {t: they have health insurance, why: "บทบอกว่าบริษัทไม่จ่ายประกันสุขภาพ"}
        - {t: customers complain about slow food, why: "ไม่ได้พูดถึงการร้องเรียนของลูกค้า"}
        - {t: the roads are empty, why: "บทบอกว่าถนนแออัด"}
    - stem: What can be inferred about the writer's view of the future?
      choices:
        - {t: without change, a few platforms may dominate the city's food, why: "a city with fewer independent restaurants and a handful of dominant platforms"}
        - {t: independent restaurants will grow quickly, why: "ตรงข้ามกับความเสี่ยงที่ผู้เขียนกังวล"}
        - {t: delivery apps will disappear, why: "ไม่มีข้อมูลที่สนับสนุน"}
        - {t: riders will soon become employees, why: "ผู้เขียนไม่ได้คาดการณ์เรื่องนี้"}
  status: draft
