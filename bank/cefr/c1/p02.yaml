- id: cefr-c1-w02-058
  kind: read
  skill: rd
  topic: editorial
  level: 2
  pool: true
  title: "Editorial: The Water Crisis Is Not Coming. It Is Here."
  passage: |
    For years, experts have warned that the province's water supply would one day run short. That day has arrived. Reservoir levels are at their lowest in two decades, and three districts now receive tap water only every other day.

    Rarely has a problem been so predictable. Farmers have been pumping more groundwater each year, while new housing estates have been approved without any plan for water supply. Leaks in old pipes waste an estimated 30 per cent of treated water.

    The provincial authority's response, a campaign asking residents to take shorter showers, is welcome but far from sufficient. Were the authority to repair the pipe network, it would save more water than any campaign. Such repairs are expensive, but the cost of doing nothing will be far greater.
  questions:
    - stem: "According to the editorial, what is the current situation?"
      choices:
        - {t: "some areas get water only on alternate days", why: "three districts now receive tap water only every other day"}
        - {t: "the reservoirs are full", why: "ระดับน้ำต่ำสุดในยี่สิบปี"}
        - {t: "the crisis is expected next year", why: "บทบอกว่าวิกฤตเกิดแล้ว"}
        - {t: "farmers have stopped using groundwater", why: "ชาวนาสูบน้ำบาดาลมากขึ้นทุกปี"}
    - stem: "What does \"Rarely has a problem been so predictable\" suggest?"
      choices:
        - {t: "the crisis could have been foreseen", why: "experts have warned for years"}
        - {t: "the crisis was a surprise", why: "ความหมายกลับกัน"}
        - {t: "the problem is rare in Thailand", why: "ไม่ได้หมายความเช่นนั้น"}
        - {t: "experts were wrong", why: "ผู้เชี่ยวชาญเตือนถูกต้อง"}
    - stem: "What does the writer think the authority should do?"
      choices:
        - {t: "repair the leaking pipes", why: "Were the authority to repair the pipe network"}
        - {t: "ban new housing", why: "ในบทไม่ได้เสนอให้ห้ามสร้างบ้าน"}
        - {t: "stop the shower campaign", why: "บทบอกว่าแคมเปญดีแต่ไม่พอ"}
        - {t: "raise water prices", why: "ในบทไม่ได้พูดถึงราคาน้ำ"}
  status: approved
