- id: cefr-c1-w06-058
  kind: read
  skill: rd
  topic: research-analysis
  level: 2
  pool: true
  title: "A Closer Look at the \"Morning Study\" Claim"
  passage: |
    A popular article recently claimed that people who study in the morning remember 40 per cent more than those who study at night. The claim sounds plausible, but a closer look at the original research suggests caution.

    First, the study involved only 36 university students, all from one faculty. Second, the morning group slept on average one hour longer than the evening group, so sleep, not time of day, may explain the difference. Third, the 40 per cent figure came from a single vocabulary test given the following day.

    None of this means the finding is wrong. It would appear, however, that the article overstated a tentative result. Until larger studies corroborate it, readers should treat the claim as an interesting possibility rather than established fact.
  questions:
    - stem: "What does the writer suggest about the extra sleep?"
      choices:
        - {t: "it may explain the result", why: "sleep, not time of day, may explain the difference"}
        - {t: "it proves the article was right", why: "ความหมายไม่ตรง จึงใช้ไม่ได้"}
        - {t: "it made the test harder", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "it was not measured", why: "มีการวัดและรายงาน"}
    - stem: "How does the writer view the study's finding?"
      choices:
        - {t: "as possible but not yet proven", why: "an interesting possibility rather than established fact"}
        - {t: "as completely false", why: "ผู้เขียนบอกว่าไม่ได้หมายความว่าผิด"}
        - {t: "as definitely correct", why: "ผู้เขียนเตือนให้ระวัง"}
        - {t: "as irrelevant to students", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "What would make the claim more convincing?"
      choices:
        - {t: "bigger studies with similar results", why: "Until larger studies corroborate it"}
        - {t: "making the article itself longer", why: "ในบทไม่ได้พูดถึง"}
        - {t: "fewer participants", why: "ความหมายกลับกัน"}
        - {t: "studying only at night", why: "ในบทไม่ได้พูดถึง (studying only at night)"}
  status: approved
