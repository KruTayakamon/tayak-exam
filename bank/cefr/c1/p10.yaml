- id: cefr-c1-w10-058
  kind: read
  skill: rd
  topic: educational-equity
  level: 2
  pool: true
  title: "Small Schools, Big Questions"
  passage: |
    Thailand has thousands of small rural schools, many with fewer than 120 students. Merging them into larger schools is often presented as an obvious solution: fewer buildings, more specialist teachers and better facilities.

    Yet the policy remains contentious. For families in remote areas, a merged school may be an hour away. Longer journeys can be detrimental to attendance, particularly for younger children and girls whose parents worry about safety. Small schools also often serve as community centres, and their closure can have effects that are less tangible but no less real.

    Some provinces are testing a middle path: keeping small schools open while sharing specialist teachers online and through rotating visits. Early results suggest this model is feasible, although it depends heavily on reliable internet access, which is far from universal.
  questions:
    - stem: "Why is merging schools often seen as attractive?"
      choices:
        - {t: "it brings more resources together", why: "fewer buildings, more specialist teachers and better facilities"}
        - {t: "it shortens journeys", why: "ความหมายกลับกัน"}
        - {t: "parents prefer it", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "it is required by law", why: "ในบทไม่ได้พูดถึงกฎหมาย"}
    - stem: "What concern about merging is mentioned?"
      choices:
        - {t: "lower attendance due to travel", why: "Longer journeys can be detrimental to attendance"}
        - {t: "too many teachers", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "buildings being too large", why: "ในบทไม่ได้พูดเช่นนั้น (buildings being too large)"}
        - {t: "higher internet costs", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What limits the \"middle path\" model?"
      choices:
        - {t: "unreliable internet in some areas", why: "depends heavily on reliable internet access, which is far from universal"}
        - {t: "a lack of buildings", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "parents' opposition to teachers", why: "ในบทไม่ได้พูดถึง"}
        - {t: "its high cost", why: "ในบทไม่ได้พูดถึงค่าใช้จ่าย"}
  status: approved
