# ---------- วันที่ 4 · อ่านคอลัมน์และฟังบทสนทนาที่มีนัย ----------
- id: cefr-c1-w09-035
  kind: read
  skill: rd
  topic: opinion-column
  level: 2
  title: "Column · In Praise of the Meeting That Could Have Been an Email"
  passage: |
    Last Tuesday I attended what was, by any measure, a remarkable meeting. Fourteen people gathered for ninety minutes to agree that we should "revisit the issue next quarter". Nobody mentioned what the issue was. I suspect nobody knew.

    I don't wish to sound cynical. Meetings, after all, have their uses. They give managers a chance to feel productive, and they give the rest of us a chance to practise looking interested. In some organisations, a full calendar is treated as proof of hard work, as if the number of hours spent talking about a task were somehow connected to whether it gets done.

    The cost is not small. If each of those fourteen people earns, say, 40,000 baht a month, last Tuesday's conversation cost the company several thousand baht, and that is before we count the time spent preparing slides nobody read. Multiply that by the dozens of meetings held every week, and the figure becomes, to put it mildly, uncomfortable.

    There is a simple alternative. Before calling a meeting, write down the decision you need. If you cannot, you are not ready to meet. If you can, ask whether an email would do. Most of the time, it would. It is high time we treated people's time with the same care we give to their salaries. Until then, I shall continue to attend, smile and take notes, although I'd rather you didn't ask me what they say.
  questions:
    - stem: What is the writer's main point?
      choices:
        - {t: many meetings waste time and money and should be replaced, why: "ทั้งบทวิจารณ์การประชุมที่ไม่จำเป็นและเสนอทางเลือก"}
        - {t: managers work harder than other staff, why: "ผู้เขียนประชดว่าการประชุมทำให้ผู้จัดการรู้สึกว่าทำงาน"}
        - {t: salaries in the company are too high, why: "เงินเดือนใช้คำนวณต้นทุน ไม่ใช่ประเด็นหลัก"}
        - {t: meetings should always last ninety minutes, why: "เก้าสิบนาทีคือตัวอย่างที่ผู้เขียนวิจารณ์"}
    - stem: What is the tone of "they give the rest of us a chance to practise looking interested"?
      choices:
        - {t: ironic, why: "ทำเป็นชมแต่จริง ๆ แล้วประชดว่าการประชุมน่าเบื่อ"}
        - {t: grateful, why: "ผู้เขียนไม่ได้ขอบคุณจริง"}
        - {t: angry and aggressive, why: "น้ำเสียงประชดแบบขำ ไม่ได้ก้าวร้าว"}
        - {t: neutral and factual, why: "เป็นการแสดงทัศนะ ไม่ใช่ข้อเท็จจริงเป็นกลาง"}
    - stem: What does "to put it mildly" suggest about the cost?
      choices:
        - {t: it is much more serious than the word suggests, why: "to put it mildly = พูดเบา ๆ แล้ว ความจริงหนักกว่านั้น"}
        - {t: it is too small to worry about, why: "ตรงข้ามกับความหมาย"}
        - {t: it has been calculated exactly, why: "ผู้เขียนใช้ say 40,000 เป็นตัวอย่างประมาณ"}
        - {t: it is paid by the managers, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: What advice does the writer give before calling a meeting?
      choices:
        - {t: identify the decision that needs to be made, why: "write down the decision you need"}
        - {t: prepare detailed slides, why: "ผู้เขียนประชดว่าไม่มีใครอ่านสไลด์"}
        - {t: invite as many people as possible, why: "ขัดกับแนวคิดของผู้เขียน"}
        - {t: schedule it for next quarter, why: "next quarter เป็นข้อสรุปที่ผู้เขียนเยาะ"}
