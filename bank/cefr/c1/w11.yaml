# ---------- วันที่ 4 · อ่านบทความและฟังบรรยายที่ต้องจดประเด็น ----------
- id: cefr-c1-w11-035
  kind: read
  skill: rd
  topic: lifelong-learning
  level: 2
  title: "Never Too Late: Learning After Fifty"
  passage: |
    For most of the twentieth century, education was something that happened early in life. You went to school, perhaps to university, and then you worked. Learning after that was optional, and often regarded as a hobby. Today, that model looks increasingly outdated.

    Longer working lives and rapid technological change mean that many people will need to retrain at least once, and possibly several times, before they retire. Yet older adults are often reluctant to return to formal education. Some fear they will be slower than younger classmates; others believe, wrongly, that the ability to learn declines sharply with age.

    Research paints a more encouraging picture. While older learners may take slightly longer to memorise new information, they are often more adept at connecting it to what they already know. Their experience makes them insightful in discussions, and their motivation tends to be strong: unlike many younger students, they have usually chosen to be there. Studies of adult learning programmes have also found that the most successful participants are not necessarily the most proficient at the start, but the most resilient, those who keep going after a disappointing test or a difficult week.

    None of this means that adult education is easy to provide. Courses must be flexible enough to fit around work and family, and teachers must be prepared for learners who will question rather than simply accept. But the benefits are substantial, not only for individuals but for societies facing rapid change. The question is no longer whether adults can learn, but whether we are willing to make it possible for them to do so.
  questions:
    - stem: What is the main message of the article?
      choices:
        - {t: older adults can learn well and should be supported to do so, why: "บทชี้ว่าผลวิจัยให้กำลังใจและถามว่าเราพร้อมสนับสนุนไหม"}
        - {t: education should end after university, why: "บทบอกว่าแบบนั้นล้าสมัยแล้ว"}
        - {t: older people learn faster than younger people, why: "บทบอกว่าผู้สูงวัยอาจจำช้ากว่าเล็กน้อย"}
        - {t: adult courses are cheap and easy to run, why: "บทบอกว่าไม่ง่ายที่จะจัด"}
    - stem: Why are some older adults reluctant to study, according to the article?
      choices:
        - {t: they worry about being slower or believe they can't learn, why: "fear they will be slower ... believe ... the ability to learn declines"}
        - {t: courses are too expensive, why: "ไม่ได้พูดถึงค่าเรียน"}
        - {t: their families don't allow it, why: "บทไม่ได้พูดถึงครอบครัวในแง่นี้"}
        - {t: they already know everything, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: Which learners were most successful in adult programmes?
      choices:
        - {t: those who persisted after setbacks, why: "the most resilient, those who keep going after a disappointing test"}
        - {t: those with the highest starting level, why: "บทบอกว่าไม่จำเป็นต้องเก่งที่สุดตอนเริ่ม"}
        - {t: the youngest participants, why: "ไม่มีข้อมูลที่สนับสนุน"}
        - {t: those who studied full-time, why: "ไม่ได้พูดถึงการเรียนเต็มเวลา"}
    - stem: What does the writer imply in the final sentence?
      choices:
        - {t: the main obstacle is society's willingness, not adults' ability, why: "The question is no longer whether adults can learn, but whether we are willing"}
        - {t: adults are unable to learn after fifty, why: "ตรงข้ามกับที่บทบอก"}
        - {t: governments have already solved the problem, why: "ไม่มีข้อมูลที่สนับสนุน"}
        - {t: teachers should refuse to teach older learners, why: "ไม่มีข้อเสนอนี้"}
  status: draft
