# ---------- วันที่ 4 · อ่านบทวิเคราะห์งานวิจัยและฟังสัมมนา ----------
- id: cefr-c1-w06-035
  kind: read
  skill: rd
  topic: research-analysis
  level: 2
  title: "Does Green Space Make Us Happier?"
  passage: |
    A widely shared study published last year appeared to show that people who live near parks are significantly happier than those who do not. Newspapers quickly ran headlines claiming that "parks make you happy". On closer inspection, however, the link is rather more tenuous than those headlines suggested.

    The researchers surveyed around 3,000 adults in four cities and asked them to rate their happiness on a scale from one to ten. Those living within 500 metres of a park scored, on average, 0.4 points higher. The difference is statistically real, but it is small, and the study cannot tell us why it exists.

    One plausible explanation is that green space reduces stress. Yet there are others. Homes near parks tend to be more expensive, so their residents are, on average, wealthier, and income is itself strongly linked to wellbeing. The authors did attempt to control for income, but they relied on a single question about monthly salary, which arguably fails to capture savings, debts or family support.

    None of this means the study is worthless. Its findings are broadly corroborated by smaller studies in Europe, and the idea that nature benefits mental health is credible. What we should be sceptical about is the leap from correlation to cause. Were a city to build a new park tomorrow, we simply do not know how much happier its neighbours would become. Supposing they became only slightly happier, the park might still be worth building for other reasons, such as cleaner air. But it would be unwise to promise residents more than the evidence can deliver.
  questions:
    - stem: What is the writer's main point?
      choices:
        - {t: the study shows a link but not that parks cause happiness, why: "ผู้เขียนเตือนเรื่องการกระโดดจากความสัมพันธ์ไปเป็นเหตุผล"}
        - {t: the study is worthless and should be ignored, why: "ผู้เขียนบอกชัดว่า None of this means the study is worthless"}
        - {t: parks have no effect on people's wellbeing, why: "ผู้เขียนบอกว่าแนวคิดนี้น่าเชื่อ credible"}
        - {t: cities should stop building parks, why: "ผู้เขียนบอกว่าสวนอาจยังคุ้มค่าด้วยเหตุผลอื่น"}
    - stem: Why might wealth explain the results?
      choices:
        - {t: richer people often live near parks and income affects happiness, why: "Homes near parks tend to be more expensive ... income is itself strongly linked to wellbeing"}
        - {t: parks charge high entrance fees, why: "ไม่มีข้อมูลเรื่องค่าเข้าสวน"}
        - {t: wealthy people answered more questions, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: the researchers were paid by developers, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: What weakness does the writer see in how income was measured?
      choices:
        - {t: one salary question may miss other financial factors, why: "relied on a single question about monthly salary, which arguably fails to capture savings, debts or family support"}
        - {t: income was not measured at all, why: "ผู้วิจัยพยายามควบคุมรายได้แล้ว"}
        - {t: the salary data was invented, why: "ไม่มีข้อกล่าวหานี้ในบท"}
        - {t: only rich people were asked about income, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: What does the writer imply about promising residents happiness from a new park?
      choices:
        - {t: it would go beyond what the research supports, why: "it would be unwise to promise residents more than the evidence can deliver"}
        - {t: it is a good way to win votes, why: "ไม่ได้พูดถึงการเลือกตั้ง"}
        - {t: it is certain to come true, why: "ผู้เขียนบอกว่าเราไม่รู้ว่าจะมีความสุขขึ้นแค่ไหน"}
        - {t: it should only be done in four cities, why: "สี่เมืองคือที่ทำวิจัย ไม่ใช่ข้อเสนอ"}
  status: approved
