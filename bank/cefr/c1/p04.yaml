- id: cefr-c1-w04-058
  kind: read
  skill: rd
  topic: formal-regulation
  level: 2
  pool: true
  title: "Notice: Use of Personal Devices (Fictional Agency)"
  passage: |
    With effect from 1 March, the following conditions apply to the use of personal devices at all branch offices.

    Staff may connect personal laptops to the guest network only. Connection to the internal network is prohibited unless written approval has been obtained from the IT department. Any device found to be connected without approval will be disconnected and the matter recorded.

    The onus is on each employee to ensure that their device has up-to-date security software. Notwithstanding the above, branch managers may, at their discretion, permit temporary access in an emergency, provided that the IT department is informed within 24 hours.
  questions:
    - stem: "Which network can staff use with their own laptops?"
      choices:
        - {t: "the guest network", why: "connect personal laptops to the guest network only"}
        - {t: "the internal network", why: "ห้ามเว้นแต่ได้รับอนุมัติ"}
        - {t: "any network after 1 March", why: "มีข้อจำกัดตามประกาศ"}
        - {t: "none at all", why: "ใช้เครือข่ายผู้มาเยือนได้"}
    - stem: "Who is responsible for security software on personal devices?"
      choices:
        - {t: "the individual employee", why: "The onus is on each employee"}
        - {t: "the IT department", why: "ไอทีเป็นผู้อนุมัติ ไม่ได้รับผิดชอบซอฟต์แวร์ส่วนตัว"}
        - {t: "the branch manager", why: "ผู้จัดการอนุญาตกรณีฉุกเฉินเท่านั้น"}
        - {t: "the security guard", why: "ในบทไม่ได้พูดถึงเจ้าหน้าที่รักษาความปลอดภัย"}
    - stem: "What must happen if a manager allows emergency access?"
      choices:
        - {t: "IT must be told within a day", why: "provided that the IT department is informed within 24 hours"}
        - {t: "the device must be disconnected", why: "เป็นกรณีที่ไม่ได้รับอนุมัติ"}
        - {t: "the employee must pay a fine", why: "ในบทไม่ได้พูดถึงค่าปรับ"}
        - {t: "approval must be written first", why: "กรณีฉุกเฉินแจ้งภายหลังได้"}
  status: approved
