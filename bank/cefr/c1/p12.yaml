- id: cefr-c1-w12-058
  kind: read
  skill: rd
  topic: long-analytical
  level: 2
  pool: true
  title: "The Hidden Costs of Cheap Fashion"
  passage: |
    Clothes have never been cheaper. A T-shirt that cost 300 baht a decade ago can now be bought online for less than 100. For consumers on tight budgets, this is a tangible benefit, and critics who simply tell people to "buy less" often ignore this reality.

    Yet low prices conceal costs that are paid elsewhere. Garment workers in some countries earn wages that barely cover rent and food. Synthetic fabrics release tiny plastic fibres when washed, and much of the clothing discarded each year ends up in landfill or is burned.

    There is no simple solution. Banning cheap clothing would hurt low-income families most. However, a plethora of smaller measures, such as repair services, clothing swaps, clearer labelling and minimum wage agreements across supply chains, could together reduce the damage. The impetus for change, the writer argues, must come from companies and governments, not only from individual shoppers.
  questions:
    - stem: "What does the writer say about critics who say \"buy less\"?"
      choices:
        - {t: "they overlook real budget pressures", why: "critics ... often ignore this reality"}
        - {t: "they are completely right", why: "ผู้เขียนบอกว่ามองข้ามความจริง"}
        - {t: "they work in fashion", why: "ในบทไม่ได้พูดถึง"}
        - {t: "they want higher wages", why: "ในบทไม่ได้พูดถึง (they want higher wages)"}
    - stem: "Why does the writer oppose banning cheap clothing?"
      choices:
        - {t: "it would hurt poorer families most", why: "Banning cheap clothing would hurt low-income families most"}
        - {t: "it is impossible to enforce", why: "ในบทไม่ได้พูดถึง"}
        - {t: "it would raise workers' wages", why: "ในบทไม่ได้พูดถึง (it would raise workers' wages)"}
        - {t: "companies would refuse", why: "ในบทไม่ได้พูดถึง (companies would refuse)"}
    - stem: "Who does the writer think should lead change?"
      choices:
        - {t: "businesses and governments", why: "must come from companies and governments"}
        - {t: "individual shoppers alone", why: "ผู้เขียนบอกว่าไม่ใช่เฉพาะผู้ซื้อ"}
        - {t: "garment workers", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "schools", why: "ในบทไม่ได้พูดถึงโรงเรียน"}
  status: approved
