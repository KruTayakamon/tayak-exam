- id: cefr-c1-w09-058
  kind: read
  skill: rd
  topic: opinion-column
  level: 2
  pool: true
  title: "Column: Stop Telling Me to \"Just Relax\""
  passage: |
    Every January, I am told that the secret to a better life is to relax more. Magazines suggest yoga, candles and "digital detox" weekends. All very nice, I'm sure, if you have the time and money.

    But for many working parents I know, the problem isn't that we don't know how to relax. It's that we have no time to do it. Telling an exhausted nurse on a double shift to "practise mindfulness" is, frankly, a little condescending.

    What would genuinely help? Shorter commutes, affordable childcare and employers who don't send emails at midnight. I am not cynical about wellbeing; I simply think it is about time we stopped treating a social problem as a personal failing.
  questions:
    - stem: "What is the writer's attitude to typical relaxation advice?"
      choices:
        - {t: "it is unrealistic for many people", why: "if you have the time and money"}
        - {t: "it is very useful for everyone", why: "ผู้เขียนไม่เห็นด้วย"}
        - {t: "it is too expensive to print", why: "ในบทไม่ได้พูดถึง"}
        - {t: "it should be compulsory", why: "ในบทไม่ได้พูดถึง (it should be compulsory)"}
    - stem: "Why does the writer mention the nurse?"
      choices:
        - {t: "to show that the advice ignores real pressures", why: "Telling an exhausted nurse ... is ... condescending"}
        - {t: "to praise nurses' mindfulness", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "to suggest nurses need yoga", why: "ความหมายกลับกัน"}
        - {t: "to complain about how hospitals treat their staff", why: "ในบทไม่ได้พูดถึงโรงพยาบาล"}
    - stem: "What does the writer think the real problem is?"
      choices:
        - {t: "social conditions", why: "stopped treating a social problem as a personal failing"}
        - {t: "people's laziness", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "a lack of candles", why: "เป็นการประชด จึงใช้ไม่ได้"}
        - {t: "too much yoga", why: "ในบทไม่ได้พูดเช่นนั้น (too much yoga)"}
  status: approved
