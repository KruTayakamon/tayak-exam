- id: cefr-c1-w05-058
  kind: read
  skill: rd
  topic: book-review
  level: 2
  pool: true
  title: "Book Review: \"Learning Without Walls\" by Dr Siriporn K."
  passage: |
    This short book argues that adults learn best when lessons are connected to their daily work. Drawing on interviews with 80 adult learners, the author shows that those who applied new skills within a week remembered far more than those who did not.

    The book's greatest strength is its brevity. In just 140 pages, Dr Siriporn delineates a clear model and exemplifies each stage with real stories. Teachers and trainers will find the final chapter, which contains ready-made activities, especially pertinent.

    However, the research base is rather narrow. All participants worked in urban offices, so it is unclear whether the findings apply to farmers or factory workers. A wider study would make the argument more cogent.
  questions:
    - stem: "What is the book's main argument?"
      choices:
        - {t: "adults learn best by applying skills at work", why: "adults learn best when lessons are connected to their daily work"}
        - {t: "adults should study in classrooms", why: "ความหมายไม่ตรงกับบท"}
        - {t: "short books are easier to read", why: "เป็นจุดแข็ง ไม่ใช่ข้อโต้แย้งหลัก"}
        - {t: "interviews are the best research method", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "What does the reviewer praise?"
      choices:
        - {t: "its short, clear presentation", why: "The book's greatest strength is its brevity"}
        - {t: "its large number of participants", why: "ผู้วิจารณ์บอกว่าฐานข้อมูลแคบ"}
        - {t: "its focus on farmers", why: "ไม่มีชาวนาในการศึกษา"}
        - {t: "its long final chapter", why: "ในบทไม่ได้พูดถึงความยาว"}
    - stem: "What is the reviewer's main criticism?"
      choices:
        - {t: "the participants were all from similar jobs", why: "All participants worked in urban offices"}
        - {t: "the book is too long", why: "ผู้วิจารณ์ชมความกระชับ"}
        - {t: "the stories are not real", why: "เรื่องเล่าเป็นเรื่องจริง"}
        - {t: "the activities are difficult", why: "ในบทไม่ได้พูดว่ายาก"}
  status: approved
