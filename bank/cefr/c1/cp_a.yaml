- id: cefr-c1-cpa-027
  kind: read
  skill: rd
  topic: policy-report
  level: 2
  title: "Policy Note · Free Bus Travel for Older Residents (fictional)"
  passage: |
    In 2025, the fictional city of Nakhon Rua introduced free bus travel for residents over sixty-five. This note summarises the first year of the scheme and recommends whether it should continue.

    Use of the buses by older residents rose by almost 40 per cent. Survey data suggest that the scheme has had a tangible effect on wellbeing: participants reported visiting friends, markets and health centres more often, and feeling less isolated. Local shop owners near major bus routes also reported a modest increase in weekday trade.

    The scheme is not without problems. Its cost, at roughly 35 million baht a year, has proved considerably higher than forecast, largely because more people used it than expected. Moreover, the benefits have been unevenly distributed. Residents in outer districts, where buses run only twice an hour, have gained far less than those in the city centre. Insofar as the aim was to reduce isolation, the scheme has arguably helped least those who were most isolated to begin with.

    We therefore recommend that the scheme continue, albeit with two changes. First, a portion of the budget should be used to increase the frequency of services in outer districts. Second, the city should explore partnerships with local businesses, whereby shops on bus routes contribute a small amount in exchange for advertising space. Were these changes to be adopted, the scheme would be both fairer and more financially sustainable.
  questions:
    - stem: What is the overall recommendation of the note?
      choices:
        - {t: continue the scheme with some adjustments, why: "recommend that the scheme continue, albeit with two changes"}
        - {t: end the scheme because it is too expensive, why: "บทแนะนำให้ดำเนินต่อ"}
        - {t: extend free travel to all ages, why: "ไม่มีข้อเสนอนี้"}
        - {t: replace buses with taxis, why: "บทไม่ได้พูดถึงแท็กซี่เลย"}
    - stem: Why did the scheme cost more than expected?
      choices:
        - {t: more people used it than predicted, why: "largely because more people used it than expected"}
        - {t: bus fares increased, why: "ไม่มีข้อมูลเรื่องค่าโดยสารเพิ่ม"}
        - {t: new buses had to be bought, why: "ไม่มีข้อมูลเรื่องซื้อรถใหม่"}
        - {t: shop owners demanded payment, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: Why have outer-district residents benefited less?
      choices:
        - {t: buses there are much less frequent, why: "buses run only twice an hour"}
        - {t: they are not allowed to use the scheme, why: "ไม่ได้บอกว่าถูกห้ามใช้"}
        - {t: they prefer to drive, why: "ไม่มีข้อมูลนี้ในบท"}
        - {t: they are younger on average, why: "ไม่มีข้อมูลเรื่องอายุเฉลี่ย"}
    - stem: What does the phrase "has arguably helped least those who were most isolated" suggest?
      choices:
        - {t: the scheme may have missed the people who needed it most, why: "คนที่โดดเดี่ยวที่สุดอยู่รอบนอกที่รถมาน้อย จึงได้ประโยชน์น้อยสุด"}
        - {t: isolated people refused to take part, why: "ไม่ได้บอกว่าปฏิเสธ"}
        - {t: the scheme has helped everyone equally, why: "บทบอกว่าประโยชน์กระจายไม่เท่ากัน"}
        - {t: isolation has increased in the city centre, why: "ไม่มีข้อมูลที่สนับสนุน"}
