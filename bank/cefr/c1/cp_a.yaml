# ---------- การอ่าน 2 บท ----------
- id: cefr-c1-cpa-026
  kind: read
  skill: rd
  topic: workplace-article
  level: 1
  title: "The Myth of Multitasking"
  passage: |
    Many job advertisements still ask for candidates who can "multitask". The assumption is that a worker who answers emails during a meeting, or checks messages while writing a report, is getting more done. Research suggests the opposite.

    When we switch between tasks, our brains need time to refocus. Each switch may take only a fraction of a second, but over a day these small delays add up. In one study, office workers who were interrupted regularly took around a quarter longer to finish a writing task, and made noticeably more mistakes, than colleagues who worked without interruption. Interestingly, the interrupted group believed they had worked faster.

    The problem is not simply lost time. Constant switching appears to make it harder to think deeply. People who habitually do several things at once tend to find it more difficult to ignore irrelevant information, even when they are trying to concentrate on a single task.

    None of this means that people should never answer an email quickly. Some jobs, such as running a busy reception desk, require constant attention to many things. But for work that demands careful thought, such as writing, planning or analysing data, the researchers recommend protecting blocks of uninterrupted time. Several companies that have tried "quiet mornings", when meetings and messages are discouraged, report that staff feel less tired at the end of the day, not more.
  questions:
    - stem: What is the main point of the article?
      choices:
        - {t: switching between tasks often reduces the quality and speed of work, why: "บทแย้งความเชื่อเรื่อง multitask ด้วยผลวิจัย"}
        - {t: companies should stop advertising jobs, why: "ไม่มีข้อเสนอนี้"}
        - {t: receptionists work harder than other staff, why: "พนักงานต้อนรับเป็นตัวอย่างข้อยกเว้น ไม่ใช่ประเด็นหลัก"}
        - {t: emails should never be answered quickly, why: "บทบอกว่า None of this means ... never answer an email quickly"}
    - stem: What surprised researchers about the interrupted workers?
      choices:
        - {t: they thought they had been quicker, why: "the interrupted group believed they had worked faster"}
        - {t: they made fewer mistakes, why: "บทบอกว่าผิดพลาดมากกว่า"}
        - {t: they finished before the others, why: "บทบอกว่าใช้เวลานานกว่าราวหนึ่งในสี่"}
        - {t: they refused to be interrupted, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: According to the article, which job may genuinely require attention to many things?
      choices:
        - {t: working at a busy reception desk, why: "running a busy reception desk, require constant attention"}
        - {t: writing a long report, why: "การเขียนเป็นงานที่ต้องการเวลาไม่ถูกขัดจังหวะ"}
        - {t: analysing data, why: "การวิเคราะห์ข้อมูลเป็นงานที่ต้องคิดลึก"}
        - {t: planning a project, why: "การวางแผนเป็นงานที่ต้องคิดลึก"}
    - stem: What can be inferred about the companies that tried "quiet mornings"?
      choices:
        - {t: the change did not make staff more exhausted, why: "staff feel less tired at the end of the day, not more"}
        - {t: they cancelled all meetings permanently, why: "บทบอกแค่ว่าไม่สนับสนุนการประชุมในช่วงเช้า"}
        - {t: their staff complained about the new rule, why: "บทไม่ได้พูดถึงการร้องเรียนของพนักงาน"}
        - {t: they hired more receptionists, why: "ไม่มีข้อมูลนี้ในบท"}
