# ---------- ช่องว่าง 3 ช่อง ----------
- id: cefr-c1-cpa-015
  kind: cloze
  skill: gm
  topic: nominalisation
  level: 2
  text: |
    Following the (1) ____ of the new parking rules, complaints have fallen sharply. Some residents wanted the rules to be stricter, others more flexible; (2) ____ argued that cars should be banned altogether, while the latter preferred a permit system. The council has promised to review the rules, and it will (3) ____ next spring.
  questions:
    - choices:
        - {t: introduction, why: "หลัง the ... of ต้องเป็นคำนาม introduction"}
        - {t: introduce, why: "introduce เป็นกริยา"}
        - {t: introductory, why: "introductory เป็นคุณศัพท์"}
        - {t: introducing, why: "the introducing of ไม่ใช่รูปคำนามที่ใช้"}
    - choices:
        - {t: the former, why: "อ้างถึงกลุ่มแรก (อยากให้เข้มงวด) คู่กับ the latter"}
        - {t: the formal, why: "formal แปลว่าทางการ สะกดคล้ายแต่ผิด"}
        - {t: the later, why: "later แปลว่าทีหลัง ไม่ใช่คำอ้างอิง"}
        - {t: such, why: "such ไม่ใช้ในตำแหน่งประธานแบบนี้"}
    - choices:
        - {t: do so, why: "do so แทน review the rules ไม่ต้องพูดซ้ำ"}
        - {t: do it so, why: "มี it เกินมา จึงใช้ไม่ได้"}
        - {t: so do, why: "ลำดับผิด จึงใช้ไม่ได้"}
        - {t: doing so, why: "หลัง will ต้องใช้กริยารูปเดิม"}
  status: approved
