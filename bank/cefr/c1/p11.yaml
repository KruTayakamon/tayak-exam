- id: cefr-c1-w11-058
  kind: read
  skill: rd
  topic: lifelong-learning
  level: 2
  pool: true
  title: "Never Too Late: Learning at Sixty"
  passage: |
    When Khun Prasert retired at sixty, he expected to spend his time gardening. Instead, he enrolled in an online course on Thai history. "I was always inquisitive," he says, "but work never left me time to follow my interests."

    He admits the start was hard. The video platform was unfamiliar, and he sometimes felt embarrassed asking younger classmates for help. But he discovered that his life experience was valuable in discussions, and several classmates said his comments made the topics feel more authentic.

    Two years later, Prasert has completed four courses and now volunteers at a local museum, giving tours to school groups. Research supports his experience: older adults who keep learning tend to report better memory and a stronger sense of purpose, although scientists caution that more active people may simply be more likely to study in the first place.
  questions:
    - stem: "What difficulty did Prasert face at first?"
      choices:
        - {t: "using the online platform", why: "The video platform was unfamiliar"}
        - {t: "understanding Thai history", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "paying the course fees", why: "ในบทไม่ได้พูดถึงค่าเรียน"}
        - {t: "finding time after retirement", why: "ในบทไม่ได้พูดเช่นนั้น (finding time after retirement)"}
    - stem: "How did his classmates view his contributions?"
      choices:
        - {t: "they valued his experience", why: "his comments made the topics feel more authentic"}
        - {t: "they found them too long", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "they ignored them", why: "ความหมายกลับกัน"}
        - {t: "they disagreed with him", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What caution do scientists add?"
      choices:
        - {t: "active people may be more likely to study anyway", why: "more active people may simply be more likely to study in the first place"}
        - {t: "learning harms older adults' memory", why: "ความหมายกลับกัน"}
        - {t: "online courses are not useful for people over sixty", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "museums are better than courses", why: "ในบทไม่ได้พูดถึง"}
  status: approved
