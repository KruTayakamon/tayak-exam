- id: cefr-c1-w01-058
  kind: read
  skill: rd
  topic: workplace-communication
  level: 2
  pool: true
  title: "Why Clear Messages Save Money"
  passage: |
    A recent survey of 500 office workers found that unclear emails cost the average employee almost two hours a week. Most of this time was spent asking for clarification or correcting work that had been done wrongly.

    The most common problem was not grammar but structure. Many messages buried the key request in the third or fourth paragraph, so readers missed it. Others relied on implicit assumptions, such as "the usual format" or "the same as last time", which new staff could not interpret.

    Communication trainers suggest a simple rule: state the action and the deadline in the first sentence, then give the background. They also recommend avoiding ambiguous words like "soon" and "shortly". As one trainer put it, "If you mean Friday at noon, write Friday at noon."
  questions:
    - stem: "What did the survey find was the main cause of wasted time?"
      choices:
        - {t: "poorly organised messages", why: "The most common problem was not grammar but structure"}
        - {t: "grammar mistakes", why: "ผลสำรวจบอกว่าไม่ใช่ไวยากรณ์"}
        - {t: "too many meetings", why: "ในบทไม่ได้พูดถึงการประชุม"}
        - {t: "slow internet connections", why: "ในบทไม่ได้พูดถึงอินเทอร์เน็ต"}
    - stem: "Why do phrases like \"the usual format\" cause problems?"
      choices:
        - {t: "new staff may not know what they mean", why: "which new staff could not interpret"}
        - {t: "they sound rude", why: "ในบทไม่ได้พูดว่าหยาบคาย"}
        - {t: "they are too long", why: "ในบทไม่ได้พูดถึงความยาว"}
        - {t: "managers dislike them", why: "ในบทไม่ได้พูดถึงผู้จัดการ"}
    - stem: "What does the trainer's final quotation show?"
      choices:
        - {t: "the importance of being specific", why: "If you mean Friday at noon, write Friday at noon"}
        - {t: "that deadlines should be flexible", why: "ความหมายกลับกัน"}
        - {t: "that Friday is the best deadline", why: "เป็นเพียงตัวอย่าง"}
        - {t: "that emails should be informal", why: "ในบทไม่ได้พูดถึงความเป็นกันเอง"}
  status: approved
