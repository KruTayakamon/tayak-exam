# ---------- วันที่ 4 · อ่านบทความและฟังการอภิปราย ----------
- id: cefr-c1-w03-035
  kind: read
  skill: rd
  topic: leadership
  level: 2
  title: "The Quiet Leader"
  passage: |
    When we imagine a great leader, most of us picture someone confident and loud: the person who speaks first in meetings and makes decisions quickly. It is precisely this image, according to a growing body of research, that leads many organisations to promote the wrong people.

    In a three-year study of 120 teams at a large logistics firm, researchers measured not only results but also how team members felt about their managers. What they found surprised the company's directors. The most productive teams were rarely led by the most charismatic managers. Instead, they tended to be led by people who asked more questions than they answered, and who were comfortable admitting when they did not know something.

    These "quiet leaders" did not avoid difficult decisions. What they did was delay them until they had heard from the people closest to the problem. As one warehouse supervisor put it, "She never pretended to know our jobs better than we did. That's exactly why we trusted her."

    The researchers do not claim that confidence is a weakness. Teams in a crisis, they note, often benefit from a decisive voice. But they argue that companies should stop treating confidence as a sign of competence. Such is the power of first impressions that a manager who speaks fluently in an interview can be hired over a far more capable colleague. Only by changing how they recruit and promote, the study concludes, will organisations stop rewarding the loudest person in the room.
  questions:
    - stem: What is the main idea of the article?
      choices:
        - {t: organisations often mistake confidence for good leadership, why: "ทั้งบทชี้ว่าองค์กรมองความมั่นใจเป็นความสามารถ และเลื่อนตำแหน่งผิดคน"}
        - {t: loud managers always fail in a crisis, why: "บทบอกว่าในวิกฤต ทีมได้ประโยชน์จากเสียงที่เด็ดขาด"}
        - {t: logistics companies have poor managers, why: "บริษัทขนส่งเป็นแค่ที่ทำวิจัย ไม่ใช่ประเด็นหลัก"}
        - {t: managers should never make quick decisions, why: "บทไม่ได้ห้ามตัดสินใจเร็ว"}
    - stem: What did the most productive teams' managers tend to do?
      choices:
        - {t: listen and admit what they did not know, why: "asked more questions ... comfortable admitting when they did not know"}
        - {t: speak first in every meeting, why: "เป็นภาพของผู้นำที่มั่นใจ ซึ่งบทแย้ง"}
        - {t: avoid making any difficult decisions, why: "บทบอกว่า did not avoid difficult decisions"}
        - {t: replace staff who made mistakes, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: Why did the warehouse staff trust their supervisor?
      choices:
        - {t: she respected their knowledge of their work, why: "She never pretended to know our jobs better than we did"}
        - {t: she was very charismatic, why: "บทบอกว่าผู้นำที่ได้ผลไม่ใช่คนที่มีเสน่ห์มากที่สุด"}
        - {t: she made decisions quickly, why: "เธอชะลอการตัดสินใจจนได้ฟังคนหน้างาน"}
        - {t: she had worked in the warehouse before, why: "ไม่มีข้อมูลนี้ในบท"}
    - stem: What can be inferred about job interviews?
      choices:
        - {t: they may favour candidates who speak well over those who work well, why: "a manager who speaks fluently in an interview can be hired over a far more capable colleague"}
        - {t: they are the best way to find good leaders, why: "บทเสนอให้เปลี่ยนวิธีรับคน แปลว่าไม่ใช่วิธีที่ดีที่สุด"}
        - {t: they should be done by warehouse staff, why: "ไม่มีข้อเสนอนี้"}
        - {t: quiet people usually refuse to attend them, why: "ไม่มีข้อมูลที่สนับสนุน"}
  status: approved
