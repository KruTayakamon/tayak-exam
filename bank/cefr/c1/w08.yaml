# ---------- วันที่ 4 · อ่านรายงานเชิงนโยบายและฟังสัมภาษณ์ ----------
- id: cefr-c1-w08-035
  kind: read
  skill: rd
  topic: policy-report
  level: 2
  title: "Policy Brief · Reducing Road Deaths among Motorcyclists (fictional)"
  passage: |
    Motorcyclists account for nearly three quarters of road deaths in the fictional province of Saeng Thong. This brief summarises the main causes and recommends three measures that could be introduced within twelve months.

    The data reveal a clear pattern. Most fatal accidents involve riders aged between 15 and 24, take place at night and occur on rural roads within ten kilometres of the rider's home. Helmet use in these areas is below 40 per cent, compared with over 80 per cent in the provincial capital. Weak enforcement, poor street lighting and limited public transport all hamper efforts to improve safety.

    First, we recommend increasing helmet checks on rural roads, particularly in the evening. Experience in neighbouring provinces suggests that visible enforcement deters risky behaviour more effectively than higher fines alone. Second, the province should prioritise lighting on the twenty most dangerous rural routes. Third, a pilot night-bus service for young people would mitigate the need to ride after dark.

    These measures are not without cost. Enforcement requires additional staff, and lighting upgrades depend on support from the national budget, which may delay their introduction. Moreover, enforcement alone risks undermining trust between police and young people if it is seen as unfair. For this reason, we recommend that any campaign be designed in consultation with local schools and community leaders. If implemented together, these steps could reduce motorcycle deaths substantially, although the exact effect cannot yet be ascertained.
  questions:
    - stem: What is the main purpose of the policy brief?
      choices:
        - {t: to explain causes of motorcycle deaths and propose solutions, why: "summarises the main causes and recommends three measures"}
        - {t: to ban motorcycles on rural roads, why: "ไม่มีข้อเสนอให้ห้ามขับ"}
        - {t: to criticise the national government, why: "กล่าวถึงงบประมาณกลางเพียงเป็นข้อจำกัด ไม่ใช่จุดประสงค์"}
        - {t: to compare helmet brands, why: "ไม่มีการเปรียบเทียบยี่ห้อ"}
    - stem: According to the data, where do most fatal accidents happen?
      choices:
        - {t: on country roads close to the rider's home, why: "on rural roads within ten kilometres of the rider's home"}
        - {t: in the provincial capital, why: "ตัวเมืองมีอัตราการสวมหมวกสูงกว่า ไม่ใช่ที่เกิดเหตุส่วนใหญ่"}
        - {t: on motorways, why: "ไม่ได้พูดถึงทางหลวงพิเศษ"}
        - {t: near schools during the day, why: "อุบัติเหตุส่วนใหญ่เกิดตอนกลางคืน"}
    - stem: Why does the brief recommend visible police checks?
      choices:
        - {t: they discourage risky riding more than fines alone, why: "visible enforcement deters risky behaviour more effectively than higher fines alone"}
        - {t: they are cheaper than street lighting, why: "ไม่ได้เปรียบเทียบราคา"}
        - {t: young people asked for them, why: "ไม่มีข้อมูลนี้ในบทความ"}
        - {t: fines have already been abolished, why: "บทไม่ได้บอกว่ายกเลิกค่าปรับ"}
    - stem: What risk of enforcement do the authors mention?
      choices:
        - {t: it could damage relations between police and young people, why: "risks undermining trust between police and young people"}
        - {t: it could increase the number of accidents, why: "ไม่มีการกล่าวถึงข้อนี้"}
        - {t: it could make helmets more expensive, why: "ไม่มีการกล่าวถึงราคาหมวก"}
        - {t: it could close local schools, why: "โรงเรียนถูกเสนอให้มีส่วนร่วม ไม่ได้ถูกปิด"}
  status: approved
