# ---------- วันที่ 4 · อ่านบทบรรณาธิการและฟังสุนทรพจน์ ----------
- id: cefr-c1-w02-035
  kind: read
  skill: rd
  topic: editorial
  level: 2
  title: "Editorial · The Reading Crisis We Refuse to See"
  passage: |
    Never before have so many young people had so much access to information, and rarely have they read so little of it with care. A recent survey in the fictional province of Lanna Valley found that only a third of fifteen-year-olds could identify the main argument of a simple newspaper article. The figure was unprecedented, and the response from officials was, at best, muted.

    It would be easy to blame smartphones. Yet the problem began long before the first phone arrived in a classroom. For years, reading lessons have focused on finding facts in a text rather than understanding why it was written. Students have become skilled at scanning for answers and strikingly poor at noticing what an author is trying to persuade them to believe.

    The consequences go well beyond exam scores. Adults who cannot tell an argument from an advertisement are easier to mislead, whether by a dishonest seller or a persuasive politician. In this sense, the reading crisis is also a democratic one.

    There is no single solution, but some steps are imperative. Schools should give students longer texts and more time to discuss them. Libraries, many of which have quietly closed, need funding again. Above all, parents should read in front of their children, not merely tell them to read. Were adults to model the habit themselves, the effect would be profound. Should we fail to act, the gap between those who read critically and those who do not will only widen.
  questions:
    - stem: What is the writer's main argument?
      choices:
        - {t: weak critical reading is a serious problem that needs action, why: "ทั้งบทชี้ว่าการอ่านเชิงวิเคราะห์อ่อนลงและเสนอสิ่งที่ต้องทำ"}
        - {t: smartphones are the main cause of the problem, why: "ผู้เขียนบอกว่าโทษโทรศัพท์ง่ายเกินไป ปัญหาเริ่มก่อนนั้น"}
        - {t: exam scores in the province are falling, why: "ผู้เขียนบอกว่าผลกระทบไปไกลกว่าคะแนนสอบ"}
        - {t: libraries should replace schools, why: "ไม่มีข้อเสนอแบบนี้"}
    - stem: According to the writer, what have reading lessons focused on?
      choices:
        - {t: locating information rather than understanding purpose, why: "focused on finding facts ... rather than understanding why it was written"}
        - {t: reading long texts slowly, why: "ผู้เขียนเสนอให้อ่านบทยาวขึ้น แปลว่ายังไม่ได้ทำ"}
        - {t: discussing advertisements, why: "ไม่ได้บอกว่าบทเรียนเน้นโฆษณา"}
        - {t: using phones in class, why: "ไม่ได้บอกว่าบทเรียนเน้นโทรศัพท์"}
    - stem: Why does the writer call it "a democratic" crisis?
      choices:
        - {t: people who read poorly are easier to mislead, why: "Adults who cannot tell an argument from an advertisement are easier to mislead"}
        - {t: politicians do not read enough, why: "บทไม่ได้พูดว่านักการเมืองอ่านน้อย"}
        - {t: voting rates have fallen, why: "ไม่มีข้อมูลเรื่องการเลือกตั้ง"}
        - {t: the government closed the libraries, why: "บทบอกว่าห้องสมุดปิดไปเงียบ ๆ ไม่ได้บอกว่ารัฐบาลสั่ง"}
    - stem: What does the writer imply about parents?
      choices:
        - {t: their example matters more than their instructions, why: "read in front of their children, not merely tell them to read"}
        - {t: they should buy more books for schools, why: "ไม่มีข้อเสนอนี้"}
        - {t: they read more than their children, why: "บทไม่ได้เปรียบเทียบแบบนี้"}
        - {t: they are responsible for the closed libraries, why: "ไม่มีข้อมูลที่สนับสนุน"}
  status: draft
