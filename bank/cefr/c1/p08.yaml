- id: cefr-c1-w08-058
  kind: read
  skill: rd
  topic: policy-report
  level: 2
  pool: true
  title: "Summary: Reducing Road Deaths in Riverside Province (Fictional)"
  passage: |
    Road accidents remain the leading cause of death among people aged 15 to 29 in the province. Most involve motorbikes, and in 70 per cent of cases the rider was not wearing a helmet.

    This report recommends three measures. First, stricter enforcement of helmet laws, which evidence from other provinces suggests can deter risky behaviour within months. Second, better street lighting on rural roads, where poor visibility hampers drivers at night. Third, free riding courses for new licence holders.

    The report acknowledges that enforcement alone cannot solve the problem. Unless young people see helmets as normal rather than inconvenient, fines may simply encourage riders to circumvent checkpoints by using smaller roads.
  questions:
    - stem: "What fact about accidents is highlighted?"
      choices:
        - {t: "most riders involved had no helmet", why: "in 70 per cent of cases the rider was not wearing a helmet"}
        - {t: "most happen in the city centre", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "most involve trucks", why: "ส่วนใหญ่เป็นรถจักรยานยนต์"}
        - {t: "most victims are over 50", why: "กลุ่มหลักอายุ 15–29"}
    - stem: "Why is better lighting recommended?"
      choices:
        - {t: "drivers can't see well at night on rural roads", why: "poor visibility hampers drivers at night"}
        - {t: "it reduces crime", why: "ในบทไม่ได้พูดถึงอาชญากรรม"}
        - {t: "it is cheaper than fines", why: "ในบทไม่ได้เปรียบเทียบราคา"}
        - {t: "street lights make villages look more modern", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What risk does the report mention about fines?"
      choices:
        - {t: "riders may avoid checkpoints", why: "encourage riders to circumvent checkpoints by using smaller roads"}
        - {t: "fines are too expensive", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "police may refuse to collect them", why: "ในบทไม่ได้พูดถึง"}
        - {t: "helmets will become more expensive", why: "ในบทไม่ได้พูดถึง (helmets will become more expensive)"}
  status: approved
