  passage: |
    For eight years, Ploy worked as a bank clerk in Bangkok. The salary was good and her supervisor was kind, but she felt that something was missing. "Every evening I baked bread to relax," she says. "My friends kept telling me I should sell it."

    Two years ago, she made the decision to leave her job. It wasn't easy. She took a six-month baking course to get a proper qualification, and she used all her savings to set up a small bakery near her old office. "The first year was terrible. I worked fourteen hours a day, and I nearly gave up twice."

    Today, the bakery has four employees and sells out by noon most days. Ploy earns less than she did at the bank, but she says she has never been happier. "If you are determined, you can change your career at any age. But make sure you have enough money for at least one year."
