  title: "About Our Speaker: Ms Kanya Thongdee"
  passage: |
    Kanya Thongdee is a first-aid trainer with twelve years of experience. She started her career as a nurse in a small hospital in Lampang, where she worked for five years.

    Since 2018, she has run first-aid workshops for companies, schools and sports clubs. She has trained more than 4,000 people, and last year she received an award for her work in rural areas.

    In today's session, Kanya will show you how to help someone who is choking. You will also practise basic skills in small groups, so please wear comfortable clothes. Everyone who completes the session will receive a certificate.
