- id: cefr-b1-w08-035
  kind: read
  skill: rd
  topic: saving-money
  level: 2
  title: "Small Changes, Big Savings"
  passage: |
    Many people say they can't afford to save money. But according to a small survey by a Bangkok bank, most people who started saving began with very small amounts, often only 20 baht a day.

    Nok, a 34-year-old office worker, used to buy two coffees a day. "If I made coffee at home, I would save about 1,500 baht a month," she realised. She now takes coffee from home and puts the money into a separate account. "I wish I had started five years ago," she says.

    Experts say the most important thing is to save automatically. If your bank moves money to a savings account on payday, you will not see it and you will not spend it. They also suggest that people with loans should pay back the loan first, because the interest on a loan is usually higher than the interest on savings.
  questions:
    - stem: How did most people in the survey start saving?
      choices:
        - {t: with small amounts, why: "began with very small amounts"}
        - {t: with a bank loan, why: "ไม่ได้บอกว่าเริ่มจากเงินกู้"}
        - {t: with 1,500 baht a day, why: "1,500 บาทเป็นยอดต่อเดือนของนก"}
        - {t: with help from their family, why: "ไม่มีการพูดถึงครอบครัว"}
    - stem: What does Nok do now?
      choices:
        - {t: takes coffee from home, why: "She now takes coffee from home"}
        - {t: buys one coffee a day, why: "เธอเลิกซื้อแล้ว ไม่ได้ลดเหลือแก้วเดียว"}
        - {t: works at a bank, why: "เธอเป็นพนักงานออฟฟิศ"}
        - {t: pays back a loan, why: "เรื่องเงินกู้เป็นคำแนะนำของผู้เชี่ยวชาญ"}
    - stem: What does Nok regret?
      choices:
        - {t: not starting earlier, why: "I wish I had started five years ago"}
        - {t: opening a separate account, why: "เธอพอใจกับบัญชีแยก"}
        - {t: drinking coffee, why: "เธอยังดื่มกาแฟ แค่ชงเอง"}
        - {t: taking a loan, why: "ไม่ได้บอกว่าเธอกู้เงิน"}
    - stem: Why should people with loans pay them back first?
      choices:
        - {t: loan interest is usually higher, why: "the interest on a loan is usually higher"}
        - {t: banks require it, why: "ไม่ได้บอกว่าธนาคารบังคับ"}
        - {t: saving is not useful, why: "บทความสนับสนุนการออม"}
        - {t: loans are free, why: "เงินกู้มีดอกเบี้ย"}
  status: approved
