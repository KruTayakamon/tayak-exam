  title: "Your order #4821 — delivery update"
  passage: |
    Dear Mr Somchai,

    Thank you for shopping with GreenHome. We are writing to let you know that your order (one bookshelf and two chairs) has been delayed. Unfortunately, the factory had a problem with the wood, and the chairs will not be ready until 20 June.

    We apologise for the inconvenience. You can choose one of these options:
    1. Receive the bookshelf now and the chairs later, with free delivery for both.
    2. Wait and receive everything together on 21 June.
    3. Cancel the chairs and get a full refund for them within five working days.

    Would you mind replying to this email by 10 June so that we can arrange delivery? If we do not hear from you, we will send everything together (option 2).

    Kind regards,
    Pim Suwan, Customer Support
  questions:
    - stem: Why is the order late?
      choices:
        - {t: a problem at the factory, why: "the factory had a problem with the wood"}
        - {t: the delivery truck broke down, why: "ไม่ได้พูดถึงรถส่งของ"}
        - {t: Mr Somchai paid late, why: "ไม่ได้บอกว่าจ่ายเงินช้า"}
        - {t: the bookshelf is sold out, why: "ปัญหาอยู่ที่เก้าอี้ ไม่ใช่ชั้นหนังสือ"}
    - stem: Which item is delayed?
      choices:
        - {t: the chairs, why: "the chairs will not be ready until 20 June"}
        - {t: the bookshelf, why: "ชั้นหนังสือส่งได้เลย (ตัวเลือกที่ 1)"}
        - {t: both items, why: "ชั้นหนังสือพร้อมส่ง"}
        - {t: nothing, why: "มีเก้าอี้ที่ล่าช้า"}
    - stem: What happens if Mr Somchai doesn't reply?
      choices:
        - {t: everything arrives together, why: "we will send everything together (option 2)"}
        - {t: the order is cancelled, why: "ไม่ได้ยกเลิกเอง"}
        - {t: he gets a refund, why: "การคืนเงินต้องเลือกตัวเลือกที่ 3"}
        - {t: he must pay for delivery, why: "ไม่ได้บอกว่าต้องจ่ายค่าส่ง"}
    - stem: What is the purpose of the email?
      choices:
        - {t: to explain a delay and offer choices, why: "บอกว่าล่าช้าและให้เลือก 3 ทาง"}
        - {t: to sell new furniture, why: "ไม่ได้ขายของใหม่"}
        - {t: to complain about a customer, why: "บริษัทขอโทษลูกค้า ไม่ได้บ่น"}
        - {t: to ask for payment, why: "ไม่ได้ทวงเงิน ลูกค้าจ่ายแล้ว"}
  status: approved
