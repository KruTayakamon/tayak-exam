- id: cefr-b1-w10-058
  kind: read
  skill: rd
  topic: three-opinions
  level: 2
  pool: true
  title: "Should Shops Charge for Plastic Bags?"
  passage: |
    Malee, 34: I think it's a good idea. Since my local supermarket started charging one baht per bag, I always bring my own cloth bag. If it costs money, people remember.

    Tom, 52: I don't agree. One baht is too little to change anything. The government should ban plastic bags completely, especially in markets, where most of them are used.

    Arisa, 21: I understand both sides. Charging is a start, but shops should also give people cheap reusable bags. Many older people don't know where to buy them.
  questions:
    - stem: "What does Malee do now?"
      choices:
        - {t: "she brings a cloth bag", why: "I always bring my own cloth bag"}
        - {t: "she pays for plastic bags", why: "เธอบอกว่าตอนนี้พาถุงผ้าไปเอง"}
        - {t: "she shops at the market", why: "ไม่ได้พูดถึงตลาด"}
        - {t: "she sells cloth bags", why: "ไม่ได้พูดว่าขายถุง"}
    - stem: "What is Tom's opinion?"
      choices:
        - {t: "plastic bags should be banned", why: "should ban plastic bags completely"}
        - {t: "one baht is a fair price", why: "เขาบอกว่าหนึ่งบาทน้อยเกินไป"}
        - {t: "markets should charge more", why: "เขาอยากให้ห้าม ไม่ใช่ขึ้นราคา"}
        - {t: "the idea is good", why: "เขาไม่เห็นด้วย จึงใช้ไม่ได้"}
    - stem: "What does Arisa suggest?"
      choices:
        - {t: "selling cheap reusable bags", why: "shops should also give people cheap reusable bags"}
        - {t: "stopping the charge", why: "เธอว่าการเก็บเงินเป็นจุดเริ่ม"}
        - {t: "teaching young people", why: "เธอพูดถึงผู้สูงอายุ"}
        - {t: "closing some markets", why: "ไม่ได้พูดถึงการปิดตลาด"}
  status: approved
