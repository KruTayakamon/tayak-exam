  title: "From Bank Clerk to Baker"
  passage: |
    Pim worked at a bank for nine years. The salary was good, but she felt bored. "I used to look at the clock all day," she says.

    In 2021, she took a six-month baking course at weekends. Her teacher said she was very capable, and Pim started selling cakes to her colleagues. Soon, people from other offices were ordering too.

    Last year, she made the decision to leave the bank. She now runs a small bakery near the train station. "I earn less money than before, and I work longer hours," she says. "But I'm much happier. I wish I had done this earlier."
  questions:
    - stem: "How did Pim first sell her cakes?"
      choices:
        - {t: "to people she worked with", why: "selling cakes to her colleagues"}
        - {t: "at a train station", why: "ร้านอยู่ใกล้สถานีเป็นเรื่องตอนหลัง"}
        - {t: "online", why: "ไม่ได้พูดถึงการขายออนไลน์"}
        - {t: "at weekend markets", why: "เรียนทำขนมช่วงสุดสัปดาห์ ไม่ใช่ขาย"}
    - stem: "What is true about Pim's new job?"
      choices:
        - {t: "she works more hours", why: "I work longer hours"}
        - {t: "she earns more money", why: "เธอได้เงินน้อยกว่าเดิม"}
        - {t: "she feels bored", why: "เธอบอกว่ามีความสุขกว่ามาก"}
        - {t: "it is in a bank", why: "เธอลาออกจากธนาคารแล้ว"}
    - stem: "What does Pim regret?"
      choices:
        - {t: "not changing jobs sooner", why: "I wish I had done this earlier"}
        - {t: "taking the baking course", why: "ไม่ได้เสียใจเรื่องคอร์ส"}
        - {t: "leaving the bank", why: "เธอดีใจที่ออก จึงใช้ไม่ได้"}
        - {t: "opening near the station", why: "ไม่ได้พูดถึงเรื่องนี้"}
  status: approved
