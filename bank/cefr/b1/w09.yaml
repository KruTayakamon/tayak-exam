# ---------- วันที่ 4 · อ่านบันทึกการประชุมและฟังข้อความฝาก ----------
- id: cefr-b1-w09-035
  kind: read
  skill: rd
  topic: meeting-notes
  level: 2
  title: "Notes · Team Meeting, Monday 3 March"
  passage: |
    Present: Dao (manager), Krit, Fah, Joe. Absent: Mai (on leave).

    1. New schedule. Dao said that the office would open at 8.30 instead of 9 from next month. Krit complained that the change would be difficult for parents with young children. Dao agreed to discuss flexible hours with HR.

    2. Customer complaints. Fah reported that complaints had increased by ten percent, mostly about slow replies. The team agreed that all emails must receive a response within one working day.

    3. Office party. Joe asked if the team could have the party on a Friday. Everyone agreed. Joe will book a restaurant and tell Mai when she returns.

    Next meeting: Monday 17 March.
  questions:
    - stem: Who did not attend the meeting?
      choices:
        - {t: Mai, why: "Absent: Mai (on leave)"}
        - {t: Dao, why: "ดาวเป็นผู้จัดการและอยู่ในที่ประชุม"}
        - {t: Joe, why: "โจเสนอเรื่องงานเลี้ยง"}
        - {t: Krit, why: "กฤตบ่นเรื่องเวลาเปิด"}
    - stem: Why did Krit complain?
      choices:
        - {t: the new time is hard for some parents, why: "difficult for parents with young children"}
        - {t: the office would close earlier, why: "ออฟฟิศเปิดเร็วขึ้น ไม่ได้ปิดเร็วขึ้น"}
        - {t: he wanted a party, why: "โจเป็นคนเสนองานเลี้ยง"}
        - {t: emails were slow, why: "เรื่องอีเมลเป็นรายงานของฟ้า"}
    - stem: What did the team agree about emails?
      choices:
        - {t: reply within one working day, why: "a response within one working day"}
        - {t: send fewer emails, why: "ไม่ได้พูดเรื่องส่งน้อยลง"}
        - {t: Fah will answer all emails, why: "ฟ้ารายงานตัวเลข ไม่ได้รับผิดชอบตอบทั้งหมด"}
        - {t: stop answering complaints, why: "กลับความหมาย ทีมตกลงจะตอบเร็วขึ้น"}
    - stem: What will Joe do?
      choices:
        - {t: book a restaurant, why: "Joe will book a restaurant"}
        - {t: talk to HR, why: "ดาวเป็นคนคุยกับฝ่ายบุคคล"}
        - {t: change the schedule, why: "เรื่องตารางเป็นของดาว"}
        - {t: lead the next meeting, why: "ไม่ได้บอกว่าใครนำประชุม"}
  status: approved
