  title: "Email from Sunshine Travel"
  passage: |
    Dear Ms Wanida,

    Thank you for booking your trip to Krabi with us. Unfortunately, the hotel you chose is now fully booked on 12 and 13 April because of a large wedding.

    We would like to offer you two choices. You can stay at the Sea View Hotel, which is next door and has the same price, or you can put off your trip by one week and stay at your original hotel. If you choose the Sea View, we will give you a free dinner on your first night.

    Please reply by 5 March so that we can confirm your booking. We apologise for any problems this may cause.

    Best regards,
    Napa Somboon, Customer Service
  questions:
    - stem: "Why can't Ms Wanida stay at her hotel on 12–13 April?"
      choices:
        - {t: "it is full because of a wedding", why: "fully booked ... because of a large wedding"}
        - {t: "it is closed for repairs", why: "ไม่ได้พูดว่าปิดซ่อม"}
        - {t: "she booked the wrong dates", why: "ไม่ได้บอกว่าเธอจองผิด"}
        - {t: "the price has increased", why: "ไม่ได้พูดว่าราคาขึ้น"}
    - stem: "What will she get if she chooses the Sea View Hotel?"
      choices:
        - {t: "a free dinner", why: "we will give you a free dinner on your first night"}
        - {t: "a cheaper room", why: "ราคาเท่ากัน จึงใช้ไม่ได้"}
        - {t: "an extra night", why: "ไม่ได้ให้คืนเพิ่ม"}
        - {t: "a free trip next year", why: "ไม่ได้พูดถึงทริปฟรี"}
    - stem: "What must she do by 5 March?"
      choices:
        - {t: "reply to the email", why: "Please reply by 5 March"}
        - {t: "pay for the trip", why: "ไม่ได้พูดถึงการจ่ายเงิน"}
        - {t: "call the hotel", why: "ให้ตอบอีเมล ไม่ใช่โทรหาโรงแรม"}
        - {t: "go to the travel office", why: "ไม่ได้บอกให้ไปที่สำนักงาน"}
