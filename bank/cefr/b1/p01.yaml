  title: "Staff News: A New Face in Customer Service"
  passage: |
    This month we are welcoming Mr Pornchai Saetang to the customer service team. Pornchai has eight years of experience in hotels and speaks Thai, English and Chinese.

    He is currently working on our new online help system, which will open in January. Until then, he is answering customer emails in the mornings and attending training in the afternoons.

    Pornchai says he enjoys solving problems and meeting new people. Outside work, he runs a small cooking club for his neighbours. Please say hello if you see him on the third floor.
  questions:
    - stem: What is Pornchai doing in the afternoons this month?
      choices:
        - {t: attending training, why: "attending training in the afternoons"}
        - {t: answering customer emails, why: "ตอบอีเมลตอนเช้า"}
        - {t: working in a hotel, why: "เป็นงานเก่าของเขา"}
        - {t: running a cooking club, why: "ชมรมทำอาหารเป็นงานนอกเวลา"}
    - stem: When will the new online help system open?
      choices:
        - {t: in January, why: "which will open in January"}
        - {t: this month, why: "เดือนนี้คือเดือนที่เขาเริ่มงาน"}
        - {t: in eight years, why: "8 ปีคือประสบการณ์"}
        - {t: it is already open, why: "ระบบยังไม่เปิด จึงใช้ไม่ได้"}
    - stem: Where can staff find Pornchai?
      choices:
        - {t: on the third floor, why: "if you see him on the third floor"}
        - {t: in the hotel, why: "เขาไม่ได้ทำงานโรงแรมแล้ว"}
        - {t: at the cooking club only, why: "ชมรมอยู่นอกเวลางาน"}
        - {t: in the training room all day, why: "อบรมเฉพาะช่วงบ่าย"}
