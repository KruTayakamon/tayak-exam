  title: "Ban Suan Village: Sports Day Notice"
  passage: |
    Our annual sports day will take place on Sunday 14 December at the school field. The opening ceremony starts at 8 am, and the games will continue until 4 pm.

    There will be football, tug-of-war and a fun run for children under ten. If you want to join a team, please give your name to the village office by 10 December. Teams need at least six players.

    If it rains heavily, the event will move to the following Sunday. We will make an announcement on the village loudspeaker by 6 am that morning. Food and drinks will be available, but please bring your own water bottle.
  questions:
    - stem: "What is the last day to join a team?"
      choices:
        - {t: "10 December", why: "give your name to the village office by 10 December"}
        - {t: "14 December", why: "เป็นวันแข่ง จึงใช้ไม่ได้"}
        - {t: "the following Sunday", why: "เป็นวันสำรองถ้าฝนตก"}
        - {t: "6 am on the day", why: "เป็นเวลาประกาศเรื่องฝน"}
    - stem: "What will happen if it rains a lot?"
      choices:
        - {t: "the event will be a week later", why: "the event will move to the following Sunday"}
        - {t: "the games will start at 4 pm", why: "4 โมงเย็นคือเวลาจบ"}
        - {t: "the games will go inside the school", why: "ไม่ได้บอกว่าย้ายเข้าในโรงเรียน"}
        - {t: "the event will be cancelled", why: "ไม่ได้ยกเลิก แต่เลื่อน"}
    - stem: "What should people bring?"
      choices:
        - {t: "their own water bottle", why: "please bring your own water bottle"}
        - {t: "their own food", why: "มีอาหารให้ จึงใช้ไม่ได้"}
