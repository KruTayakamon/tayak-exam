  topic: meeting-notes
  level: 2
  pool: true
  title: "Notes from the Staff Meeting, 3 March"
  passage: |
    Present: Somsak (manager), Lek, Ploy, Arun
    1. Customer complaints: Lek said that complaints about late deliveries had increased in February. Somsak asked why this was happening. Arun explained that one of the vans had been broken for two weeks.
    2. New van: Somsak said the company would rent a van until the old one was repaired. Ploy asked whether the rental would be expensive. Somsak said it would cost less than losing customers.
    3. Next steps: Arun agreed to call the garage on Monday. Lek will send a short apology email to customers who complained.
    Next meeting: 17 March
  questions:
    - stem: "Why were deliveries late in February?"
      choices:
        - {t: "a van was broken", why: "one of the vans had been broken for two weeks"}
        - {t: "there were not enough staff", why: "ไม่ได้พูดถึงพนักงานไม่พอ"}
        - {t: "the garage was closed", why: "ไม่ได้บอกว่าอู่ปิด"}
        - {t: "customers changed their orders", why: "ไม่ได้พูดถึงการเปลี่ยนคำสั่งซื้อ"}
    - stem: "What did Ploy want to know?"
      choices:
        - {t: "if renting a van would cost a lot", why: "asked whether the rental would be expensive"}
        - {t: "when the next meeting was", why: "ไม่ได้บอกว่าเธอถามเรื่องนี้"}
        - {t: "who would call the garage", why: "อรุณรับเรื่องนี้ ไม่ใช่คำถามของพลอย"}
        - {t: "why customers were angry", why: "สมศักดิ์เป็นคนถามเรื่องสาเหตุ"}
    - stem: "Who will contact the customers?"
      choices:
        - {t: "Lek", why: "Lek will send a short apology email"}
        - {t: "Arun", why: "อรุณจะโทรหาอู่ จึงใช้ไม่ได้"}
        - {t: "Ploy", why: "พลอยถามเรื่องค่าเช่า"}
        - {t: "Somsak", why: "สมศักดิ์เป็นผู้จัดการ ไม่ได้รับงานนี้"}
  status: approved
