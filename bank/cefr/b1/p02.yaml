  title: "Riverside Community Centre: December Activities"
  passage: |
    Here is our programme for December. All activities are free for local residents, but you need to book a place at the front desk.

    Yoga classes take place every Monday and Wednesday at 6 pm. Please bring your own mat. The English conversation club meets twice a month, on the first and third Saturday, from 10 to 11.30 am.

    The centre will be closed from 24 to 26 December. On 31 December, there is a New Year party in the garden from 7 pm. Families are welcome, and there will be music and food from local shops.
  questions:
    - stem: "How often does the English club meet?"
      choices:
        - {t: "twice a month", why: "on the first and third Saturday"}
        - {t: "every Saturday", why: "เฉพาะเสาร์แรกกับเสาร์ที่สาม"}
        - {t: "every Monday and Wednesday", why: "วันจันทร์และพุธเป็นโยคะ"}
        - {t: "once a month", why: "มีสองครั้งต่อเดือน ไม่ใช่ครั้งเดียว"}
    - stem: "What must people do before joining an activity?"
      choices:
        - {t: "book a place at the desk", why: "you need to book a place at the front desk"}
        - {t: "pay a small fee", why: "ฟรีสำหรับคนในชุมชน"}
        - {t: "buy a mat at the centre", why: "ให้นำเสื่อมาเอง ไม่ใช่ซื้อ"}
        - {t: "call the centre on Monday", why: "ไม่ได้บอกให้โทรมาวันจันทร์"}
    - stem: "When is the centre closed?"
      choices:
