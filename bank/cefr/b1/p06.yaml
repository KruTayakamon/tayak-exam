  title: "Two Rice Cookers: Customer Reviews"
  passage: |
    Review 1 – SmartCook 300 (2,900 baht)
    I bought this for my family of five. It cooks rice perfectly and keeps it warm for hours. It has a timer, so I can set it at night and have rice ready in the morning. The only disadvantage is the size: it takes up a lot of space in my small kitchen.

    Review 2 – MiniRice (1,200 baht)
    This is perfect for one or two people. It's light and easy to clean, and it cooks rice in just 20 minutes. However, it doesn't keep rice warm for long, and there's no timer. For the price, it's very good value.
  questions:
    - stem: "What does the first writer NOT like about the SmartCook 300?"
      choices:
        - {t: "it is too big", why: "it takes up a lot of space in my small kitchen"}
        - {t: "it has no timer", why: "SmartCook มีตัวตั้งเวลา"}
        - {t: "it is hard to clean", why: "ไม่ได้พูดว่าทำความสะอาดยาก"}
        - {t: "it cooks slowly", why: "ไม่ได้พูดว่าหุงช้า"}
    - stem: "Who is the MiniRice most suitable for?"
      choices:
        - {t: "one or two people", why: "perfect for one or two people"}
        - {t: "large families", why: "ครอบครัวใหญ่เหมาะกับเครื่องแรก"}
        - {t: "people who want a timer", why: "MiniRice ไม่มีตัวตั้งเวลา"}
        - {t: "restaurants", why: "ไม่ได้พูดถึงร้านอาหาร"}
    - stem: "Which is true about both rice cookers?"
      choices:
        - {t: "they both get good reviews", why: "ทั้งสองรีวิวชมสินค้า มีข้อเสียเล็กน้อย"}
        - {t: "both keep rice warm for hours", why: "MiniRice อุ่นได้ไม่นาน"}
        - {t: "both cost the same", why: "ราคาต่างกัน 2,900 กับ 1,200"}
        - {t: "both cook rice in 20 minutes", why: "บอกเวลาไว้เฉพาะ MiniRice"}
  status: approved
