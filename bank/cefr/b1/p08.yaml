- id: cefr-b1-w08-058
  kind: read
  skill: rd
  topic: saving-money
  level: 2
  pool: true
  title: "Small Steps to Save Money"
  passage: |
    Many people think saving money is only possible with a high salary. In fact, small changes can make a big difference.

    First, write down everything you spend for one month. Most people are surprised by how much they spend on snacks and coffee. If you made coffee at home instead of buying it, you could save more than 1,000 baht a month.

    Second, try the "48-hour rule". If you want to buy something that isn't essential, wait two days. Often you will realise that you don't really need it.

    Finally, put some money into a savings account as soon as you get paid, not at the end of the month. This way, you won't spend it by mistake.
  questions:
    - stem: "What is the main idea of the article?"
      choices:
        - {t: "small changes can help you save", why: "small changes can make a big difference"}
        - {t: "you need a high salary to save", why: "บทความบอกว่าไม่จริง"}
        - {t: "coffee is bad for your health", why: "ไม่ได้พูดเรื่องสุขภาพ"}
        - {t: "banks give the best advice", why: "ไม่ได้พูดถึงคำแนะนำจากธนาคาร"}
    - stem: "What is the \"48-hour rule\"?"
      choices:
        - {t: "wait two days before buying", why: "ให้รอสองวันก่อนตัดสินใจซื้อ"}
        - {t: "save money for 48 hours", why: "ไม่ได้หมายความว่าออมสองวัน"}
        - {t: "spend only 48 baht a day", why: "ไม่ได้พูดถึงตัวเลขนี้"}
        - {t: "shop only twice a week", why: "ไม่ได้พูดถึงความถี่การซื้อ"}
    - stem: "When does the writer suggest saving money?"
      choices:
        - {t: "on payday", why: "as soon as you get paid"}
        - {t: "at the end of the month", why: "ผู้เขียนบอกว่าไม่ควรรอถึงสิ้นเดือน"}
        - {t: "after buying coffee", why: "ไม่เกี่ยวกับกาแฟ"}
        - {t: "every 48 hours", why: "48 ชั่วโมงเป็นกฎการซื้อ"}
  status: approved
