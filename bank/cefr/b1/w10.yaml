  topic: three-opinions
  level: 2
  title: "Should shops stop giving free plastic bags?"
  passage: |
    Mali (42, shop owner): I agree with the idea, although it was difficult at first. Some customers complained, especially older people who always use bags for their rubbish. However, after two months most of them started bringing their own bags.

    Ken (29, office worker): In my opinion, it's a good start, but it isn't enough. The main reason for plastic pollution is food packaging, not shopping bags. Companies should change their packaging so that we produce less waste.

    Wan (55, teacher): I'm not sure. I understand the purpose, but I think the government should give people free cloth bags first. Not everyone can afford to buy them, and it would have more influence if everyone joined in.
  questions:
    - stem: How did Mali's customers react after two months?
      choices:
        - {t: most brought their own bags, why: "after two months most of them started bringing their own bags"}
        - {t: they stopped shopping there, why: "ไม่ได้บอกว่าเลิกมาซื้อ"}
        - {t: they still complained, why: "ช่วงแรกเท่านั้นที่บ่น"}
        - {t: they paid for plastic bags, why: "ไม่ได้พูดเรื่องจ่ายเงินซื้อถุง"}
    - stem: What does Ken think is the main cause of plastic pollution?
      choices:
        - {t: food packaging, why: "The main reason ... is food packaging"}
        - {t: shopping bags, why: "เขาบอกว่า not shopping bags"}
        - {t: older people, why: "เป็นเรื่องที่มะลิพูดถึงลูกค้า"}
        - {t: the government, why: "รัฐบาลเป็นความเห็นของวรรณ"}
    - stem: What does Wan suggest?
      choices:
        - {t: free cloth bags from the government, why: "the government should give people free cloth bags first"}
        - {t: keeping free plastic bags, why: "เธอเข้าใจจุดประสงค์ แค่อยากให้แจกถุงผ้าก่อน"}
        - {t: changing food packaging, why: "เป็นข้อเสนอของเคน"}
        - {t: closing small shops, why: "ไม่มีใครเสนอเรื่องนี้"}
    - stem: Who fully supports the idea?
      choices:
        - {t: Mali, why: "Mali บอกว่า I agree with the idea"}
        - {t: Ken, why: "เคนว่าเป็นจุดเริ่มต้นที่ดีแต่ยังไม่พอ"}
        - {t: Wan, why: "วรรณบอกว่า I'm not sure"}
        - {t: nobody, why: "มะลิเห็นด้วยกับแนวคิดนี้"}
  status: approved
