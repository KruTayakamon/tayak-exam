- id: cefr-b1-w03-058
  kind: read
  skill: rd
  topic: incident-report
  level: 2
  pool: true
  title: "Incident Report: Lift Stuck on Floor 4"
  passage: |
    On Tuesday at about 2.15 pm, the main lift stopped between the third and fourth floors. Two staff members and a visitor were inside. They were travelling to a meeting on the fifth floor when the lights flickered and the lift suddenly stopped.

    One of the staff members pressed the alarm button immediately, and security called the lift company. While they were waiting, the security guard talked to them through the intercom to keep them calm.

    The engineer arrived at 3 pm and opened the doors ten minutes later. Nobody was hurt, but the visitor said she felt a little confused and tired. The lift will be checked again on Friday.
  questions:
    - stem: "Where were the three people going?"
      choices:
        - {t: "to a meeting on the fifth floor", why: "travelling to a meeting on the fifth floor"}
        - {t: "to the fourth floor", why: "ลิฟต์ค้างระหว่างชั้นสามกับสี่"}
        - {t: "to the security office", why: "ไม่ได้บอกว่าจะไปห้องรักษาความปลอดภัย"}
        - {t: "to the ground floor", why: "ไม่ได้บอกว่าลงชั้นล่าง"}
    - stem: "What did the security guard do while they waited?"
      choices:
        - {t: "talked to them through the intercom", why: "talked to them through the intercom"}
        - {t: "opened the doors", why: "ช่างเป็นคนเปิดประตู"}
        - {t: "pressed the alarm button", why: "พนักงานในลิฟต์เป็นคนกด"}
        - {t: "fixed the lights", why: "ไม่ได้พูดว่าเขาซ่อมไฟ"}
    - stem: "When were the doors opened?"
      choices:
        - {t: "at about 3.10 pm", why: "ช่างมาถึงบ่ายสาม เปิดประตูอีกสิบนาทีต่อมา"}
        - {t: "at 2.15 pm", why: "เป็นเวลาที่ลิฟต์ค้าง"}
        - {t: "at 3 pm", why: "เป็นเวลาที่ช่างมาถึง"}
        - {t: "on Friday", why: "วันศุกร์จะตรวจลิฟต์อีกครั้ง"}
