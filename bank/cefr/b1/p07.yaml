  title: "Greenhill Fitness Centre: Rules for Members"
  passage: |
    Members must show their card at the front desk every time they visit. Children under 16 are not allowed in the gym, but they can use the swimming pool with an adult.

    Please wipe the machines after use. Towels are provided at the entrance, so you don't have to bring your own. Lockers can be used during your visit, but you must empty them before you leave. Anything left in a locker overnight will be removed.

    Guests are welcome on weekdays. Each member can bring one guest per month, and the guest must pay 100 baht at the desk.
