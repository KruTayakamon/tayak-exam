- id: cefr-pl-0019
  band: b2
  kind: read
  skill: rd
  topic: education-article
  level: 2
  title: Homework Without Grades
  passage: |
    Last year a secondary school in Chiang Rai stopped giving grades for homework. Instead, teachers write two short comments on each piece: one thing the student did well and one thing to improve. The decision was controversial at first. Some parents worried that, without marks, their children would not take homework seriously.

    However, the results after two terms have surprised many of them. The number of students handing in homework on time rose from 61 to 78 percent. Teachers also noticed that students were more willing to try difficult tasks, as a mistake no longer meant losing points. On the other hand, the teachers admit that writing comments takes more time than giving a score, and the school is now looking for ways to reduce this extra workload.
  questions:
    - stem: How did some parents feel when the change was introduced?
      choices:
        - {t: They feared students would try less., why: "ผู้ปกครองกลัวว่าลูกจะ ==ไม่ทำการบ้านจริงจัง== เมื่อไม่มีคะแนน คือกังวลว่าจะไม่ตั้งใจ"}
        - {t: They asked for longer comments., why: "บทความไม่ได้บอกว่าผู้ปกครองอยากให้เขียนความเห็นยาวขึ้น"}
        - {t: They thought the homework was too difficult., why: "ความยากของการบ้านเป็นเรื่องที่ครูสังเกตจากนักเรียน ไม่ใช่ความกังวลของผู้ปกครอง"}
        - {t: They liked the results at once., why: "ช่วงแรกการตัดสินใจนี้มีข้อโต้แย้ง ผู้ปกครองพอใจทีหลังเมื่อเห็นผล"}
    - stem: What problem does the school still need to solve?
      choices:
