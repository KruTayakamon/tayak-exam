- id: cefr-pl-0012
  band: b1
  kind: read
  skill: rd
  topic: school-notice
  level: 2
  title: Message to Grade 9 Parents
  passage: |
    Dear parents,

    Our Grade 9 science trip to the national park will now take place on 14 March, not 7 March as planned. The bus company told us that two of their buses need repairs next week. The cost of the trip is still 250 baht per student, and it includes lunch.

    Please return the signed form to your child's class teacher by 10 March. Students who cannot join the trip will have normal lessons at school with Mr Somchai.

    Thank you for your support.
  questions:
    - stem: Why has the trip been moved?
      choices:
        - {t: The buses are not ready to use., why: "ข้อความบอกว่ารถบัสสองคันต้องซ่อม ==คือรถยังใช้ไม่ได้== แค่พูดด้วยคำต่างกัน"}
        - {t: The national park is closed., why: "ไม่มีการพูดถึงว่าอุทยานปิด สาเหตุอยู่ที่บริษัทรถบัส"}
        - {t: The cost of the trip has gone up., why: "ข้อความบอกชัดว่าราคายังเป็น 250 บาทเท่าเดิม"}
        - {t: Not enough students signed up., why: "ไม่มีการพูดถึงจำนวนนักเรียนที่สมัครเลย"}
    - stem: What should students who do not go on the trip do?
      choices:
        - {t: study at school as usual, why: "นักเรียนที่ไม่ไปจะเรียน normal lessons ที่โรงเรียน ==แปลว่าเรียนตามปกติ=="}
        - {t: stay at home on 14 March, why: "ข้อความบอกว่าเรียนที่โรงเรียน ไม่ได้ให้อยู่บ้าน"}
        - {t: give the form to Mr Somchai, why: "แบบฟอร์มต้องส่งครูประจำชั้น ส่วนครูสมชายสอนคนที่ไม่ได้ไป"}
        - {t: pay 250 baht for lunch, why: "250 บาทเป็นค่าทัศนศึกษาสำหรับคนที่ไป และรวมอาหารกลางวันแล้ว"}
  status: draft
