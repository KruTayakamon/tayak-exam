        - {t: Fewer students hand in their homework on time., why: "ตรงข้ามกับบทความ จำนวนคนส่งตรงเวลาเพิ่มจาก 61 เป็น 78 เปอร์เซ็นต์"}
        - {t: Students avoid difficult tasks., why: "บทความบอกว่านักเรียนกล้าลองงานยากมากขึ้น"}
        - {t: Parents want the grades to return., why: "บทความบอกว่าผลทำให้ผู้ปกครองหลายคนประหลาดใจ ไม่ได้บอกว่าอยากให้กลับไปให้คะแนน"}
