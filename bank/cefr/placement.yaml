- id: cefr-pl-0023
  band: c1
  kind: read
  skill: rd
  topic: opinion-article
  level: 3
  title: The Problem with Quick Fixes
  passage: |
    Every few years, a new teaching method arrives with the promise of transforming classrooms almost overnight. Schools invest in training, teachers attend workshops, and for a while the method dominates staff meetings. Yet within a couple of years, many of these initiatives quietly disappear, often before anyone has gathered convincing evidence of whether they worked.

    The difficulty is not that the methods themselves are necessarily flawed. Rather, real change in teaching is slow and depends on conditions that a single workshop cannot provide: time for teachers to experiment, colleagues to discuss setbacks with, and leaders who are willing to wait for results. When these conditions are missing, even a promising idea is likely to be judged a failure prematurely. Perhaps, then, the question schools should ask is not "Which method should we adopt next?" but "What would it take for any method to succeed here?"
  questions:
    - stem: What is the writer's main point?
      choices:
        - {t: Schools drop new methods without giving them support to work., why: "ผู้เขียนบอกว่าปัญหาไม่ใช่ตัววิธีสอน แต่โรงเรียน ==ไม่ได้ให้เวลาและการสนับสนุน== จนเลิกใช้ก่อนเห็นผล"}
        - {t: Most new teaching methods are poorly designed from the start., why: "ผู้เขียนบอกตรง ๆ ว่าวิธีสอนไม่จำเป็นต้องมีข้อบกพร่อง"}
        - {t: Teachers should no longer be sent to training workshops., why: "ผู้เขียนแค่บอกว่าอบรมครั้งเดียวไม่พอ ไม่ได้บอกให้เลิกไปอบรม"}
        - {t: Leaders need to be more careful when choosing new methods., why: "ย่อหน้าสุดท้ายบอกว่าคำถามที่ควรถามไม่ใช่จะเลือกวิธีไหน แต่ต้องมีอะไรถึงจะสำเร็จ"}
  status: draft
