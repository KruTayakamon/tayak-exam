  title: "A Day in the Life of a Baker"
  passage: |
    Lek works in a bakery in Chiang Mai. She gets up very early, at four o'clock in the morning. She makes bread and cakes from five to eleven. The bakery opens at seven.
    In the afternoon, Lek usually sleeps for two hours. Then she buys flour and sugar for the next day. In the evening, she cooks dinner with her husband. She never goes to bed late. She is always in bed by nine.
  questions:
    - stem: "What time does Lek get up?"
      choices:
        - {t: "at four o'clock", why: "She gets up very early, at four o'clock"}
        - {t: "at five o'clock", why: "ห้าโมงเช้าคือเวลาเริ่มทำขนม"}
        - {t: "at seven o'clock", why: "เจ็ดโมงคือเวลาร้านเปิด"}
        - {t: "at nine o'clock", why: "สามทุ่มคือเวลาเข้านอน"}
    - stem: "What does Lek usually do in the afternoon?"
      choices:
        - {t: "she sleeps", why: "In the afternoon, Lek usually sleeps for two hours"}
        - {t: "she makes cakes", why: "ทำขนมตอนเช้า จึงใช้ไม่ได้"}
        - {t: "she cooks dinner", why: "ทำอาหารเย็นตอนเย็น"}
        - {t: "she opens the bakery", why: "ร้านเปิดเจ็ดโมงเช้า"}
    - stem: "Who does Lek have dinner with?"
      choices:
        - {t: "her husband", why: "she cooks dinner with her husband"}
        - {t: "her children", why: "ในบทไม่ได้พูดถึงลูก"}
        - {t: "her friends", why: "ในบทไม่ได้พูดถึงเพื่อน"}
        - {t: "her customers", why: "ในบทไม่ได้พูดเช่นนั้น"}
