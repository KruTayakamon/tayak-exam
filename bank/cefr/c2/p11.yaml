- id: cefr-c2-w11-058
  kind: read
  skill: rd
  topic: two-texts
  level: 2
  pool: true
  title: "Two Views on Four-Day Working Weeks"
  passage: |
    Text A (a business owner): "When we moved to a four-day week, I expected productivity to fall. Instead, staff finished the same work in less time, and sick days dropped by a third. Our customers noticed no difference."

    Text B (an economist): "Small trials are encouraging, but we should not extrapolate too quickly. Most trials have involved office-based companies that chose to take part. Hospitals, factories and schools face very different constraints. A nurse cannot simply see patients faster."

    Both writers accept that the four-day week can work in some settings. Where they differ is in how widely they think it can be applied.
  questions:
    - stem: "What happened in the business owner's company?"
      choices:
        - {t: "productivity stayed the same with fewer days", why: "staff finished the same work in less time"}
        - {t: "customers complained", why: "ลูกค้าไม่เห็นความต่าง"}
        - {t: "sick days increased", why: "ลดลงหนึ่งในสาม จึงใช้ไม่ได้"}
        - {t: "staff had to work longer hours each day than before", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "What is the economist's main caution?"
      choices:
        - {t: "results may not apply to all jobs", why: "Hospitals, factories and schools face very different constraints"}
        - {t: "the trials were too long", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "office workers are lazy", why: "ในบทไม่ได้พูดเช่นนั้น (office workers are lazy)"}
        - {t: "nurses already work four-day weeks in most hospitals", why: "ในบทไม่ได้พูดเช่นนั้น (nurses already work four-day weeks in most hospitals)"}
    - stem: "On what do the two writers agree?"
      choices:
        - {t: "it can work in some workplaces", why: "Both writers accept that the four-day week can work in some settings"}
        - {t: "it should be compulsory everywhere", why: "ไม่ได้เห็นพ้องเช่นนั้น"}
        - {t: "it reduces customer satisfaction", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "it is suitable for hospitals, factories and schools", why: "นักเศรษฐศาสตร์บอกว่าอาจไม่เหมาะ"}
  status: approved
