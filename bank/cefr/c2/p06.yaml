- id: cefr-c2-w06-058
  kind: read
  skill: rd
  topic: formal-correspondence
  level: 2
  pool: true
  title: "Letter: Response to the Proposed Merger"
  passage: |
    Dear Dr Wanchai,

    Thank you for your letter of 3 May outlining the proposed merger of our two departments. I concur that closer cooperation would benefit our students, and I appreciate the care with which the plan has been prepared.

    I must, however, respectfully demur on one point. The proposal suggests that the combined department would be led from your campus. With deference to your experience, I am not entirely convinced that this arrangement would serve students on our campus, who would lose access to senior staff.

    Might I suggest that leadership be shared for an initial period of two years? I would be glad to discuss this further at your convenience.

    Yours sincerely,
    Dr Rattana Phuong
  questions:
    - stem: "What does Dr Rattana agree with?"
      choices:
        - {t: "that cooperation would help students", why: "I concur that closer cooperation would benefit our students"}
        - {t: "that leadership should be on one campus", why: "เธอแย้งข้อนี้ จึงใช้ไม่ได้"}
        - {t: "that the merger should be cancelled immediately", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "that the plan was badly prepared", why: "เธอชมการเตรียมแผน"}
    - stem: "What is her main concern?"
      choices:
        - {t: "students on her campus losing access to senior staff", why: "who would lose access to senior staff"}
        - {t: "the cost of the merger", why: "ในบทไม่ได้พูดถึง"}
        - {t: "Dr Wanchai's experience", why: "เธอให้ความเคารพประสบการณ์"}
        - {t: "the date of the letter", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "What does she propose?"
      choices:
        - {t: "shared leadership for two years", why: "leadership be shared for an initial period of two years"}
        - {t: "ending the discussion", why: "เธอยินดีคุยต่อ จึงใช้ไม่ได้"}
        - {t: "moving all staff to her campus", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "delaying the merger by ten years or more", why: "ในบทไม่ได้พูดถึง"}
  status: approved
