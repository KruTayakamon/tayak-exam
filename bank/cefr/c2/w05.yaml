# ---------- วันที่ 4 · อ่านบทความยาวที่ย่อหน้าถูกสลับและฟังการอภิปราย ----------
- id: cefr-c2-w05-035
  kind: read
  skill: rd
  topic: paragraph-order
  level: 3
  title: "The Four-Paragraph Puzzle · Why Do We Queue?"
  passage: |
    The paragraphs below come from an article about queuing. They are in the correct order, but read them closely and notice how each one is tied to the last.

    [A] Few social rituals reveal as much about a culture as the humble queue. Whether at a bus stop in Bangkok, a bakery in Paris or a post office in London, the way people wait in line tells us how they think about fairness, time and one another.

    [B] Underlying almost every queue is a single principle, namely "first come, first served". This principle is so widely accepted that we rarely question it. Yet it is not, per se, the only fair system. Hospitals, for instance, see patients according to need rather than arrival time, and few people would wish it otherwise.

    [C] Such exceptions highlight an important point: what counts as fair depends on what is being distributed. When the resource is urgent medical care, need takes priority; when it is a seat on a bus, arrival time seems the obvious rule. Problems arise chiefly when the two principles collide, as when an elderly passenger arrives last but needs a seat most.

    [D] It is in these moments of collision that the unwritten rules of a society become visible. Some cultures expect the young to give up their seats; others leave it to individual conscience. Conversely, attempts to formalise such rules, through signs or announcements, are often resented as an intrusion into what people regard as a private judgement. The aforementioned bus stop, then, is not merely a place to wait. It is a small daily test of how a community balances rules against kindness.
  questions:
    - stem: Which phrase in [C] refers back to the example in [B]?
      choices:
        - {t: Such exceptions, why: "Such exceptions อ้างถึง ++ตัวอย่างโรงพยาบาล++ ที่ไม่ใช้หลักมาก่อนได้ก่อน"}
        - {t: an important point, why: "เป็นสิ่งที่จะอธิบายต่อ ไม่ได้อ้างย้อน"}
        - {t: the resource, why: "เป็นคำทั่วไป จึงใช้ไม่ได้"}
        - {t: the two principles, why: "อ้างถึงหลักการทั้งสอง ไม่ใช่ตัวอย่าง"}
    - stem: What does "per se" in [B] suggest about "first come, first served"?
      choices:
        - {t: it is not automatically the fairest system in itself, why: "per se = ++โดยตัวมันเอง++ ไม่ได้ยุติธรรมโดยอัตโนมัติ"}
        - {t: it is the only fair system, why: "ผู้เขียนแย้งข้อนี้"}
        - {t: it is used only in hospitals, why: "โรงพยาบาลใช้หลักอื่น"}
        - {t: it is never fair, why: "ไม่ได้บอกว่าไม่ยุติธรรมเลย"}
    - stem: According to [C], when do problems with queues mainly arise?
      choices:
        - {t: when arrival time and need conflict, why: "Problems arise chiefly when the two principles collide"}
        - {t: when queues are too long, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: when hospitals are busy, why: "ไม่ใช่ประเด็น จึงใช้ไม่ได้"}
        - {t: when buses are late, why: "บทไม่ได้พูดว่า when buses are late"}
    - stem: What does "The aforementioned bus stop" in [D] show about the article's structure?
      choices:
        - {t: it links the ending back to the opening paragraph, why: "ป้ายรถเมล์พูดถึงครั้งแรกใน [A] ++ผูกตอนจบกับตอนต้น++"}
        - {t: it introduces a new example, why: "เคยพูดถึงแล้ว จึงใช้ไม่ได้"}
        - {t: it shows the article is incomplete, why: "ไม่ใช่ จึงใช้ไม่ได้"}
        - {t: "it refers to a bus stop in [C]", why: "[C] พูดถึงที่นั่งบนรถ ไม่ใช่ป้ายรถเมล์"}
  status: approved
