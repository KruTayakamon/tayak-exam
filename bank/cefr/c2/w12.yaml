# ---------- วันที่ 4 · อ่านบทความวิชาการยาวและฟังปนกัน ----------
- id: cefr-c2-w12-035
  kind: read
  skill: rd
  topic: long-academic
  level: 3
  title: "The Calibre Question: What Really Makes a Good Teacher?"
  passage: |
    Few questions in education are asked as often, or answered as confidently, as what makes a good teacher. Politicians point to qualifications, parents to warmth, and inspectors to measurable attainment. Each answer captures something; none, on its own, is sufficient.

    The case for qualifications seems obvious. A teacher who does not understand algebra can hardly teach it well. Yet research consistently suggests that, beyond a basic threshold, subject knowledge predicts surprisingly little about classroom success. A teacher with a doctorate is not, by virtue of that alone, more effective than one with a bachelor's degree. What appears to matter more is pedagogical knowledge: knowing how pupils typically misunderstand an idea, and how to address that misunderstanding before it hardens.

    Warmth, too, is frequently cited, and with good reason. Pupils who feel respected are more likely to take intellectual risks. But warmth without high expectations can quietly become low expectations. Some of the most effective teachers in recent studies were described by their pupils not as "nice" but as "fair" and "demanding", a combination that is harder to achieve than either quality alone.

    Perhaps the least discussed factor is tenacity. Good teachers, it seems, are not those who never fail, but those who keep adjusting when a lesson does not work. They treat a confused class not as evidence of weak pupils but as information about their own teaching. This disposition is difficult to measure, which may explain why it rarely appears in hiring criteria or accreditation standards.

    None of this means that qualifications, warmth or results are irrelevant. The point is rather that teaching quality emerges from the interaction of several qualities, and that any system which rewards only one of them is likely to produce teachers of a narrower calibre than it intends.
  questions:
    - stem: What is the writer's main argument?
      choices:
        - {t: good teaching depends on several qualities working together, why: "teaching quality emerges from the interaction of several qualities"}
        - {t: qualifications are the single most important factor, why: "ผู้เขียนแย้งข้อนี้"}
        - {t: warmth matters more than every other quality, why: "ผู้เขียนเตือนเรื่อง warmth ที่ไม่มีความคาดหวัง"}
        - {t: teaching quality simply cannot be discussed, why: "ไม่ใช่ข้อโต้แย้งของผู้เขียน"}
    - stem: According to the passage, what matters more than advanced subject knowledge?
      choices:
        - {t: knowing how pupils typically misunderstand ideas, why: "pedagogical knowledge: knowing how pupils typically misunderstand an idea"}
        - {t: having a doctorate in the subject being taught, why: "ไม่ได้ทำให้มีประสิทธิภาพมากขึ้นโดยอัตโนมัติ"}
        - {t: being described by pupils as very nice, why: "นักเรียนบรรยายว่า fair และ demanding"}
        - {t: receiving high remuneration from the school, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: What danger does the writer associate with warmth?
      choices:
        - {t: it can turn into low expectations, why: "warmth without high expectations can quietly become low expectations"}
        - {t: it makes pupils less respectful of teachers, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: it prevents pupils from taking any risks, why: "บทไม่ได้พูดว่า it prevents pupils from taking any risks"}
        - {t: it is impossible to combine with knowledge, why: "ไม่ได้พูดแบบนั้น"}
    - stem: Why might tenacity rarely appear in hiring criteria?
      choices:
        - {t: it is difficult to measure, why: "This disposition is difficult to measure"}
        - {t: it is not linked to good teaching at all, why: "ผู้เขียนบอกว่าสำคัญ"}
        - {t: most teachers already have far too much of it, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: inspectors believe it is harmful to pupils, why: "บทไม่ได้พูดว่า inspectors believe it is harmful to pupils"}
  status: approved
