- id: cefr-c2-w10-058
  kind: read
  skill: rd
  topic: ironic-argument
  level: 2
  pool: true
  title: "In Praise of Endless Meetings"
  passage: |
    What would we do without meetings? Without them, we might be forced to make decisions quickly, or, worse, actually do the work we discussed.

    Consider the weekly planning meeting. In two hours, a dozen people can agree to hold another meeting to plan the planning. It is a triumph of efficiency, if efficiency means using as much time as possible.

    Of course, critics will say that most meetings could be replaced by a short email. These people clearly underestimate the joy of watching a colleague share their screen for ten minutes while searching for the right file.

    Perhaps, though, there is a modest solution: before calling a meeting, ask whether anyone would notice if it were cancelled. If the answer is no, we might all get some work done.
  questions:
    - stem: "What is the writer's real view of meetings?"
      choices:
        - {t: "many are a waste of time", why: "เป็นบทประชด ชมแบบตรงข้าม"}
        - {t: "they are very efficient", why: "เป็นการประชด จึงใช้ไม่ได้"}
        - {t: "they should be longer", why: "เป็นการประชด จึงใช้ไม่ได้ (they should be longer)"}
        - {t: "they are the best way to make every decision quickly", why: "เป็นการประชด จึงใช้ไม่ได้ (they are the best way to make every decision quickly)"}
    - stem: "Why does the writer mention screen sharing?"
      choices:
        - {t: "to mock a common time-wasting habit", why: "the joy of watching a colleague ... searching for the right file"}
        - {t: "to recommend it", why: "เป็นการประชด จึงใช้ไม่ได้"}
        - {t: "to explain new software", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "to praise colleagues who are good at technology", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What does the writer actually suggest?"
      choices:
        - {t: "cancelling meetings no one would miss", why: "ask whether anyone would notice if it were cancelled"}
        - {t: "holding more planning meetings", why: "เป็นการประชด จึงใช้ไม่ได้"}
        - {t: "banning email", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "making every meeting at least two hours long", why: "เป็นการประชด จึงใช้ไม่ได้ (making every meeting at least two hours long)"}
  status: approved
