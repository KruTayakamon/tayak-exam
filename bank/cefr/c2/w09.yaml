# ---------- วันที่ 4 · อ่านบทวิจารณ์หนังสือและฟังรายการสนทนา ----------
- id: cefr-c2-w09-035
  kind: read
  skill: rd
  topic: book-review
  level: 3
  title: "Review · 'The Quiet Classroom' by Dr Anan Sriwong"
  passage: |
    Few topics in education generate as much heat and as little light as classroom discipline. Into this crowded field steps Dr Anan Sriwong, a former secondary school teacher turned researcher, with a book that is by turns illuminating and frustrating.

    The book's central argument is both simple and persuasive: most behaviour problems, Sriwong contends, are not caused by "difficult" students but by unclear expectations. Drawing on observations from forty classrooms across Thailand, he shows how teachers who explain their rules once, clearly and calmly, spend far less time dealing with disruption than those who repeat them constantly. These chapters are the book's great strength. The case studies are vivid, the analysis is careful, and the practical advice is refreshingly free of jargon.

    It is a pity, then, that the second half loses its way. Having made his case convincingly, Sriwong attempts to extend it into a broader treatise on national education policy, and the prose becomes noticeably more florid. Sentences grow longer, claims grow larger, and the evidence grows thinner. A chapter on teacher training, in particular, relies heavily on anecdote and offers recommendations that, however well intentioned, are unlikely to survive contact with an actual school budget.

    Readers looking for a pithy, practical guide to managing a classroom will find much to admire in the first 150 pages. Those hoping for a rigorous critique of the education system may be disappointed. Had Sriwong resisted the temptation to say everything, he might have written a genuinely important book. As it stands, it is a very good book with a less good one attached.
  questions:
    - stem: What is the reviewer's overall opinion?
      choices:
        - {t: the first half is excellent but the second half is weaker, why: "a very good book with a less good one attached"}
        - {t: the whole book is excellent, why: "ผู้วิจารณ์ติครึ่งหลัง"}
        - {t: the whole book is poor, why: "ชมครึ่งแรกมาก จึงใช้ไม่ได้"}
        - {t: the reviewer did not finish it and will not recommend it, why: "วิจารณ์ทั้งเล่ม"}
    - stem: What is Sriwong's main argument?
      choices:
        - {t: unclear expectations cause most behaviour problems, why: "most behaviour problems ... are caused ... by unclear expectations"}
        - {t: difficult students are the main problem, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: teachers should repeat rules often, why: "ตรงกันข้าม อธิบายครั้งเดียวชัด ๆ ดีกว่า"}
        - {t: classrooms should be completely silent during every lesson, why: "ไม่ใช่ข้อโต้แย้งหลัก"}
    - stem: What happens to the writing style in the second half?
      choices:
        - {t: it becomes more decorative and less evidence-based, why: "prose becomes noticeably more florid ... evidence grows thinner"}
        - {t: it becomes shorter and clearer, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: it uses more case studies, why: "ใช้เรื่องเล่ามากกว่าหลักฐาน"}
        - {t: it becomes more humorous and easier to read than the first half, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: Why does the reviewer doubt the teacher-training recommendations?
      choices:
        - {t: they are probably too expensive to implement, why: "unlikely to survive contact with an actual school budget"}
        - {t: they are too short, why: "ไม่ใช่เหตุผล จึงใช้ไม่ได้"}
        - {t: they copy other books, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: they ignore what students say about their own teachers, why: "บทไม่ได้พูดว่า they ignore students"}
  status: approved
