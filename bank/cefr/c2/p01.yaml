- id: cefr-c2-w01-058
  kind: read
  skill: rd
  topic: philosophy-of-language
  level: 2
  pool: true
  title: "When Words Mean More Than They Say"
  passage: |
    Philosophers have long noted that much of what we communicate is not stated at all. If a colleague asks whether you enjoyed a lecture and you reply, "The chairs were comfortable," you have said nothing false, yet your meaning is unmistakable.

    This gap between what is said and what is meant can be useful. It allows us to criticise politely, to decline without offence and to share understanding with people who know us well. But it also creates risk. In international workplaces, implicit messages are easily construed in ways the speaker never intended.

    Some linguists argue that clarity should always win. Others reply that a language stripped of implication would be not only less polite but also poorer. The truth, as so often, probably lies in knowing one's audience.
  questions:
    - stem: "What does the example about the chairs show?"
      choices:
        - {t: "a reply can imply criticism without stating it", why: "you have said nothing false, yet your meaning is unmistakable"}
        - {t: "the chairs were the best part of the room", why: "เป็นการพูดอ้อม ไม่ใช่ชมเก้าอี้จริง"}
        - {t: "the speaker was lying about the lecture's quality", why: "ผู้พูดไม่ได้พูดเท็จ"}
        - {t: "lectures are usually comfortable", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "What risk is mentioned?"
      choices:
        - {t: "hidden meanings may be misread", why: "implicit messages are easily construed in ways the speaker never intended"}
        - {t: "people become too polite", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "language becomes poorer", why: "เป็นความเห็นของอีกฝ่าย ไม่ใช่ความเสี่ยงที่กล่าว"}
        - {t: "colleagues stop talking", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What is the writer's conclusion?"
      choices:
        - {t: "it depends on who you are talking to", why: "knowing one's audience"}
        - {t: "clarity is always best", why: "เป็นความเห็นของนักภาษาศาสตร์บางคน"}
        - {t: "implication should be avoided", why: "ผู้เขียนไม่ได้สรุปเช่นนั้น"}
        - {t: "philosophers are usually wrong about language", why: "ในบทไม่ได้พูดถึง"}
  status: approved
