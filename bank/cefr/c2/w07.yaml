# ---------- วันที่ 4 · อ่านความเรียงเชิงวรรณศิลป์และฟังเรื่องเล่า ----------
- id: cefr-c2-w07-035
  kind: read
  skill: rd
  topic: literary-essay
  level: 3
  title: "The Inbox and the Garden"
  passage: |
    My grandmother kept a vegetable garden for sixty years. She never once described it as a project, a goal or a challenge. It was simply there, like the weather, demanding a little attention every morning and offering, in return, a basket of beans or a single, slightly lopsided pumpkin. I think of her garden often these days, usually while staring at my inbox.

    The inbox, unlike the garden, never produces anything. It is a field in which every weed you pull is instantly replaced by two more, a place where the harvest is always next week. We speak of "clearing" it, as if it were a forest, and of "drowning" in it, as if it were the sea. These are not idle metaphors. They reveal how we feel about work: something to be fought, survived, escaped.

    My grandmother would have found this baffling. Her work had a shape. It began when the sun came up and ended when the light failed. It had seasons, and in winter the garden rested, and so did she. The great paradox of modern work is that we have more tools for saving time than any generation in history, and less time than almost any of them.

    I am not suggesting that we should all abandon our desks and take up farming; the romantic image of rural life has always been more hackneyed than accurate, and my grandmother's back ached for most of her adult life. But there is something worth noticing in the language we choose. A garden is tended. An inbox is managed. One word suggests care, the other control.

    Perhaps the answer is not fewer emails but a different relationship with them: to accept that, like weeds, they will always return, and to measure a day not by how much we have cleared but by what we have grown.
  questions:
    - stem: How does the writer contrast the garden and the inbox?
      choices:
        - {t: the garden produced results while the inbox never ends, why: "The inbox, unlike the garden, never produces anything ... harvest is always next week"}
        - {t: both are equally rewarding ways of spending your time, why: "ผู้เขียนเปรียบให้เห็นความต่าง"}
        - {t: the inbox is easier to manage, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: the garden caused more stress, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
    - stem: Why does the writer mention words like "clearing" and "drowning"?
      choices:
        - {t: to show they reveal negative attitudes to work, why: "They reveal how we feel about work: something to be fought, survived, escaped"}
        - {t: to describe a real forest and sea near the writer's home, why: "เป็นอุปลักษณ์ จึงใช้ไม่ได้"}
        - {t: to criticise grammar mistakes, why: "ไม่ใช่ประเด็น จึงใช้ไม่ได้"}
        - {t: to praise modern technology, why: "บทไม่ได้พูดว่า to praise modern technology"}
    - stem: Does the writer believe rural life was ideal?
      choices:
        - {t: "No; the writer admits it was romanticised and hard.", why: "more hackneyed than accurate, and my grandmother's back ached"}
        - {t: "Yes; it was a perfect and peaceful way of life.", why: "ผู้เขียนยอมรับว่าชีวิตชนบทลำบาก"}
        - {t: "The writer never mentions rural life at all.", why: "พูดถึงในย่อหน้า 4"}
        - {t: "Yes; everyone should leave the city and become a farmer.", why: "I am not suggesting that we should all abandon our desks"}
    - stem: What does the final paragraph suggest?
      choices:
        - {t: we should change how we judge a productive day, why: "measure a day not by how much we have cleared but by what we have grown"}
        - {t: we should stop using email, why: "Perhaps the answer is not fewer emails"}
        - {t: we should plant vegetables at work, why: "ไม่ใช่ความหมายตามตัวอักษร"}
        - {t: we should work longer hours to keep up with our email, why: "ไม่ใช่ความหมาย จึงใช้ไม่ได้"}
