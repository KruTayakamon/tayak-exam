# ---------- วันที่ 4 · อ่านบทความโต้แย้งที่มีน้ำเสียงประชดและฟังโต้วาที ----------
- id: cefr-c2-w10-035
  kind: read
  skill: rd
  topic: ironic-argument
  level: 3
  title: "In Praise of the Eight-Hour Meeting"
  passage: |
    It has become fashionable to complain about meetings. Productivity experts deride them, management books disparage them, and office workers lament the hours they lose to them. I would like to offer a humble defence.

    Consider the alternative. Without meetings, employees might be forced to make decisions on their own, using nothing more than information, experience and judgement. They might finish projects early, leaving them with the alarming prospect of free time. Worse still, they might discover that much of their work could be done by email in a fraction of the time, a realisation that would surely undermine morale.

    Meetings also serve an important social function. Where else can twelve people gather to watch one person share their screen? Where else can a manager demonstrate leadership by asking whether everyone can see the slides? The three-hour budget meeting, in particular, should be lauded as a triumph of human endurance, a modern ritual in which colleagues bond over their shared inability to remember why they came.

    Critics will point to research suggesting that most meetings could be shorter, smaller or cancelled altogether. Such studies are, of course, easy to dismiss: they were conducted by people who clearly had time to do research, which suggests they were not attending enough meetings.

    In the end, the case for meetings is simple. They allow organisations to feel busy without the inconvenience of being productive. And if that is not worth an eight-hour session with a short break for lunch, I do not know what is.
  questions:
    - stem: What is the writer's real opinion of meetings?
      choices:
        - {t: most meetings waste time, why: "ทั้งบทประชด ++ชมการประชุมเพื่อชี้ว่ามันเสียเวลา++"}
        - {t: meetings should be longer, why: "เป็นสิ่งที่พูดแบบประชด ไม่ใช่ความเห็นจริง"}
        - {t: meetings help people work faster, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: the writer has no clear opinion, why: "จุดยืนชัดเจนผ่านการประชด"}
    - stem: "\"the alarming prospect of free time\" is ironic because ____."
      choices:
        - {t: free time is normally seen as a good thing, why: "เวลาว่างเป็นสิ่งดี ++การเรียกว่าน่ากลัวจึงเป็นการประชด++"}
        - {t: employees fear their managers more than they fear unemployment, why: "ไม่ใช่ประเด็น จึงใช้ไม่ได้"}
        - {t: the writer dislikes holidays, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: free time is illegal at work, why: "ไม่ใช่ความหมาย จึงใช้ไม่ได้"}
    - stem: How does the writer respond to research on meetings?
      choices:
        - {t: with a deliberately absurd argument, why: "ปัดตกงานวิจัยด้วยเหตุผลไร้สาระ ++เพื่อประชด++"}
        - {t: by providing better research from a large international study, why: "ไม่มีงานวิจัยใหม่"}
        - {t: by agreeing seriously, why: "ไม่ได้เห็นด้วยตรง ๆ"}
        - {t: by ignoring it completely, why: "พูดถึงในย่อหน้า 4"}
    - stem: Which logical fallacy does the writer deliberately use in paragraph 4?
      choices:
        - {t: attacking the researchers instead of their findings, why: "ad hominem ++โจมตีนักวิจัยแทนผลวิจัย++"}
        - {t: confusing correlation with causation when discussing meeting length, why: "ไม่ใช่เหตุผลวิบัตินี้"}
        - {t: presenting a false choice, why: "บทไม่ได้พูดว่า presenting a false choice"}
        - {t: relying on a single anecdote, why: "บทไม่ได้พูดว่า relying on a single anecdote"}
  status: draft
