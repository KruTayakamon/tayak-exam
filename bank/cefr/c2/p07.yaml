- id: cefr-c2-w07-058
  kind: read
  skill: rd
  topic: literary-essay
  level: 2
  pool: true
  title: "The Long Commute"
  passage: |
    Every morning at six, the bus to the city is a river of tired faces. We sit in silence, each of us a small island, earphones in, eyes half closed. Nobody speaks, yet we know one another as well as old neighbours: the woman who always eats sticky rice from a banana leaf, the student who sleeps against the window, the old man who waves to the driver as if they were brothers.

    There is a quiet irony in this. We spend two hours a day beside strangers we will never really know, while our own families see us only when we are too tired to talk.

    And yet, on the rare day when the old man is missing, the whole bus seems to notice. Someone asks the driver. Someone else looks at the empty seat. We are not friends, exactly. But we are not nothing to each other, either.
  questions:
    - stem: "What does \"a river of tired faces\" suggest?"
      choices:
        - {t: "a steady flow of weary passengers", why: "ภาษาเปรียบ ผู้โดยสารเหนื่อยไหลมาต่อเนื่อง"}
        - {t: "the bus drives beside a river", why: "ตีความตามตัวอักษร"}
        - {t: "the passengers are crying", why: "ในบทไม่ได้บ่งเช่นนั้น"}
        - {t: "the bus is very clean and comfortable inside", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What is the \"quiet irony\" the writer mentions?"
      choices:
        - {t: "they spend more time with strangers than family", why: "two hours a day beside strangers ... families see us only when we are too tired"}
        - {t: "the bus is always late", why: "ในบทไม่ได้พูดถึง"}
        - {t: "the old man is the driver's brother", why: "เป็นเพียงการเปรียบ as if"}
        - {t: "nobody uses earphones", why: "ความหมายกลับกัน"}
    - stem: "What does the final paragraph show?"
      choices:
        - {t: "the passengers care about each other a little", why: "the whole bus seems to notice"}
        - {t: "the passengers dislike the old man", why: "ความหมายกลับกัน"}
        - {t: "the old man has moved to another city", why: "ในบทไม่ได้บอกเหตุผล"}
        - {t: "the driver stops the bus to look for the missing man", why: "ในบทไม่ได้พูดเช่นนั้น"}
  status: approved
