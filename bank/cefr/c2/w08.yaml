# ---------- วันที่ 4 · อ่านรายงานประจำปีและฟังสัมภาษณ์ ----------
- id: cefr-c2-w08-035
  kind: read
  skill: rd
  topic: annual-report
  level: 3
  title: "Annual Report (Summary) · Open Shelves Foundation"
  passage: |
    Chair's foreword. This has been a year of considerable achievement, tempered by real challenges. Our mobile library programme, launched three years ago in five provinces, now reaches over 40,000 children a month, and independent evaluators have drawn encouraging conclusions about its impact on early reading.

    The programme's success has not come without cost. Rising fuel prices meant that we incurred transport expenses almost 30% above budget, and two of our six vans had to be withdrawn from service in the dry season. We are grateful to the regional transport company that stepped in at short notice to lend us vehicles, an act of generosity that undoubtedly prevented a serious disruption to services.

    Our volunteer network continues to be the foundation's greatest strength. This year, over 600 volunteers gave their time, and we were delighted when the provincial education office conferred its annual community award on three of them. At the same time, we have had to acknowledge a problem we had hitherto underestimated: volunteer retention. Almost half of those who joined last year did not continue beyond six months. In response, we have adopted a new policy of pairing every new volunteer with an experienced mentor, and early signs suggest that this approach is bearing fruit.

    Looking ahead, the board has decided against expanding into new provinces next year. While we recognise that demand far exceeds our current capacity, we believe it would be unwise to grow faster than our funding and volunteer base can sustain. Our priority will instead be to consolidate our existing services, redress the imbalance between urban and rural routes, and build reserves that will allow us to weather future increases in costs.
  questions:
    - stem: What does the chair say about the programme's impact?
      choices:
        - {t: independent evaluators found encouraging results, why: "independent evaluators have drawn encouraging conclusions"}
        - {t: it has not been evaluated yet, why: "มีผู้ประเมินอิสระแล้ว"}
        - {t: it reaches every child in Thailand, why: "ถึงเด็ก 40,000 คนใน 5 จังหวัด"}
        - {t: it has stopped in the dry season, why: "รถหยุด 2 คัน ไม่ใช่ทั้งโครงการ"}
    - stem: Why were transport costs higher than expected?
      choices:
        - {t: fuel became more expensive, why: "Rising fuel prices meant that we incurred transport expenses almost 30% above budget"}
        - {t: they bought six new vans, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: volunteers were paid, why: "บทไม่ได้พูดว่า volunteers were paid"}
        - {t: they expanded to new provinces, why: "ยังไม่ได้ขยาย จึงใช้ไม่ได้"}
    - stem: What problem had the foundation previously underestimated?
      choices:
        - {t: many volunteers leaving within six months, why: "volunteer retention ... did not continue beyond six months"}
        - {t: the number of children reached, why: "ไม่ใช่ปัญหา จึงใช้ไม่ได้"}
        - {t: the cost of books, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: competition from other charities, why: "บทไม่ได้พูดว่า competition from other charities"}
    - stem: Why has the board decided not to expand next year?
      choices:
        - {t: growth must match funding and volunteers, why: "unwise to grow faster than our funding and volunteer base can sustain"}
        - {t: there is no demand in other provinces, why: "demand far exceeds our current capacity"}
        - {t: the government has banned it, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: the mentor scheme has failed, why: "early signs suggest that this approach is bearing fruit"}
