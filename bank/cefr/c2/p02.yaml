- id: cefr-c2-w02-058
  kind: read
  skill: rd
  topic: editorial
  level: 2
  pool: true
  title: "Editorial: A Pivotal Moment for Our Rivers"
  passage: |
    Rarely has a single report galvanised public opinion so quickly. Last week's study, showing plastic levels in our three main rivers had doubled in five years, has become the talk of every market and office.

    What the report underscores is not merely the scale of the problem but its speed. Five years is less than the time it takes most children to finish primary school. Should the trend continue, fishing communities downstream could lose their livelihoods within a decade.

    This is a pivotal moment. Sweeping bans on single-use plastics are not the only answer, but they are a necessary start. What is needed now is not another committee but action: deposit schemes for bottles, support for refill shops and, above all, enforcement of the rules we already have.
  questions:
    - stem: "What does the editorial say about the report's impact?"
      choices:
        - {t: "it quickly changed public opinion", why: "Rarely has a single report galvanised public opinion so quickly"}
        - {t: "it was largely ignored", why: "ความหมายกลับกัน"}
        - {t: "it was published five years ago", why: "เป็นช่วงเวลาที่ศึกษา"}
        - {t: "it was written by fishermen", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "What does the writer find most alarming?"
      choices:
        - {t: "how fast the problem is growing", why: "not merely the scale of the problem but its speed"}
        - {t: "the cost of a committee", why: "ในบทไม่ได้พูดถึงค่าใช้จ่าย"}
        - {t: "children's school results", why: "เป็นเพียงการเปรียบเทียบเวลา"}
        - {t: "the number of markets", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What does the writer call for?"
      choices:
        - {t: "action, including enforcing existing rules", why: "above all, enforcement of the rules we already have"}
        - {t: "a new committee to study the problem further", why: "ผู้เขียนบอกว่าไม่ต้องการคณะกรรมการใหม่"}
        - {t: "closing fishing villages", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "more studies before acting", why: "ความหมายกลับกัน"}
  status: approved
