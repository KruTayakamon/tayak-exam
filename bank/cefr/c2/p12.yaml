- id: cefr-c2-w12-058
  kind: read
  skill: rd
  topic: long-academic
  level: 2
  pool: true
  title: "Rethinking Teacher Pay"
  passage: |
    Debates about teacher remuneration often focus on a single question: are teachers paid enough? The answer, in most countries, is probably no. Yet a narrower focus on salary may miss what research suggests matters equally to teacher retention: working conditions, professional respect and opportunities to grow.

    A survey of teachers who left the profession found that fewer than a third named pay as their main reason. More common were workload, administrative paperwork and a sense that their expertise was not valued. Conversely, teachers who stayed often cited supportive leadership and collaborative colleagues.

    This does not mean that pay is unimportant. Low salaries make it harder to attract candidates of high calibre in the first place. But raising pay without improving conditions risks treating the symptom rather than the cause. A more holistic approach would combine fair remuneration with reduced paperwork and genuine career pathways.
  questions:
    - stem: "What does the survey of teachers who left show?"
      choices:
        - {t: "pay was not the main reason for most", why: "fewer than a third named pay as their main reason"}
        - {t: "pay was the only reason", why: "ความหมายกลับกัน"}
        - {t: "most left because of colleagues", why: "เพื่อนร่วมงานเป็นเหตุให้อยู่ต่อ"}
        - {t: "most left to become head teachers in other larger schools", why: "ในบทไม่ได้พูดถึง"}
    - stem: "Why does the writer say pay still matters?"
      choices:
        - {t: "it affects who joins the profession", why: "Low salaries make it harder to attract candidates of high calibre"}
        - {t: "it is the main cause of leaving", why: "ผู้เขียนบอกว่าไม่ใช่สาเหตุหลัก"}
        - {t: "teachers are paid too much", why: "ความหมายกลับกัน"}
        - {t: "it reduces paperwork", why: "ไม่เกี่ยวกัน จึงใช้ไม่ได้"}
    - stem: "What does the writer recommend?"
      choices:
        - {t: "combining pay with better conditions", why: "combine fair remuneration with reduced paperwork and genuine career pathways"}
        - {t: "raising pay only", why: "ผู้เขียนเตือนว่าไม่พอ"}
        - {t: "cutting salaries", why: "ความหมายกลับกัน"}
        - {t: "hiring more administrative staff to do all the paperwork for teachers", why: "ในบทไม่ได้พูดถึง"}
  status: approved
