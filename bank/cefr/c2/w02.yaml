# ---------- วันที่ 4 · อ่านบทบรรณาธิการและฟังสุนทรพจน์ ----------
- id: cefr-c2-w02-035
  kind: read
  skill: rd
  topic: editorial
  level: 3
  title: "Editorial · The Library Is Not a Luxury"
  passage: |
    Last week the city council announced, with remarkably little discussion, that three of the city's seven public libraries will close at the end of the year. The reason given was cost. What the council did not say, and perhaps did not consider, is who will pay the real price.

    Libraries are often treated as a pleasant extra, the kind of service that can be trimmed when budgets are tight. Nothing could be further from the truth. For a child whose home has no books, the library is not a luxury but a lifeline. For an elderly resident living alone, it may be the only place where a conversation is guaranteed. For a job seeker without a computer, it is the office from which applications are sent. Close the library, and these people do not simply find an alternative. Many of them simply go without.

    The council argues that most information is now available online. This is true, but it misses the point. Access to information has never been the library's only purpose. Equally important are the librarian who helps a confused pensioner fill in a form, the quiet desk where a teenager can study away from a crowded flat, and the sense that a public space belongs to everyone, regardless of income.

    Such is the importance of these services that cities which have closed libraries have frequently been forced to reopen them, at greater cost, within a decade. Rarely does a saving look so expensive in hindsight.

    The council still has time to reconsider. It should begin by asking those who use the libraries, not those who never set foot in them, what would be lost. If it does, we suspect the answer will galvanise far more support than the council expects.
  questions:
    - stem: What is the main purpose of the editorial?
      choices:
        - {t: to persuade the council to reconsider closing libraries, why: "The council still has time to reconsider"}
        - {t: to report the council's decision neutrally, why: "เป็นบทบรรณาธิการแสดงจุดยืนชัดเจน"}
        - {t: to argue that libraries should move online, why: "ผู้เขียนแย้งข้อนี้"}
        - {t: to criticise librarians, why: "ผู้เขียนชื่นชมบรรณารักษ์"}
    - stem: Why does the writer list a child, an elderly resident and a job seeker?
      choices:
        - {t: to show how different groups depend on libraries, why: "แต่ละกลุ่มใช้ห้องสมุดในบทบาทต่างกัน"}
        - {t: to show who uses computers most, why: "ไม่ใช่ประเด็น จึงใช้ไม่ได้"}
        - {t: to explain how libraries are funded, why: "ไม่เกี่ยวกับงบ จึงใช้ไม่ได้"}
        - {t: to suggest these groups should pay fees, why: "ไม่มีข้อเสนอนี้"}
    - stem: How does the writer respond to the argument that information is available online?
      choices:
        - {t: accepts it but says it ignores the library's other roles, why: "This is true, but it misses the point"}
        - {t: rejects it as completely false, why: "ยอมรับว่าจริง จึงใช้ไม่ได้"}
        - {t: agrees that libraries are no longer needed, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: does not respond to it, why: "ตอบในย่อหน้า 3 จึงใช้ไม่ได้"}
    - stem: "\"Rarely does a saving look so expensive in hindsight\" suggests that closing libraries ____."
      choices:
        - {t: often ends up costing more in the long run, why: "ปิดแล้วต้องเปิดใหม่แพงกว่า ภายในสิบปี"}
        - {t: rarely saves any money at first, why: "ไม่ได้พูดถึงช่วงแรก"}
        - {t: is always reversed within a year, why: "within a decade ไม่ใช่หนึ่งปี"}
        - {t: is popular with most residents, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
  status: approved
