# ---------- วันที่ 4 · อ่านบทคัดย่องานวิจัยและฟังการนำเสนอ ----------
- id: cefr-c2-w04-035
  kind: read
  skill: rd
  topic: research-abstract
  level: 3
  title: "Abstract and Introduction · Reading Habits and Screen Use among Thai Adults (fictional study)"
  passage: |
    Abstract. The proliferation of smartphones over the past decade has raised concerns about the erosion of sustained reading among adults. This study investigated the relationship between daily screen time and the frequency of extended reading (defined as reading a single text for at least twenty minutes) among 1,200 Thai adults aged 25 to 60. Data were collected through an online survey and a two-week reading diary. Contrary to expectations, no simple negative relationship was found. Participants with high screen use read as often as those with low screen use; however, their reading sessions were significantly shorter, and a greater proportion of their reading took place on phones rather than in print. The findings suggest that screen use may be reshaping, rather than replacing, reading habits. Implications for public library services and adult education are discussed.

    Introduction. Since the inception of the smartphone, commentators have predicted the decline of the book. Much of this commentary, however, rests on anecdote rather than evidence. Previous research, mostly conducted in Europe and North America, has produced mixed results: some studies report a fall in reading time, while others find that digital reading has simply increased the total amount of text people consume. Little is known about adult readers in Southeast Asia, where patterns of phone use and access to printed books differ considerably. The present study addresses this gap. A secondary aim is to examine whether the shift to shorter reading sessions is a manifestation of reduced attention or a corollary of the way digital texts are designed, an issue with clear ramifications for how libraries and educators support adult learners.
  questions:
    - stem: What was the main finding of the study?
      choices:
        - {t: heavy screen users read as often but in shorter sessions, why: "read as often ... however, their reading sessions were significantly shorter"}
        - {t: heavy screen users read much less often, why: "Contrary to expectations, no simple negative relationship was found"}
        - {t: nobody reads printed books anymore, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: smartphones improve concentration, why: "บทไม่ได้พูดว่า smartphones improve concentration"}
    - stem: What does "reshaping, rather than replacing" suggest?
      choices:
        - {t: reading is changing form but has not disappeared, why: "reshaping = เปลี่ยนรูปแบบ · not replacing = ไม่ได้หายไป"}
        - {t: screens have completely replaced reading, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: reading has stayed exactly the same, why: "เวลาอ่านต่อครั้งสั้นลง"}
        - {t: libraries should close, why: "ไม่มีข้อเสนอนี้"}
    - stem: Why did the researchers focus on Southeast Asia?
      choices:
        - {t: little previous research had looked at this region, why: "Little is known about adult readers in Southeast Asia ... addresses this gap"}
        - {t: phone use is identical everywhere, why: "ตรงกันข้าม ต่างกันมาก"}
        - {t: European studies were all positive, why: "ผลวิจัยเดิมผสมกัน"}
        - {t: books are cheaper there, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: What is the study's secondary aim?
      choices:
        - {t: to find out why reading sessions are shorter, why: "whether the shift ... is a manifestation of reduced attention or a corollary of the way digital texts are designed"}
        - {t: to count how many books people own, why: "ไม่ใช่จุดประสงค์"}
        - {t: to design a new reading app, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: to compare men and women, why: "บทไม่ได้พูดว่า to compare men and women"}
  status: approved
