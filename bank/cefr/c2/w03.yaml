# ---------- วันที่ 4 · อ่านข้อตกลงความร่วมมือและฟังการเจรจา ----------
- id: cefr-c2-w03-035
  kind: read
  skill: rd
  topic: agreement-text
  level: 3
  title: "Memorandum of Understanding (Summary) · Shared Language Centre"
  passage: |
    1. Purpose. This memorandum sets out the terms on which Northbridge University and the Riverside Community College (hereafter "the Parties") will jointly operate a language centre in the Old Market district. It replaces all agreements hitherto made between the Parties on this matter.

    2. Responsibilities. Northbridge shall provide qualified teaching staff and course materials. Riverside shall provide the building, including heating, cleaning and security, and shall be responsible for the registration of students. Neither Party shall charge the other for services listed in this section.

    3. Funding. Each Party shall contribute fifty per cent of the centre's annual running costs, with the proviso that Riverside's contribution may be reduced by the value of the building, as agreed by an independent assessor. Any additional funding obtained by either Party shall be shared equally.

    4. Duration and termination. This memorandum shall take effect from 1 August and remain in force for three years. Should either Party wish to withdraw, it shall give not less than six months' written notice. In the event of a serious breach of these terms, the other Party may end the agreement forthwith.

    5. Disputes. Any disagreement shall first be referred to a joint committee. Only if the committee fails to reach a decision within sixty days shall the matter be referred to independent mediation. Both Parties agree to abide by the mediator's decision.

    6. Scope. Matters relating to staff employment fall outside the remit of this memorandum and remain the responsibility of the employing institution.
  questions:
    - stem: Which responsibility belongs to Riverside?
      choices:
        - {t: registering students, why: "Riverside shall ... be responsible for the registration of students"}
        - {t: providing teaching staff, why: "เป็นหน้าที่ของ Northbridge"}
        - {t: writing course materials, why: "บทไม่ได้พูดว่า writing course materials"}
        - {t: employing all staff, why: "ข้อ 6 อยู่นอกขอบเขตข้อตกลง"}
    - stem: Under what condition may Riverside pay less than half the costs?
      choices:
        - {t: if the building's value is deducted after assessment, why: "may be reduced by the value of the building, as agreed by an independent assessor"}
        - {t: if it has fewer students, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: if Northbridge agrees verbally, why: "ต้องมีผู้ประเมินอิสระ"}
        - {t: if it gives six months' notice, why: "การแจ้งล่วงหน้าเกี่ยวกับการถอนตัว"}
    - stem: When can the agreement be ended immediately?
      choices:
        - {t: after a serious breach of the terms, why: "In the event of a serious breach ... forthwith"}
        - {t: at any time with written notice, why: "ต้องแจ้งล่วงหน้าหกเดือน"}
        - {t: after one year, why: "มีผลสามปี จึงใช้ไม่ได้"}
        - {t: if the committee meets, why: "คณะกรรมการใช้กับข้อพิพาท"}
    - stem: When does a dispute go to mediation?
      choices:
        - {t: only if the committee cannot decide within sixty days, why: "Only if the committee fails to reach a decision within sixty days"}
        - {t: immediately, why: "ต้องผ่านคณะกรรมการก่อน"}
        - {t: when either party wishes, why: "มีขั้นตอนก่อน จึงใช้ไม่ได้"}
        - {t: never, why: "มีขั้นตอนไกล่เกลี่ย"}
  status: approved
