- id: cefr-c2-w04-058
  kind: read
  skill: rd
  topic: research-abstract
  level: 2
  pool: true
  title: "Abstract (Fictional): Teacher Attrition in Rural Thailand"
  passage: |
    This study examines the causes of teacher attrition in 42 rural schools between 2018 and 2023. Data were drawn from employment records and interviews with 120 current and former teachers.

    The findings indicate that attrition was highest in the first three years of service, with nearly one in four new teachers leaving their post. Isolation and limited professional development emerged as more significant factors than salary. Teachers who had a mentor during their first year were considerably less likely to leave.

    The study concludes that mentoring should be treated not as an optional extra but as a prerequisite for sustainable staffing. Further research is needed to establish whether online mentoring can achieve similar results in very remote areas.
  questions:
    - stem: "When were teachers most likely to leave?"
      choices:
        - {t: "in their first three years", why: "attrition was highest in the first three years of service"}
        - {t: "after ten years", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "just before retirement", why: "ในบทไม่ได้พูดถึง"}
        - {t: "in 2023 only", why: "ปี 2023 คือจุดสิ้นสุดของการศึกษา"}
    - stem: "Which factor mattered more than salary?"
      choices:
        - {t: "isolation and lack of training", why: "Isolation and limited professional development"}
        - {t: "the size of the school", why: "ในบทไม่ได้พูดถึง"}
        - {t: "the length of the holidays", why: "ในบทไม่ได้พูดถึง (the length of the holidays)"}
        - {t: "the number of students per class", why: "ในบทไม่ได้พูดถึง (the number of students per class)"}
    - stem: "What remains unknown?"
      choices:
        - {t: "whether online mentoring works as well", why: "Further research is needed ... online mentoring"}
        - {t: "whether mentoring helps at all", why: "การศึกษาพบว่าช่วยได้"}
        - {t: "why salary is important", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "how many schools took part", why: "ระบุแล้ว 42 โรงเรียน"}
  status: approved
