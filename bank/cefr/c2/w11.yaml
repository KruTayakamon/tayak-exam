# ---------- วันที่ 4 · อ่านสองบทที่เห็นต่างและฟังบรรยายสองช่วง ----------
- id: cefr-c2-w11-035
  kind: read
  skill: rd
  topic: two-texts
  level: 3
  title: "Two Views on the Four-Day School Week"
  passage: |
    Text A · "A Week That Works"

    When three rural districts in northern Thailand moved to a four-day school week two years ago, sceptics predicted chaos. They were wrong. Teacher absence fell by a third, and the districts saved around 8% of their transport budgets. Most importantly, test scores remained stable. Teachers report using the fifth day for planning and professional training, and many say they feel less exhausted. While it would be premature to extrapolate these results to every school, the evidence so far suggests that the shorter week is not only affordable but also popular with staff.

    Text B · "The Hidden Cost of Shorter Weeks"

    The four-day school week has been widely praised, but much of the enthusiasm rests on specious reasoning. Stable test scores are not the same as stable learning; scores in the trial districts were already low and had little room to fall. More seriously, supporters tend to conflate the interests of teachers with those of children. For working parents, the fifth day means finding and paying for childcare, and the burden falls hardest on the poorest families. One survey found that a quarter of younger pupils spent the extra day at home alone. Until these concerns are substantiated or refuted by proper research, policymakers should be cautious about expanding the scheme.
  questions:
    - stem: On which point do both texts appear to agree?
      choices:
        - {t: test scores did not fall during the trial, why: "A: scores remained stable · B ยอมรับว่าคะแนนคงที่แต่ตีความต่าง"}
        - {t: the scheme should be expanded nationwide immediately, why: "ทั้งสองไม่ได้เสนอแบบนั้น"}
        - {t: parents are delighted with the extra day at home, why: "B แย้งข้อนี้ จึงใช้ไม่ได้"}
        - {t: teachers dislike the shorter school week, why: "A บอกว่าครูชอบ จึงใช้ไม่ได้"}
    - stem: Why does Text B say stable test scores may be misleading?
      choices:
        - {t: scores were already low and had little room to fall, why: "scores ... were already low and had little room to fall"}
        - {t: the tests were made easier during the trial, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: teachers helped students cheat in the tests, why: "บทไม่ได้พูดว่า teachers helped students cheat in the tests"}
        - {t: "only a few students in each district took the final tests", why: "บทไม่ได้พูดว่า only a few students took the final tests"}
    - stem: What does Text B mean by "conflate the interests of teachers with those of children"?
      choices:
        - {t: assume that what helps teachers also helps children, why: "conflate ++เอามาปนว่าเป็นเรื่องเดียวกัน++"}
        - {t: argue that teachers and children dislike each other, why: "ไม่ใช่ความหมาย จึงใช้ไม่ได้"}
        - {t: ignore teachers completely in the whole discussion, why: "บทไม่ได้พูดว่า ignore teachers completely in the whole discussion"}
        - {t: claim that children should teach themselves at home, why: "บทไม่ได้พูดว่า claim that children should teach themselves at home"}
    - stem: How does Text A treat its own conclusions?
      choices:
        - {t: "cautiously, warning against generalising too far", why: "it would be premature to extrapolate these results to every school"}
        - {t: as final proof that the scheme works everywhere, why: "ผู้เขียนเตือนไม่ให้ขยายผล"}
        - {t: with strong doubt about whether teachers benefit, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: by admitting that all of the data are spurious, why: "ไม่ได้ยอมรับแบบนั้น"}
  status: draft
