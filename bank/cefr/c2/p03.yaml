- id: cefr-c2-w03-058
  kind: read
  skill: rd
  topic: agreement-text
  level: 2
  pool: true
  title: "Memorandum of Understanding (Fictional): Lakeview College and Hilltop University"
  passage: |
    1. Purpose. The two institutions agree to cooperate in teacher training for a period of three years, commencing 1 June.
    2. Exchange. Each year, Hilltop University shall host up to ten trainee teachers from Lakeview College, provided that accommodation costs are covered by Lakeview.
    3. Termination. Either party may terminate this agreement with six months' written notice. Notwithstanding the foregoing, the agreement shall terminate forthwith should either party lose its accreditation.
    4. Review. The agreement shall be reviewed at the end of the second year, and any amendments thereof shall be agreed in writing.
  questions:
    - stem: "Who pays for trainees' accommodation?"
      choices:
        - {t: "Lakeview College", why: "provided that accommodation costs are covered by Lakeview"}
        - {t: "Hilltop University", why: "Hilltop เป็นผู้รับ ไม่ได้จ่าย"}
        - {t: "the trainees themselves", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "the government", why: "ในบทไม่ได้พูดถึง"}
    - stem: "When could the agreement end immediately?"
      choices:
        - {t: "if a party loses accreditation", why: "terminate forthwith should either party lose its accreditation"}
        - {t: "after six months' notice", why: "ต้องแจ้งล่วงหน้าหกเดือน ไม่ใช่ทันที"}
        - {t: "at the end of the second year", why: "เป็นเวลาทบทวน ไม่ใช่สิ้นสุด"}
        - {t: "if ten trainees attend", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "How must changes to the agreement be made?"
      choices:
        - {t: "in writing", why: "any amendments thereof shall be agreed in writing"}
        - {t: "by phone", why: "ในบทไม่ได้พูดถึง"}
        - {t: "by the trainees", why: "ในบทไม่ได้พูดถึง (by the trainees)"}
        - {t: "without discussion", why: "ในบทไม่ได้พูดเช่นนั้น"}
  status: approved
