    Dear Residents,

    Further to our letter of 3 March, we write to confirm that work on the replacement of the building's water pipes will commence on Monday 14 April and is expected to continue for approximately six weeks.

    Owing to the nature of the work, it will be necessary to interrupt the water supply to each floor for up to four hours on one day. Residents will be notified of the date for their floor no later than 48 hours in advance. We regret any inconvenience this may cause and would ask that residents who have particular needs, such as those caring for young children or elderly relatives, contact the management office so that alternative arrangements can be made.

    Contrary to rumours circulating in the building, the cost of the work will not be passed on to residents through an increase in the monthly service charge. The project is being funded entirely from the maintenance reserve, which was established precisely for repairs of this kind.

    Finally, we should like to thank those residents who reported leaks over the past year. Without their reports, the extent of the problem might not have been identified until considerably more damage had been done.

    Yours faithfully,
    Building Management
  questions:
