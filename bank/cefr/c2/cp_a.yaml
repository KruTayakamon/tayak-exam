        - {t: to announce a rise in the monthly service charge, why: "ขัดกับ will not be passed on to residents"}
        - {t: to ask residents to report any new leaks, why: "ขอบคุณที่แจ้ง ไม่ได้ขอให้แจ้งใหม่"}
        - {t: to apologise for work that was badly done, why: "งานยังไม่เริ่ม จึงใช้ไม่ได้"}
    - stem: How much notice will residents get before their water is cut off?
      choices:
        - {t: at least two days, why: "no later than 48 hours in advance"}
        - {t: around six weeks, why: "หกสัปดาห์คือระยะเวลางานทั้งหมด"}
        - {t: about four hours, why: "สี่ชั่วโมงคือเวลาที่น้ำไม่ไหล"}
        - {t: none at all, why: "มีการแจ้งล่วงหน้า"}
    - stem: Why does the notice mention the maintenance reserve?
      choices:
        - {t: to correct a false belief about who will pay, why: "Contrary to rumours ... funded entirely from the maintenance reserve"}
        - {t: to ask residents to contribute more money, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
