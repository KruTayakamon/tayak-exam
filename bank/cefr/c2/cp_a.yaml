- id: cefr-c2-cpa-027
  kind: read
  skill: rd
  topic: book-review
  level: 3
  title: "Review · Mastering Time by Dr K. Lim (fictional)"
  passage: |
    There is a particular genre of self-help book that promises to transform your life in thirty days, and Dr Lim's Mastering Time belongs, proudly, to it. Its central insight, that one should do important tasks before unimportant ones, is delivered with the solemnity usually reserved for scientific breakthroughs.

    To be fair, the book is not without merit. The chapter on saying no to unnecessary meetings is genuinely useful, and the author writes clearly, if repetitively. Readers who have never thought about how they spend their working day may find the early chapters an eye-opener.

    The difficulties begin when Dr Lim turns from advice to evidence. We are told that readers who follow the "Lim Method" become "up to 300 per cent more productive", a figure that appears to rest on a survey of the author's own seminar participants. How productivity was measured, and compared with what, is never explained. Elsewhere, the fact that many successful business leaders wake up early is presented as proof that waking up early causes success, a leap that would embarrass a first-year statistics student.

    Perhaps most revealing is the final chapter, in which the author lists the many courses, videos and coaching packages available to readers who wish to "go further". One begins to suspect that the book's real purpose is less to save the reader's time than to fill the author's diary.

    Mastering Time is a short book. It is, however, rather longer than it needs to be.
  questions:
    - stem: What is the reviewer's overall view of the book?
      choices:
        - {t: it has some useful advice but serious weaknesses, why: "not without merit ... The difficulties begin"}
        - {t: it is a scientific breakthrough in its field, why: "ประชด solemnity usually reserved for"}
        - {t: it is entirely useless for every reader, why: "ยอมรับว่าบางบทมีประโยชน์"}
        - {t: it is too short to cover the topic properly, why: "ประโยคท้ายบอกว่ายาวเกินจำเป็น"}
    - stem: What is the reviewer's main criticism of the "300 per cent" figure?
      choices:
        - {t: its basis and method are unclear, why: "How productivity was measured ... is never explained"}
        - {t: it is lower than other studies report, why: "ไม่ได้เทียบกับงานวิจัยอื่น"}
        - {t: it was calculated by a statistics student, why: "นักศึกษาเป็นการเปรียบเทียบ ไม่ใช่ผู้คำนวณ"}
        - {t: it comes from too many participants, why: "ปัญหาคือกลุ่มตัวอย่างเป็นคนของผู้เขียนเอง"}
    - stem: Which reasoning error does the reviewer point out about waking up early?
      choices:
        - {t: treating a correlation as a cause, why: "presented as proof that waking up early causes success"}
        - {t: attacking critics instead of their arguments, why: "ไม่ได้กล่าวถึง จึงใช้ไม่ได้"}
        - {t: offering only two possible choices, why: "ไม่ใช่ false dilemma"}
        - {t: relying too heavily on tradition, why: "ไม่ได้อ้างประเพณี"}
    - stem: What does the final sentence of the review suggest?
      choices:
        - {t: even a short book can waste the reader's time, why: "ประชด short book แต่ยาวเกินจำเป็น"}
        - {t: the reviewer wanted more chapters, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: the book should be read twice, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: the author writes far too quickly, why: "ไม่ได้พูดถึงความเร็วในการเขียน"}
  status: approved
