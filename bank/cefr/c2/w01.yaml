# ---------- วันที่ 4 · อ่านความเรียงเรื่องความกำกวมและฟังบรรยาย ----------
- id: cefr-c2-w01-035
  kind: read
  skill: rd
  topic: philosophy-of-language
  level: 3
  title: "In Praise of Ambiguity"
  passage: |
    We are often told that good writing is clear writing, and that ambiguity is a fault to be eliminated. Legal drafters, engineers and safety inspectors would no doubt agree, and with good reason: a contract that can be construed in two ways is an invitation to litigation, and an equivocal warning on a medicine bottle could be fatal. Yet the assumption that ambiguity is always a defect deserves closer scrutiny.

    Consider ordinary conversation. When a colleague asks whether we "might be free on Thursday", the vagueness is not a failure of language but a courtesy. It allows us to decline without either party losing face. Much of social life runs on such tacit understandings, and a speaker who insisted on unequivocal statements at every turn would quickly be thought pedantic, if not downright rude.

    Ambiguity also does valuable work in diplomacy. Negotiators frequently agree on wording that each side can interpret to its own satisfaction. Critics call this cowardice; supporters argue that it buys time, allowing trust to grow until the issue can be settled more precisely. A treaty that purports to resolve everything at once may well collapse within a year, whereas a deliberately nebulous one might survive long enough to become irrelevant.

    None of this is to suggest that clarity is overrated. The point, rather, is that clarity and ambiguity are tools, and the skilled writer knows when to reach for each. The question to ask is not "Is this ambiguous?" but "Who benefits from the ambiguity, and who bears the risk?" A vague promise from an employer protects the employer; a vague question from a friend protects the person being asked.

    Seen in this light, the demand for absolute precision begins to look less like a principle than a preference, and one that suits some situations far better than others.
  questions:
    - stem: What is the writer's main argument?
      choices:
        - {t: ambiguity can be useful depending on the situation, why: "clarity and ambiguity are tools ... knows when to reach for each"}
        - {t: ambiguity should always be removed, why: "ผู้เขียนตั้งคำถามกับความคิดนี้"}
        - {t: clarity is overrated, why: "None of this is to suggest that clarity is overrated"}
        - {t: diplomats are cowards, why: "เป็นความเห็นของนักวิจารณ์ ไม่ใช่ผู้เขียน"}
    - stem: Why does the writer mention the question about being "free on Thursday"?
      choices:
        - {t: to show vagueness can be a form of politeness, why: "the vagueness is not a failure of language but a courtesy"}
        - {t: to criticise unclear colleagues, why: "ไม่ได้ตำหนิ จึงใช้ไม่ได้"}
        - {t: to show that meetings are badly planned, why: "ไม่ใช่ประเด็น จึงใช้ไม่ได้"}
        - {t: to give an example of a legal problem, why: "เป็นตัวอย่างบทสนทนาทั่วไป"}
    - stem: According to supporters, what is the benefit of vague wording in treaties?
      choices:
        - {t: it gives time for trust to develop, why: "it buys time, allowing trust to grow"}
        - {t: it settles every issue immediately, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: it protects the weaker country, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: it makes treaties cheaper, why: "บทไม่ได้พูดว่า it makes treaties cheaper"}
    - stem: What does the final paragraph imply about demands for absolute precision?
      choices:
        - {t: they reflect a preference rather than a universal rule, why: "less like a principle than a preference"}
        - {t: they are always unreasonable, why: "suits some situations far better than others = บางครั้งเหมาะ"}
        - {t: they are required by law, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: they protect employees, why: "ผู้เขียนยกตัวอย่างคำสัญญาคลุมเครือของนายจ้างแยกต่างหาก"}
  status: draft
