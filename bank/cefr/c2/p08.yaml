- id: cefr-c2-w08-058
  kind: read
  skill: rd
  topic: annual-report
  level: 2
  pool: true
  title: "Annual Report Summary (Fictional): Bright Futures Reading Foundation"
  passage: |
    This year, the Foundation garnered support from over 300 new donors, allowing us to open twelve community libraries in the north-east. Each library is run by trained local volunteers, who are now reaping the benefits of the reading workshops we began two years ago.

    We also faced challenges. Rising transport costs meant that we incurred higher expenses than planned, chiefly in delivering books to remote villages. To redress this, we have begun working with local schools to share delivery routes.

    Looking ahead, our priority is to instil reading habits early. We will therefore focus on children aged three to six, who, research suggests, benefit most from regular story time.
  questions:
    - stem: "What allowed the Foundation to open new libraries?"
      choices:
        - {t: "support from new donors", why: "garnered support from over 300 new donors"}
        - {t: "a government grant for rural education programmes", why: "ในบทไม่ได้พูดถึง"}
        - {t: "selling books", why: "ในบทไม่ได้พูดถึง (selling books)"}
        - {t: "closing older libraries", why: "ในบทไม่ได้พูดถึง (closing older libraries)"}
    - stem: "Why were expenses higher than planned?"
      choices:
        - {t: "transport costs rose", why: "Rising transport costs"}
        - {t: "more volunteers were paid", why: "อาสาสมัครไม่ได้รับเงิน"}
        - {t: "books became more expensive to print and to buy", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "libraries needed repairs", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What is the Foundation's next focus?"
      choices:
        - {t: "very young children", why: "children aged three to six"}
        - {t: "teenagers", why: "ในบทไม่ได้พูดถึง"}
        - {t: "adult literacy classes in the evenings", why: "ในบทไม่ได้พูดถึง (adult literacy classes in the evenings)"}
        - {t: "school teachers", why: "โรงเรียนเป็นพันธมิตรด้านการขนส่ง"}
  status: approved
