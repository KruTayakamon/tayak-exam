      choices:
        - {t: difficult but not without positive signs, why: "challenging ... Even so, there is cause for cautious optimism"}
        - {t: the most successful year in its history, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: a complete disaster with no hope of recovery, why: "มีความหวังอย่างระมัดระวัง"}
        - {t: very similar to the year before, why: "รายได้ลดลง จึงใช้ไม่ได้"}
    - stem: Why did revenue fall less than expected?
      choices:
        - {t: online sales helped to make up the gap, why: "largely thanks to the new online shop"}
        - {t: the heavy rain actually improved the quality of the crops, why: "ฝนทำให้พืชเสียหาย"}
        - {t: the packaging centre opened early, why: "ศูนย์บรรจุยังไม่เปิด"}
        - {t: many members left the cooperative, why: "สมาชิกเพิ่มขึ้น"}
    - stem: What does the chair admit about the packaging centre?
      choices:
        - {t: the board's original timetable was unrealistic, why: "it was overly optimistic in its original timetable"}
        - {t: it was cancelled because of poor sales, why: "ยังไม่ได้ยกเลิก"}
        - {t: the permits were never applied for, why: "ล่าช้าในการได้ใบอนุญาต ไม่ใช่ไม่ได้ยื่น"}
        - {t: it is now fully open and working well, why: "is still not operational"}
