  topic: annual-report
  level: 3
  title: "From the Chair · Green Valley Cooperative Annual Report (fictional)"
  passage: |
    It would be disingenuous to describe the past year as anything other than challenging. Unusually heavy rain in the second quarter damaged a significant proportion of our members' crops, and the resulting fall in supply inevitably affected sales.

    Even so, there is cause for cautious optimism. Revenue, while lower than last year, fell by considerably less than we had feared, largely thanks to the new online shop, which now accounts for almost a quarter of all sales. Membership also grew modestly, suggesting that the cooperative remains attractive to local farmers despite a difficult season.

    Not everything went to plan. The packaging centre, which was due to open in March, is still not operational, owing to delays in obtaining the necessary permits. The board accepts that it was overly optimistic in its original timetable and has since put in place more realistic planning procedures.

    Looking ahead, our priority must be resilience. A cooperative that depends heavily on a single season's weather is, by definition, vulnerable. We will therefore be exploring crop insurance for members and investing in covered growing areas. These measures will not eliminate risk, but they should go some way towards reducing it.

    I should like to thank all members and staff for their patience and commitment in what has been, by any measure, a demanding year.
  questions:
