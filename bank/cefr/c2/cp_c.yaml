# ---------- การอ่าน 2 บท ----------
- id: cefr-c2-cpc-026
  kind: read
  skill: rd
  topic: research-abstract
  level: 1
  title: "Abstract · Short Breaks and Afternoon Concentration (fictional study)"
  passage: |
    This study investigated whether short breaks during the afternoon improve concentration among office workers. Previous research has focused largely on students, and relatively little is known about adults in full-time employment.

    One hundred and twenty office workers in Bangkok took part over four weeks. Half were asked to take a five-minute break away from their screens every hour between one and five p.m.; the other half worked as usual. At the end of each day, all participants completed a short attention task and reported how tired they felt.

    Participants who took regular breaks made, on average, 18 per cent fewer errors on the attention task and reported feeling noticeably less tired. Interestingly, their total amount of completed work did not fall, despite the time spent on breaks.

    These findings suggest that short, regular breaks may help adults maintain concentration in the afternoon without reducing output. However, as all participants worked for the same two companies, further research is needed before the results can be generalised to other workplaces.
  questions:
    - stem: What was the aim of the study?
      choices:
        - {t: to test whether short breaks help afternoon concentration, why: "investigated whether short breaks ... improve concentration"}
        - {t: to compare how students and office workers concentrate, why: "ไม่ได้ศึกษานักเรียน"}
