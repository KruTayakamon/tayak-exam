- id: cefr-c2-w09-058
  kind: read
  skill: rd
  topic: book-review
  level: 2
  pool: true
  title: "Review: \"Teaching in Plain Words\" by Dr Anan T."
  passage: |
    Few books on education manage to be both rigorous and readable. This one comes close. Dr Anan argues that teachers too often hide behind jargon, and he practises what he preaches: his prose is plain, his chapters short and his examples drawn from real classrooms in Thailand and Laos.

    The strongest section deals with feedback. Anan shows that pithy, specific comments ("Your second paragraph needs evidence") help students far more than long, general ones. Teachers will find dozens of usable examples here.

    If the book has a weakness, it is that it occasionally becomes too terse. The chapter on assessment, for instance, raises important questions but answers them in just six pages. A longer treatment would have been welcome. Even so, this is a refreshing and useful critique of how we talk about teaching.
  questions:
    - stem: "What does the reviewer praise about the writing?"
      choices:
        - {t: "it is clear and simple", why: "his prose is plain, his chapters short"}
        - {t: "it uses a lot of technical jargon", why: "ผู้เขียนวิจารณ์การใช้ศัพท์เฉพาะ"}
        - {t: "it is very long", why: "ความหมายกลับกัน"}
        - {t: "it is written as a novel", why: "ในบทไม่ได้พูดเช่นนั้น"}
    - stem: "According to the book, what kind of feedback helps most?"
      choices:
        - {t: "short, specific comments", why: "pithy, specific comments"}
        - {t: "long, general comments", why: "ความหมายกลับกัน"}
        - {t: "grades without comments", why: "ในบทไม่ได้พูดถึง"}
        - {t: "feedback from parents and other family members", why: "ในบทไม่ได้พูดถึง (feedback from parents and other family members)"}
    - stem: "What is the reviewer's criticism?"
      choices:
        - {t: "some parts are too brief", why: "too terse ... in just six pages"}
        - {t: "it is too academic", why: "ผู้วิจารณ์ชมว่าอ่านง่าย"}
        - {t: "the examples are not real", why: "ตัวอย่างมาจากห้องเรียนจริง"}
        - {t: "the book is too expensive for most teachers to buy", why: "ในบทไม่ได้พูดถึงราคา"}
  status: approved
