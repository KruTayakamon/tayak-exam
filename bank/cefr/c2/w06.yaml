# ---------- วันที่ 4 · อ่านจดหมายโต้ตอบและฟังการประชุมที่เห็นต่าง ----------
- id: cefr-c2-w06-035
  kind: read
  skill: rd
  topic: formal-correspondence
  level: 3
  title: "Correspondence · Proposed Changes to the Community Centre Timetable"
  passage: |
    Letter 1 · From the Centre Manager

    Dear members of the Residents' Committee,

    As you know, the centre has faced rising costs this year. Having reviewed the timetable, we propose to close on Sunday afternoons and to move the children's art class from Saturday to a weekday evening. We are confident that these changes will have only a minimal impact on users, and we would be grateful for your support.

    Yours sincerely,
    Pranee Saetang, Centre Manager

    Letter 2 · From the Chair of the Residents' Committee

    Dear Ms Saetang,

    Thank you for your letter and for explaining the financial pressures facing the centre. We fully appreciate that difficult choices have to be made, and we concur that the current timetable cannot continue unchanged.

    With the greatest respect, however, we are not entirely convinced that the impact will be "minimal". Sunday afternoons are, admittedly, quieter than weekdays, but they are the only time many working parents can bring their children. Moving the art class to a weekday evening would, in practice, exclude most of the families who currently attend.

    We would not wish to appear ungrateful, and we are certainly not suggesting that the committee should have the final word. We do wonder, though, whether alternatives have been fully explored. Several members have intimated that they would be willing to volunteer at weekends, which might reduce staffing costs considerably.

    We would welcome the opportunity to discuss this before any decision is taken.

    Yours sincerely,
    Wichai Boonmee, Chair
  questions:
    - stem: Which statement in Letter 1 does the committee challenge?
      choices:
        - {t: that the changes will have only a minimal impact, why: "we are not entirely convinced that the impact will be 'minimal'"}
        - {t: that costs have risen, why: "คณะกรรมการยอมรับเรื่องค่าใช้จ่าย"}
        - {t: that the timetable must change, why: "we concur that the current timetable cannot continue unchanged"}
        - {t: that the manager has reviewed the timetable, why: "ไม่ได้โต้แย้งข้อนี้"}
    - stem: Why does the committee object to moving the art class?
      choices:
        - {t: working parents could not bring their children, why: "would, in practice, exclude most of the families who currently attend"}
        - {t: the art teacher is unavailable, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: weekday rooms are too small, why: "บทไม่ได้พูดว่า weekday rooms are too small"}
        - {t: children prefer Sundays, why: "เหตุผลคือพ่อแม่ทำงาน"}
    - stem: What does the committee suggest as an alternative?
      choices:
        - {t: using volunteers at weekends to cut costs, why: "willing to volunteer at weekends, which might reduce staffing costs"}
        - {t: raising membership fees, why: "ไม่มีข้อเสนอนี้"}
        - {t: closing on weekdays instead, why: "บทไม่ได้พูดว่า closing on weekdays instead"}
        - {t: letting the committee decide, why: "we are certainly not suggesting that the committee should have the final word"}
    - stem: How would you describe the tone of Letter 2?
      choices:
        - {t: polite but firm, why: "สุภาพ (Thank you · With the greatest respect) แต่แย้งชัดเจน"}
        - {t: angry and rude, why: "ไม่มีถ้อยคำหยาบ"}
        - {t: completely supportive, why: "แย้งข้อเสนอสำคัญ"}
        - {t: uncertain and confused, why: "จุดยืนชัดเจน จึงใช้ไม่ได้"}
  status: approved
