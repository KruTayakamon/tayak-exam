# ---------- การอ่าน 2 บท ----------
- id: cefr-c2-cpb-026
  kind: read
  skill: rd
  topic: editorial
  level: 1
  title: "Editorial · Let Our Libraries Stay Open Late (fictional)"
  passage: |
    The city council's decision to close all public libraries at five o'clock, rather than eight, has been presented as a modest saving. It is nothing of the sort. It is a decision that falls hardest on precisely those people libraries exist to serve.

    Consider who uses a library after five. Not, for the most part, retired readers, who can visit during the day. Rather, it is students who need a quiet place to work, adults taking evening courses, and people whose homes are too crowded or too noisy for study. For many of them, the library is not a luxury but the only space available.

    The council argues that evening visitor numbers are low. This is true, but it is also misleading. Visitors in the evening tend to stay far longer than those who drop in during the day, so the number of hours of actual use is considerably higher than the headline figures suggest.

    Nor is the saving as large as claimed. The buildings will still need heating, lighting and security; only staff costs will fall, and even these by less than ten per cent.

    We do not dispute that the council faces difficult choices. But a city that wants to encourage learning should be looking for ways to keep its libraries open longer, not finding reasons to close them early.
  questions:
    - stem: What is the writer's main argument?
      choices:
        - {t: the earlier closing time should be reversed, why: "should be looking for ways to keep its libraries open longer"}
        - {t: the council should close more libraries, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
