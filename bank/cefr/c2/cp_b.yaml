- id: cefr-c2-cpb-027
  kind: read
  skill: rd
  topic: ironic-argument
  level: 3
  title: "A Modest Plea for More Meetings (fictional column)"
  passage: |
    It has become fashionable to complain about meetings. Critics claim that they waste time, interrupt real work and rarely produce decisions. I wish to defend this noble institution.

    Where else, after all, can ten highly paid professionals spend an hour discovering that none of them has read the document under discussion? Where else can a decision that could have been made by one person in five minutes be postponed, with great dignity, to a further meeting? A meeting, properly run, is not merely a waste of time; it is a factory for producing more meetings.

    Meetings also serve an important social function. They allow colleagues who never speak to one another to sit in silence together. They give the most talkative member of every team a guaranteed audience. And they provide the rest of us with a valuable opportunity to answer our emails while appearing to listen.

    Some reformers propose that every meeting should have a clear purpose, a written agenda and a fixed end time. Such ideas are dangerous. A meeting with a purpose might achieve it, and then where would we be? We might be forced to go back to our desks and do the work itself.

    I therefore propose that, from next month, all decisions be taken only after three meetings, at least one of which shall be held to discuss the agenda for the others.
  questions:
    - stem: What is the writer's real view of meetings?
      choices:
        - {t: most meetings are badly run and wasteful, why: "ทั้งบทเป็นการประชด ++defend เพื่อวิจารณ์++"}
        - {t: meetings are the best use of working time, why: "อ่านตามตัวอักษร พลาดการประชด"}
        - {t: meetings should be banned completely, why: "ไม่ได้เสนอให้ห้าม"}
        - {t: only managers should attend meetings, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
    - stem: What does the writer mean by "a factory for producing more meetings"?
      choices:
        - {t: meetings often lead to further meetings instead of decisions, why: "postponed ... to a further meeting"}
        - {t: meetings are most useful in factories, why: "อ่านตามตัวอักษร"}
        - {t: meetings help companies produce more goods, why: "ตรงกันข้าม จึงใช้ไม่ได้"}
        - {t: meetings should be held in factory buildings, why: "ไม่เกี่ยวข้อง จึงใช้ไม่ได้"}
    - stem: Why does the writer call the reformers' ideas "dangerous"?
      choices:
        - {t: to mock the view that meetings should achieve something, why: "A meeting with a purpose might achieve it = ประชด"}
        - {t: because agendas are against company rules, why: "ไม่มีข้อมูลนี้ จึงใช้ไม่ได้"}
        - {t: because the reformers want to cut jobs, why: "ไม่ได้พูดถึง จึงใช้ไม่ได้"}
        - {t: because fixed end times cause stress, why: "บทไม่ได้พูดว่า because fixed end times cause stress"}
    - stem: Which technique does the writer mainly rely on?
      choices:
        - {t: "irony, saying the opposite of what is meant", why: "ทั้งบทชมสิ่งที่ต้องการวิจารณ์"}
        - {t: detailed statistics from research, why: "ไม่มีตัวเลขงานวิจัย"}
        - {t: interviews with office workers, why: "ไม่มีการสัมภาษณ์"}
        - {t: a step-by-step technical guide, why: "ไม่ใช่คู่มือ จึงใช้ไม่ได้"}
