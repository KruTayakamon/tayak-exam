- id: cefr-c2-w05-058
  kind: read
  skill: rd
  topic: paragraph-order
  level: 2
  pool: true
  title: "How One Village Saved Its Forest"
  passage: |
    In 2009, the hills above Ban Pa Daeng were almost bare. Illegal logging had removed most of the large trees, and every rainy season brought landslides into the rice fields below.

    The turning point came when an erstwhile logger, Khun Sombat, persuaded the village council to create a community forest. Families agreed to plant ten trees each year and to take turns guarding the area at night.

    The ensuing years were difficult. Some neighbours objected, chiefly because they relied on selling wood. In lieu of logging income, the council helped them start a mushroom business in the shade of the young trees.

    Today, the forest covers most of the hills, landslides have stopped and the mushroom cooperative employs thirty people. Visitors now come to learn how the aforementioned plan was put into practice.
  questions:
    - stem: "Who started the change?"
      choices:
        - {t: "a former logger", why: "an erstwhile logger, Khun Sombat"}
        - {t: "the village council alone", why: "สภาหมู่บ้านถูกโน้มน้าวโดยสมบัติ"}
        - {t: "visitors from the city", why: "ผู้มาเยือนมาทีหลัง"}
        - {t: "a government officer", why: "ในบทไม่ได้พูดถึง"}
    - stem: "Why did some neighbours object?"
      choices:
        - {t: "they earned money from wood", why: "chiefly because they relied on selling wood"}
        - {t: "they disliked mushrooms", why: "ในบทไม่ได้พูดเช่นนั้น"}
        - {t: "they had to guard at night", why: "ในบทไม่ได้พูดว่านี่คือเหตุผล"}
        - {t: "they wanted to move to the city to find better work", why: "ในบทไม่ได้พูดถึง"}
    - stem: "What replaced income from logging?"
      choices:
        - {t: "a mushroom business", why: "start a mushroom business in the shade of the young trees"}
        - {t: "rice farming", why: "ทำนาอยู่แล้ว ไม่ใช่สิ่งทดแทน"}
        - {t: "tourism only", why: "ผู้มาเยือนมาเรียนรู้ ไม่ใช่รายได้แทน"}
        - {t: "selling young trees to other villages", why: "ในบทไม่ได้พูดถึง"}
  status: approved
